<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Reversible reactions &amp; equilibrium">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#ffffff"/>
<!-- CLOSED SYSTEM: sealed round-bottom flask / sealed box container -->
<g data-part="closedSystem">
  <path d="M60 60 h200 a14 14 0 0 1 14 14 v122 a14 14 0 0 1 -14 14 h-200 a14 14 0 0 1 -14 -14 v-122 a14 14 0 0 1 14 -14 z" fill="#F4F6FC" stroke="#1E2761" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- sealed stopper on top -->
  <rect x="146" y="44" width="28" height="18" rx="4" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.4"/>
  <text x="160" y="30" font-family="sans-serif" font-size="11" fill="#1E2761" text-anchor="middle" font-weight="600">sealed</text>
</g>
<!-- REACTANTS: cluster on the left, blue particles -->
<g data-part="reactants">
  <circle cx="78" cy="110" r="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.4"/>
  <circle cx="98" cy="140" r="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.4"/>
  <circle cx="74" cy="168" r="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.4"/>
</g>
<!-- PRODUCTS: cluster on the right, green particles -->
<g data-part="products">
  <circle cx="242" cy="110" r="10" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.4"/>
  <circle cx="222" cy="140" r="10" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.4"/>
  <circle cx="246" cy="168" r="10" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.4"/>
</g>
<!-- FORWARD REACTION: top arrow L->R -->
<g data-part="forwardReaction">
  <path class="sm-flow" d="M118 122 H202" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
  <polyline points="194,115 204,122 194,129" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- REVERSE REACTION: bottom arrow R->L -->
<g data-part="reverseReaction">
  <path class="sm-flow" d="M202 150 H118" fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
  <polyline points="126,143 116,150 126,157" fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- DOUBLE ARROW symbol: the reversible sign, centred below flask -->
<g data-part="doubleArrow">
  <line x1="132" y1="224" x2="188" y2="224" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
  <polyline points="182,218 190,224 182,230" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="188" y1="236" x2="132" y2="236" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
  <polyline points="138,230 130,236 138,242" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
<g data-part="closedSystem" class="dg-label"><circle cx="160.0" cy="30.0" r="3.4"/><text x="160.0" y="22.0" font-size="12" text-anchor="middle">Closed system</text></g>
<g data-part="reactants" class="dg-label"><circle cx="76.8" cy="130.0" r="3.4"/><text x="76.8" y="122.0" font-size="12" text-anchor="middle">Reactants</text></g>
<g data-part="products" class="dg-label"><circle cx="243.2" cy="125.0" r="3.4"/><text x="243.2" y="117.0" font-size="12" text-anchor="middle">Products</text></g>
<g data-part="forwardReaction" class="dg-label"><circle cx="198.4" cy="90.0" r="3.4"/><text x="198.4" y="82.0" font-size="12" text-anchor="middle">Forward reaction</text></g>
<g data-part="reverseReaction" class="dg-label"><circle cx="128.0" cy="155.0" r="3.4"/><text x="128.0" y="147.0" font-size="12" text-anchor="middle">Reverse reaction</text></g>
<g data-part="doubleArrow" class="dg-label"><circle cx="160.0" cy="120.0" r="3.4"/><text x="160.0" y="112.0" font-size="12" text-anchor="middle">Reversible arrow</text></g>
</svg>
