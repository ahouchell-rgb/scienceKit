<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Static electricity">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="240" fill="#ffffff"/>
<rect x="6" y="6" width="308" height="228" rx="16" fill="#F4F6FC" stroke="#1E2761" stroke-width="1.5"/>

<g data-part="protonCharge">
  <circle cx="256" cy="52" r="30" fill="none" stroke="#7a8199" stroke-width="1.4"/>
  <circle cx="256" cy="52" r="13" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  <g fill="#B4341E"><circle cx="251" cy="49" r="4.5"/><circle cx="261" cy="54" r="4.5"/></g>
  <g fill="#7a8199"><circle cx="258" cy="46" r="4.5"/><circle cx="250" cy="57" r="4.5"/></g>
  <circle cx="286" cy="52" r="4" fill="#1E2761" class="sm-spin"/>
  <circle cx="226" cy="52" r="4" fill="#1E2761" class="sm-spin"/>
</g>

<g data-part="cloth">
  <path d="M32 30 q40 -14 78 0 q10 4 6 16 q-4 12 -18 14 q-38 8 -68 -6 q-10 -5 -8 -18 q1 -12 10 -20 z"
        fill="#C99528" stroke="#8a6614" stroke-width="2.5" class="sm-osc-x"/>
  <path d="M44 40 q30 -8 58 0 M42 50 q30 -6 60 2" fill="none" stroke="#8a6614" stroke-width="1.4" opacity="0.7"/>
  <path class="sm-flow" d="M44 18 L112 18" fill="none" stroke="#8a6614" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="116,18 106,14 106,22" fill="#8a6614"/>
  <g class="sm-rise">
    <circle cx="70" cy="66" r="5" fill="#B4341E" stroke="#7a1f12" stroke-width="1.4"/>
    <circle cx="96" cy="70" r="5" fill="#B4341E" stroke="#7a1f12" stroke-width="1.4"/>
  </g>
</g>

<g data-part="electricField">
  <rect x="60" y="118" width="200" height="108" rx="12" fill="#F1F4FC" stroke="#7a8199" stroke-width="1.4" stroke-dasharray="3 5"/>
</g>

<g data-part="posObject">
  <circle cx="96" cy="172" r="26" fill="#F1D2D8" stroke="#B4341E" stroke-width="3"/>
  <g stroke="#B4341E" stroke-width="3.2" stroke-linecap="round">
    <line x1="96" y1="160" x2="96" y2="184"/><line x1="84" y1="172" x2="108" y2="172"/>
  </g>
</g>

<g data-part="negObject">
  <circle cx="224" cy="172" r="26" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/>
  <line x1="212" y1="172" x2="236" y2="172" stroke="#1E2761" stroke-width="3.2" stroke-linecap="round"/>
</g>

<g data-part="fieldLines">
  <path d="M124 160 q56 -24 74 0" fill="none" stroke="#1E2761" stroke-width="2"/>
  <path d="M124 172 q56 0 74 0" fill="none" stroke="#1E2761" stroke-width="2"/>
  <path d="M124 184 q56 24 74 0" fill="none" stroke="#1E2761" stroke-width="2"/>
</g>

<g data-part="fieldArrow">
  <polygon points="166,150 154,147 157,157" fill="#1E2761"/>
  <polygon points="164,172 152,168 152,176" fill="#1E2761"/>
  <polygon points="166,194 154,187 157,197" fill="#1E2761"/>
</g>

</g>
<g data-part="protonCharge" class="dg-label"><circle cx="73.6" cy="112.8" r="3.4"/><text x="73.6" y="104.8" font-size="12" text-anchor="middle">Proton (+)</text></g>
<g data-part="posObject" class="dg-label"><circle cx="83.2" cy="158.4" r="3.4"/><text x="83.2" y="150.4" font-size="12" text-anchor="middle">Positively Charged Object</text></g>
<g data-part="cloth" class="dg-label"><circle cx="89.6" cy="57.6" r="3.4"/><text x="89.6" y="49.6" font-size="12" text-anchor="middle">Rubbing Cloth</text></g>
<g data-part="negObject" class="dg-label"><circle cx="236.8" cy="158.4" r="3.4"/><text x="236.8" y="150.4" font-size="12" text-anchor="middle">Negatively Charged Object</text></g>
<g data-part="fieldLines" class="dg-label"><circle cx="160.0" cy="76.8" r="3.4"/><text x="160.0" y="68.8" font-size="12" text-anchor="middle">Field Lines</text></g>
<g data-part="fieldArrow" class="dg-label"><circle cx="166.4" cy="127.2" r="3.4"/><text x="166.4" y="119.2" font-size="12" text-anchor="middle">Field Line Arrow</text></g>
<g data-part="electricField" class="dg-label"><circle cx="35.2" cy="192.0" r="3.4"/><text x="42.2" y="184.0" font-size="12" text-anchor="start">Electric Field</text></g>
</svg>
