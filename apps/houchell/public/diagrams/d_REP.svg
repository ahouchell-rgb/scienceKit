<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Reproduction">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="280" fill="#F4F6FC"/><path d="M96 108 C84 168 100 220 160 246 C220 220 236 168 224 108 C210 96 176 92 160 108 C144 92 110 96 96 108 Z" fill="#F7F2E6" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/><path d="M160 246 L160 268 M148 268 L172 268" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/><g data-part="oviduct"><path d="M100 104 C78 76 54 84 50 108" fill="none" stroke="#2C5F2D" stroke-width="4" stroke-linecap="round"/><path d="M220 104 C242 76 266 84 270 108" fill="none" stroke="#2C5F2D" stroke-width="4" stroke-linecap="round"/><path class="sm-flow" d="M270 108 C266 84 242 76 220 104" fill="none" stroke="#C99528" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/></g><g data-part="ovary"><ellipse cx="42" cy="120" rx="20" ry="14" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="3"/><circle cx="42" cy="120" r="5" fill="#F7F2E6" stroke="#2C5F2D" stroke-width="2"/><ellipse cx="278" cy="120" rx="20" ry="14" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="3"/><circle cx="278" cy="120" r="5" fill="#F7F2E6" stroke="#2C5F2D" stroke-width="2"/></g><g data-part="sperm"><g class="sm-drift" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"><ellipse cx="250" cy="52" rx="7" ry="5" fill="#AEB6D6"/><path d="M243 52 C238 48 236 56 231 52" fill="none"/><ellipse cx="268" cy="66" rx="6" ry="4.5" fill="#AEB6D6"/><path d="M262 66 C257 63 255 71 250 67" fill="none"/><ellipse cx="238" cy="74" rx="6" ry="4.5" fill="#AEB6D6"/><path d="M232 74 C227 71 225 79 220 75" fill="none"/></g></g><g data-part="fetus"><g class="sm-throb"><circle cx="184" cy="180" r="28" fill="#F1D2D8" stroke="#B4341E" stroke-width="3"/><circle cx="196" cy="165" r="11" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="199" cy="164" r="1.8" fill="#B4341E"/><path d="M184 152 C193 166 194 200 186 210" fill="none" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><path d="M174 188 C182 192 190 190 194 184" fill="none" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/></g></g><g data-part="placenta"><path d="M98 150 C82 168 86 194 112 204 C132 194 138 166 122 150 Q110 143 98 150 Z" fill="#E0879A" stroke="#B4341E" stroke-width="2.5" stroke-linejoin="round"/><path d="M104 160 q6 9 4 20 M114 156 q4 11 0 22 M124 162 q2 9 -2 18" fill="none" stroke="#B4341E" stroke-width="1.5" stroke-opacity="0.55"/></g><g data-part="umbilicalCord"><path class="sm-flow" d="M120 182 C138 176 150 178 156 186" fill="none" stroke="#B4341E" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 5"/></g>
</g>
<g data-part="ovary" class="dg-label"><circle cx="48.0" cy="117.6" r="3.4"/><text x="55.0" y="109.6" font-size="12" text-anchor="start">Ovary</text></g>
<g data-part="oviduct" class="dg-label"><circle cx="76.8" cy="86.8" r="3.4"/><text x="76.8" y="78.8" font-size="12" text-anchor="middle">Oviduct</text></g>
<g data-part="sperm" class="dg-label"><circle cx="256.0" cy="72.8" r="3.4"/><text x="249.0" y="64.8" font-size="12" text-anchor="end">Sperm</text></g>
<g data-part="placenta" class="dg-label"><circle cx="102.4" cy="187.6" r="3.4"/><text x="102.4" y="179.6" font-size="12" text-anchor="middle">Placenta</text></g>
<g data-part="umbilicalCord" class="dg-label"><circle cx="144.0" cy="168.0" r="3.4"/><text x="144.0" y="160.0" font-size="12" text-anchor="middle">Umbilical cord</text></g>
<g data-part="fetus" class="dg-label"><circle cx="198.4" cy="176.4" r="3.4"/><text x="198.4" y="168.4" font-size="12" text-anchor="middle">Fetus</text></g>
</svg>
