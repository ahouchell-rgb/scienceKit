<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Elements and compounds">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#F4F6FC"/><g data-part="elementBox"><rect x="10" y="30" width="86" height="86" rx="10" fill="#ffffff" stroke="#1E2761" stroke-width="3"/><circle cx="36" cy="56" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/><circle cx="70" cy="56" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/><circle cx="36" cy="90" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/><circle cx="70" cy="90" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/></g><g data-part="compoundBox"><rect x="117" y="30" width="86" height="86" rx="10" fill="#ffffff" stroke="#1E2761" stroke-width="3"/><circle cx="140" cy="58" r="11" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><circle cx="180" cy="58" r="11" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="140" cy="92" r="11" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="180" cy="92" r="11" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/></g><g data-part="bond"><line x1="151" y1="58" x2="169" y2="58" stroke="#C99528" stroke-width="4" stroke-linecap="round"/><line x1="140" y1="69" x2="140" y2="81" stroke="#C99528" stroke-width="4" stroke-linecap="round"/><line x1="180" y1="69" x2="180" y2="81" stroke="#C99528" stroke-width="4" stroke-linecap="round"/><line x1="151" y1="92" x2="169" y2="92" stroke="#C99528" stroke-width="4" stroke-linecap="round"/></g><g data-part="mixtureBox"><rect x="224" y="30" width="86" height="86" rx="10" fill="#ffffff" stroke="#1E2761" stroke-width="3"/><circle cx="248" cy="52" r="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><circle cx="285" cy="63" r="10" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="258" cy="84" r="10" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="290" cy="94" r="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><circle cx="245" cy="98" r="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/></g><g data-part="formulaUnit"><rect x="26" y="158" width="120" height="58" rx="10" fill="#ffffff" stroke="#1E2761" stroke-width="2.5"/><text x="60" y="198" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#1E2761">H</text><text x="78" y="206" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#B4341E">2</text><text x="90" y="198" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#1E2761">O</text></g><g data-part="newProperties"><circle cx="186" cy="186" r="16" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><circle cx="216" cy="186" r="16" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><path class="sm-flow" d="M238 186 L266 186" fill="none" stroke="#2C5F2D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#elcArrow)"/><rect x="272" y="170" width="34" height="34" rx="6" fill="#ffffff" stroke="#2C5F2D" stroke-width="2.5"/><line x1="279" y1="177" x2="299" y2="197" stroke="#7a8199" stroke-width="1.5"/><line x1="299" y1="177" x2="279" y2="197" stroke="#7a8199" stroke-width="1.5"/><circle cx="289" cy="187" r="7" fill="#F4F6FC" stroke="#1E2761" stroke-width="1.5"/></g><defs><marker id="elcArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2C5F2D"/></marker></defs>
</g>
<g data-part="elementBox" class="dg-label"><circle cx="57.6" cy="42.5" r="3.4"/><text x="64.6" y="34.5" font-size="12" text-anchor="start">Element</text></g>
<g data-part="compoundBox" class="dg-label"><circle cx="160.0" cy="42.5" r="3.4"/><text x="160.0" y="34.5" font-size="12" text-anchor="middle">Compound</text></g>
<g data-part="mixtureBox" class="dg-label"><circle cx="262.4" cy="42.5" r="3.4"/><text x="255.4" y="34.5" font-size="12" text-anchor="end">Mixture</text></g>
<g data-part="bond" class="dg-label"><circle cx="160.0" cy="95.0" r="3.4"/><text x="160.0" y="87.0" font-size="12" text-anchor="middle">Chemical bond</text></g>
<g data-part="formulaUnit" class="dg-label"><circle cx="83.2" cy="187.5" r="3.4"/><text x="83.2" y="179.5" font-size="12" text-anchor="middle">Molecule (formula)</text></g>
<g data-part="newProperties" class="dg-label"><circle cx="236.8" cy="187.5" r="3.4"/><text x="236.8" y="179.5" font-size="12" text-anchor="middle">New properties</text></g>
</svg>
