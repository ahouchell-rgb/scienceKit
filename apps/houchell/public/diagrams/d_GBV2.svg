<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Genetics &amp; inheritance">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x='0' y='0' width='320' height='280' fill='#ffffff'/><g data-part='parentAlleles'><rect x='118' y='16' width='36' height='24' rx='5' fill='#DCEAF6' stroke='#1E2761' stroke-width='2'/><text x='136' y='33' font-size='13' fill='#1E2761' text-anchor='middle' font-weight='bold'>Bb</text><rect x='16' y='96' width='24' height='36' rx='5' fill='#DCEAF6' stroke='#1E2761' stroke-width='2'/><text x='28' y='120' font-size='13' fill='#1E2761' text-anchor='middle' font-weight='bold'>Bb</text><line x1='136' y1='42' x2='136' y2='58' stroke='#7a8199' stroke-width='2'/><line x1='42' y1='114' x2='58' y2='114' stroke='#7a8199' stroke-width='2'/></g><rect x='60' y='60' width='140' height='140' fill='#F4F6FC' stroke='#1E2761' stroke-width='2.5'/><line x1='130' y1='60' x2='130' y2='200' stroke='#1E2761' stroke-width='2'/><line x1='60' y1='130' x2='200' y2='130' stroke='#1E2761' stroke-width='2'/><text x='95' y='54' font-size='12' fill='#1E2761' text-anchor='middle' font-weight='bold'>B</text><text x='165' y='54' font-size='12' fill='#1E2761' text-anchor='middle' font-weight='bold'>b</text><text x='50' y='99' font-size='12' fill='#1E2761' text-anchor='middle' font-weight='bold'>B</text><text x='50' y='169' font-size='12' fill='#1E2761' text-anchor='middle' font-weight='bold'>b</text><g data-part='dominantOffspring'><rect x='62' y='62' width='66' height='66' fill='#CDE5C6'/><text x='95' y='102' font-size='15' fill='#2C5F2D' text-anchor='middle' font-weight='bold'>BB</text></g><g data-part='heterozygous'><rect x='132' y='62' width='66' height='66' fill='#DCEAF6'/><text x='165' y='102' font-size='15' fill='#2C5F2D' text-anchor='middle' font-weight='bold'>Bb</text></g><g data-part='recessiveOffspring'><rect x='132' y='132' width='66' height='66' fill='#F1D2D8'/><text x='165' y='172' font-size='15' fill='#B4341E' text-anchor='middle' font-weight='bold'>bb</text></g><g data-part='ratio'><rect x='222' y='96' width='84' height='40' rx='8' fill='#F7F2E6' stroke='#C99528' stroke-width='2.5'/><text x='264' y='123' font-size='18' fill='#3a2f14' text-anchor='middle' font-weight='bold'>3 : 1</text></g><g data-part='sexChromosomes'><rect x='60' y='224' width='200' height='44' rx='8' fill='#F4F6FC' stroke='#7a8199' stroke-width='2'/><text x='104' y='250' font-size='15' fill='#B4341E' text-anchor='middle' font-weight='bold'>XX</text><text x='104' y='263' font-size='8' fill='#7a8199' text-anchor='middle'>female</text><text x='216' y='250' font-size='15' fill='#1E2761' text-anchor='middle' font-weight='bold'>XY</text><text x='216' y='263' font-size='8' fill='#7a8199' text-anchor='middle'>male</text><line x1='140' y1='246' x2='180' y2='246' stroke='#7a8199' stroke-width='1.5'/></g>
</g>
<g data-part="parentAlleles" class="dg-label"><circle cx="115.2" cy="33.6" r="3.4"/><text x="115.2" y="25.6" font-size="12" text-anchor="middle">Parent alleles</text></g>
<g data-part="dominantOffspring" class="dg-label"><circle cx="118.4" cy="98.0" r="3.4"/><text x="118.4" y="90.0" font-size="12" text-anchor="middle">Dominant offspring</text></g>
<g data-part="heterozygous" class="dg-label"><circle cx="204.8" cy="98.0" r="3.4"/><text x="204.8" y="90.0" font-size="12" text-anchor="middle">Heterozygous (Bb)</text></g>
<g data-part="recessiveOffspring" class="dg-label"><circle cx="204.8" cy="187.6" r="3.4"/><text x="204.8" y="179.6" font-size="12" text-anchor="middle">Recessive (bb)</text></g>
<g data-part="ratio" class="dg-label"><circle cx="284.8" cy="140.0" r="3.4"/><text x="277.8" y="132.0" font-size="12" text-anchor="end">3 : 1 ratio</text></g>
<g data-part="sexChromosomes" class="dg-label"><circle cx="233.6" cy="257.6" r="3.4"/><text x="233.6" y="249.6" font-size="12" text-anchor="middle">XX / XY sex</text></g>
</svg>
