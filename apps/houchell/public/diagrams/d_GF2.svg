  <line x1="80" y1="196" x2="80" y2="222" stroke="#B4341E" stroke-width="3" stroke-linecap="round" marker-end="url(#ar2)"/>
</g>
<line x1="196" y1="222" x2="196" y2="48" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
<line x1="196" y1="222" x2="308" y2="222" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
<text x="192" y="44" font-family="sans-serif" font-size="11" fill="#1E2761" text-anchor="end">F</text>
<text x="312" y="226" font-family="sans-serif" font-size="11" fill="#1E2761">e</text>
<g data-part="linearRegion">
  <line x1="196" y1="222" x2="272" y2="96" stroke="#2C5F2D" stroke-width="3.5" stroke-linecap="round"/>
</g>
<g data-part="limitPoint">
  <path d="M272 96 q14 -18 30 -42" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="272" cy="96" r="5" fill="#fff" stroke="#B4341E" stroke-width="2.5"/>
</g>
</g>
<g data-part="spring" class="dg-label"><circle cx="64.0" cy="75.0" r="3.4"/><text x="71.0" y="67.0" font-size="12" text-anchor="start">Spring</text></g>
<g data-part="mass" class="dg-label"><circle cx="64.0" cy="125.0" r="3.4"/><text x="71.0" y="117.0" font-size="12" text-anchor="start">Mass (force)</text></g>
<g data-part="ruler" class="dg-label"><circle cx="115.2" cy="105.0" r="3.4"/><text x="115.2" y="97.0" font-size="12" text-anchor="middle">Ruler</text></g>
<g data-part="extension" class="dg-label"><circle cx="214.4" cy="230.0" r="3.4"/><text x="214.4" y="222.0" font-size="12" text-anchor="middle">Extension</text></g>
<g data-part="linearRegion" class="dg-label"><circle cx="198.4" cy="155.0" r="3.4"/><text x="198.4" y="147.0" font-size="12" text-anchor="middle">Hooke's law (linear)</text></g>
<g data-part="limitPoint" class="dg-label"><circle cx="265.6" cy="90.0" r="3.4"/><text x="258.6" y="82.0" font-size="12" text-anchor="end">Limit of proportionality</text></g>
</svg>
