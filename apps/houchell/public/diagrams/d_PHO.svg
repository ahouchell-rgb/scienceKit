<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Photosynthesis">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="270" fill="#FFFFFF"/>
<rect x="0" y="0" width="320" height="270" fill="#F4F6FC" opacity="0.5"/>
<rect x="0" y="238" width="320" height="32" fill="#E6D9C2"/>
<line x1="0" y1="238" x2="320" y2="238" stroke="#7a8199" stroke-width="1.5"/>
<path d="M150 238 C150 200 150 150 158 120" fill="none" stroke="#2C5F2D" stroke-width="5" stroke-linecap="round"/>
<g data-part="sunlight">
  <circle cx="48" cy="40" r="22" fill="#C99528" class="sm-glow"/>
  <g stroke="#C99528" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="8" x2="48" y2="-2"/>
    <line x1="18" y1="18" x2="10" y2="10"/>
    <line x1="78" y1="18" x2="86" y2="10"/>
    <line x1="16" y1="40" x2="4" y2="40"/>
  </g>
  <g stroke="#C99528" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 6" class="sm-flow">
    <line x1="66" y1="56" x2="140" y2="120"/>
    <line x1="74" y1="46" x2="150" y2="96"/>
    <line x1="56" y1="66" x2="128" y2="140"/>
  </g>
</g>
<path d="M158 118 C120 96 96 108 92 148 C136 158 168 146 174 116 Z"
      fill="#CDE5C6" stroke="#2C5F2D" stroke-width="3" stroke-linejoin="round"/>
<path d="M172 120 C140 132 116 138 96 146" fill="none" stroke="#2C5F2D" stroke-width="2"/>
<g data-part="chloroplast">
  <line x1="128" y1="140" x2="196" y2="196" stroke="#7a8199" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="140" y1="146" x2="238" y2="196" stroke="#7a8199" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="234" cy="200" r="30" fill="#FFFFFF" stroke="#2C5F2D" stroke-width="2.5"/>
  <ellipse cx="234" cy="200" rx="22" ry="14" fill="#2C5F2D"/>
  <g stroke="#CDE5C6" stroke-width="2.4">
    <line x1="220" y1="196" x2="230" y2="196"/>
    <line x1="220" y1="200" x2="230" y2="200"/>
    <line x1="220" y1="204" x2="230" y2="204"/>
    <line x1="238" y1="196" x2="248" y2="196"/>
    <line x1="238" y1="200" x2="248" y2="200"/>
    <line x1="238" y1="204" x2="248" y2="204"/>
  </g>
</g>
<g data-part="carbonDioxide">
  <g class="sm-drift">
    <circle cx="288" cy="120" r="5.5" fill="#7a8199"/>
    <circle cx="278" cy="120" r="3.6" fill="#B4341E"/>
    <circle cx="298" cy="120" r="3.6" fill="#B4341E"/>
    <circle cx="288" cy="145" r="5.5" fill="#7a8199"/>
    <circle cx="278" cy="145" r="3.6" fill="#B4341E"/>
    <circle cx="298" cy="145" r="3.6" fill="#B4341E"/>
  </g>
  <path d="M270 132 H196" fill="none" stroke="#7a8199" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5" class="sm-flow"/>
  <path d="M196 132 l8 -4 M196 132 l8 4" fill="none" stroke="#7a8199" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g data-part="water">
  <g class="sm-rise">
    <circle cx="146" cy="215" r="4.5" fill="#2b6cb0"/>
    <circle cx="150" cy="228" r="4" fill="#2b6cb0"/>
  </g>
  <path d="M150 234 C150 210 150 175 156 138" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" class="sm-flow"/>
  <path d="M156 138 l-5 8 M156 138 l5 6" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g data-part="oxygen">
  <path d="M100 148 C86 128 78 108 78 88" fill="none" stroke="#2C5F2D" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 5" class="sm-flow"/>
  <path d="M78 88 l-5 9 M78 88 l6 8" fill="none" stroke="#2C5F2D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sm-rise">
    <circle cx="70" cy="80" r="6" fill="#2C5F2D"/>
    <circle cx="82" cy="80" r="6" fill="#2C5F2D"/>
  </g>
</g>
<g data-part="glucose">
  <g class="sm-throb">
    <circle cx="120" cy="196" r="6" fill="#C99528"/>
    <circle cx="132" cy="188" r="6" fill="#C99528"/>
    <circle cx="132" cy="204" r="6" fill="#C99528"/>
    <circle cx="144" cy="196" r="6" fill="#C99528"/>
    <path d="M120 196 l12 -8 M132 188 l12 8 M144 196 l-12 8 M132 204 l-12 -8" stroke="#C99528" stroke-width="2"/>
  </g>
</g>
<g data-part="stoma">
  <ellipse cx="112" cy="176" rx="16" ry="8" fill="none" stroke="#2C5F2D" stroke-width="2.6"/>
  <ellipse cx="112" cy="176" rx="5" ry="7" fill="#DCEAF6" stroke="#2C5F2D" stroke-width="2"/>
</g>
</g>
<g data-part="sunlight" class="dg-label"><circle cx="54.4" cy="43.2" r="3.4"/><text x="61.4" y="35.2" font-size="12" text-anchor="start">Sunlight</text></g>
<g data-part="chloroplast" class="dg-label"><circle cx="249.6" cy="199.8" r="3.4"/><text x="249.6" y="191.8" font-size="12" text-anchor="middle">Chloroplast</text></g>
<g data-part="carbonDioxide" class="dg-label"><circle cx="76.8" cy="170.1" r="3.4"/><text x="76.8" y="162.1" font-size="12" text-anchor="middle">Carbon dioxide</text></g>
<g data-part="water" class="dg-label"><circle cx="96.0" cy="224.1" r="3.4"/><text x="96.0" y="216.1" font-size="12" text-anchor="middle">Water</text></g>
<g data-part="oxygen" class="dg-label"><circle cx="211.2" cy="140.4" r="3.4"/><text x="211.2" y="132.4" font-size="12" text-anchor="middle">Oxygen</text></g>
<g data-part="glucose" class="dg-label"><circle cx="249.6" cy="248.4" r="3.4"/><text x="249.6" y="240.4" font-size="12" text-anchor="middle">Glucose</text></g>
<g data-part="stoma" class="dg-label"><circle cx="169.6" cy="240.3" r="3.4"/><text x="169.6" y="232.3" font-size="12" text-anchor="middle">Stoma</text></g>
</svg>
