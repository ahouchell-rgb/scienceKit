<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Energy">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x='0' y='0' width='320' height='230' fill='#F4F6FC'/><line x1='78' y1='150' x2='112' y2='150' stroke='#7a8199' stroke-width='4' stroke-linecap='round'/><line x1='170' y1='150' x2='198' y2='150' stroke='#7a8199' stroke-width='4' stroke-linecap='round'/><g data-part='boiler'><rect x='20' y='120' width='58' height='74' rx='6' fill='#F7F2E6' stroke='#1E2761' stroke-width='3'/><g class='sm-rise'><path d='M40 120 q-6 -12 0 -22 q6 10 0 22' fill='#DCEAF6' stroke='#7a8199' stroke-width='2'/><path d='M56 120 q-6 -12 0 -22 q6 10 0 22' fill='#DCEAF6' stroke='#7a8199' stroke-width='2'/></g></g><g data-part='fuel'><rect x='26' y='168' width='46' height='24' rx='4' fill='#F1D2D8' stroke='#B4341E' stroke-width='2.5'/><g class='sm-glow'><path d='M34 188 q4 -16 8 0 q4 -16 8 0 q4 -16 8 0' fill='none' stroke='#B4341E' stroke-width='2.5' stroke-linecap='round'/></g></g><g data-part='turbine'><circle cx='141' cy='150' r='30' fill='#F4F6FC' stroke='#1E2761' stroke-width='3'/><g class='sm-spin'><circle cx='141' cy='150' r='5' fill='#1E2761'/><line x1='141' y1='150' x2='141' y2='124' stroke='#1E2761' stroke-width='3' stroke-linecap='round'/><line x1='141' y1='150' x2='164' y2='163' stroke='#1E2761' stroke-width='3' stroke-linecap='round'/><line x1='141' y1='150' x2='118' y2='163' stroke='#1E2761' stroke-width='3' stroke-linecap='round'/></g></g><g data-part='generator'><rect x='198' y='130' width='50' height='40' rx='6' fill='#CDE5C6' stroke='#2C5F2D' stroke-width='3'/><circle cx='223' cy='150' r='12' fill='none' stroke='#2C5F2D' stroke-width='2.5'/><text x='223' y='155' font-size='13' fill='#2C5F2D' text-anchor='middle' font-family='sans-serif' font-weight='bold'>G</text></g><line class='sm-flow' x1='248' y1='150' x2='276' y2='150' stroke='#C99528' stroke-width='3' stroke-dasharray='6 5'/><g data-part='pylon'><polygon points='288,110 272,200 304,200' fill='none' stroke='#1E2761' stroke-width='3'/><line x1='268' y1='128' x2='308' y2='128' stroke='#1E2761' stroke-width='3'/><line x1='272' y1='150' x2='304' y2='150' stroke='#1E2761' stroke-width='3'/><line x1='280' y1='150' x2='283' y2='200' stroke='#1E2761' stroke-width='2'/><line x1='296' y1='150' x2='293' y2='200' stroke='#1E2761' stroke-width='2'/><path d='M268 128 q10 8 20 0' fill='none' stroke='#C99528' stroke-width='2'/><path d='M288 128 q10 8 20 0' fill='none' stroke='#C99528' stroke-width='2'/></g><g data-part='windTurbine'><line x1='141' y1='96' x2='141' y2='58' stroke='#1E2761' stroke-width='3'/><g class='sm-spin-slow'><circle cx='141' cy='40' r='4' fill='#1E2761'/><path d='M141 40 L141 12 L149 20 Z' fill='#DCEAF6' stroke='#1E2761' stroke-width='2'/><path d='M141 40 L165 54 L155 60 Z' fill='#DCEAF6' stroke='#1E2761' stroke-width='2'/><path d='M141 40 L117 54 L127 60 Z' fill='#DCEAF6' stroke='#1E2761' stroke-width='2'/></g><line x1='160' y1='78' x2='210' y2='120' stroke='#2C5F2D' stroke-width='2.5' stroke-dasharray='5 4'/><polygon points='210,124 200,116 208,111' fill='#2C5F2D'/></g>
</g>
<g data-part="fuel" class="dg-label"><circle cx="48.0" cy="184.0" r="3.4"/><text x="55.0" y="176.0" font-size="12" text-anchor="start">Fuel (chemical store)</text></g>
<g data-part="boiler" class="dg-label"><circle cx="44.8" cy="115.0" r="3.4"/><text x="51.8" y="107.0" font-size="12" text-anchor="start">Boiler (thermal store)</text></g>
<g data-part="turbine" class="dg-label"><circle cx="150.4" cy="167.9" r="3.4"/><text x="150.4" y="159.9" font-size="12" text-anchor="middle">Turbine</text></g>
<g data-part="generator" class="dg-label"><circle cx="220.8" cy="170.2" r="3.4"/><text x="220.8" y="162.2" font-size="12" text-anchor="middle">Generator</text></g>
<g data-part="pylon" class="dg-label"><circle cx="288.0" cy="177.1" r="3.4"/><text x="281.0" y="169.1" font-size="12" text-anchor="end">Pylon (electricity)</text></g>
<g data-part="windTurbine" class="dg-label"><circle cx="275.2" cy="50.6" r="3.4"/><text x="268.2" y="42.6" font-size="12" text-anchor="end">Wind turbine (renewable)</text></g>
</svg>
