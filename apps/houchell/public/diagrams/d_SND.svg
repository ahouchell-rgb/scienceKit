<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Waves and sound">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="260" fill="#F4F6FC"/>
<g data-part="source">
  <rect x="18" y="44" width="18" height="44" rx="3" fill="#1E2761"/>
  <path class="sm-osc-x" d="M36 40 L60 30 L60 102 L36 88 Z" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
  <path d="M64 48 a18 18 0 0 1 0 36" fill="none" stroke="#B4341E" stroke-width="2" opacity="0.7" class="sm-glow"/>
</g>
<g data-part="airParticles">
  <g fill="#1E2761" class="sm-drift">
    <circle cx="150" cy="52" r="3"/><circle cx="150" cy="66" r="3"/><circle cx="150" cy="80" r="3"/>
    <circle cx="196" cy="52" r="3"/><circle cx="196" cy="66" r="3"/><circle cx="196" cy="80" r="3"/>
    <circle cx="242" cy="52" r="3"/><circle cx="242" cy="66" r="3"/><circle cx="242" cy="80" r="3"/>
  </g>
</g>
<g data-part="compression">
  <g fill="#B4341E" class="sm-drift">
    <circle cx="98" cy="52" r="3.4"/><circle cx="104" cy="52" r="3.4"/><circle cx="92" cy="52" r="3.4"/>
    <circle cx="98" cy="66" r="3.4"/><circle cx="104" cy="66" r="3.4"/><circle cx="92" cy="66" r="3.4"/>
    <circle cx="98" cy="80" r="3.4"/><circle cx="104" cy="80" r="3.4"/><circle cx="92" cy="80" r="3.4"/>
    <circle cx="174" cy="52" r="3.4"/><circle cx="180" cy="52" r="3.4"/><circle cx="168" cy="52" r="3.4"/>
    <circle cx="174" cy="66" r="3.4"/><circle cx="180" cy="66" r="3.4"/><circle cx="168" cy="66" r="3.4"/>
    <circle cx="174" cy="80" r="3.4"/><circle cx="180" cy="80" r="3.4"/><circle cx="168" cy="80" r="3.4"/>
  </g>
  <path class="sm-flow" d="M120 96 L232 96" fill="none" stroke="#7a8199" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M232 96 l-10 -4 l0 8 z" fill="#7a8199"/>
</g>
<g data-part="earDrum">
  <path d="M266 40 a30 34 0 1 0 6 66 q-14 -4 -10 -18" fill="#F1D2D8" stroke="#1E2761" stroke-width="2.5"/>
  <path class="sm-osc-x" d="M286 54 L286 92" stroke="#B4341E" stroke-width="3" stroke-linecap="round"/>
</g>
<line x1="20" y1="128" x2="300" y2="128" stroke="#DCEAF6" stroke-width="2"/>
<line x1="30" y1="196" x2="300" y2="196" stroke="#7a8199" stroke-width="1.6"/>
<line x1="30" y1="150" x2="30" y2="242" stroke="#7a8199" stroke-width="1.6"/>
<g data-part="transverseWave">
  <path class="sm-osc" d="M30 196 C 52 150, 74 150, 96 196 S 140 242, 162 196 S 206 150, 228 196 S 272 242, 294 196" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
</g>
<g data-part="wavelength">
  <line x1="63" y1="150" x2="63" y2="138" stroke="#1E2761" stroke-width="1.4"/>
  <line x1="195" y1="150" x2="195" y2="138" stroke="#1E2761" stroke-width="1.4"/>
  <line x1="63" y1="144" x2="195" y2="144" stroke="#1E2761" stroke-width="2"/>
  <path d="M63 144 l10 -4 l0 8 z" fill="#1E2761"/>
  <path d="M195 144 l-10 -4 l0 8 z" fill="#1E2761"/>
</g>
<g data-part="amplitude">
  <line x1="129" y1="196" x2="129" y2="242" stroke="#B4341E" stroke-width="2"/>
  <path d="M129 196 l-4 10 l8 0 z" fill="#B4341E"/>
  <path d="M129 242 l-4 -10 l8 0 z" fill="#B4341E"/>
</g>
</g>
<g data-part="transverseWave" class="dg-label"><circle cx="201.6" cy="46.8" r="3.4"/><text x="201.6" y="38.8" font-size="12" text-anchor="middle">Transverse wave</text></g>
<g data-part="wavelength" class="dg-label"><circle cx="128.0" cy="20.8" r="3.4"/><text x="128.0" y="40.8" font-size="12" text-anchor="middle">Wavelength</text></g>
<g data-part="amplitude" class="dg-label"><circle cx="83.2" cy="93.6" r="3.4"/><text x="83.2" y="85.6" font-size="12" text-anchor="middle">Amplitude</text></g>
<g data-part="source" class="dg-label"><circle cx="35.2" cy="179.4" r="3.4"/><text x="42.2" y="171.4" font-size="12" text-anchor="start">Vibrating source</text></g>
<g data-part="airParticles" class="dg-label"><circle cx="156.8" cy="163.8" r="3.4"/><text x="156.8" y="155.8" font-size="12" text-anchor="middle">Air particles (medium)</text></g>
<g data-part="compression" class="dg-label"><circle cx="115.2" cy="218.4" r="3.4"/><text x="115.2" y="210.4" font-size="12" text-anchor="middle">Compression</text></g>
<g data-part="earDrum" class="dg-label"><circle cx="284.8" cy="169.0" r="3.4"/><text x="277.8" y="161.0" font-size="12" text-anchor="end">Ear drum / diaphragm</text></g>
</svg>
