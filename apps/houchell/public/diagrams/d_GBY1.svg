<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ecosystems &amp; adaptation">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="260" fill="#DCEAF6"/><g data-part="soil"><path d="M0 200 Q60 186 130 196 Q210 208 260 196 Q300 188 320 198 L320 260 L0 260 Z" fill="#CBB089" stroke="#1E2761" stroke-width="2.5"/><path d="M0 214 Q80 204 160 212 Q240 220 320 210" fill="none" stroke="#9c7a4a" stroke-width="1.5" stroke-opacity="0.6"/><g stroke="#5a7fb0" stroke-width="2" stroke-linecap="round"><path d="M40 236 q4 8 -2 12 M120 240 q4 8 -2 12 M230 236 q4 8 -2 12"/></g></g><g data-part="sun"><g class="sm-glow"><circle cx="54" cy="46" r="26" fill="#F7E3A0" stroke="#C99528" stroke-width="3"/><g stroke="#C99528" stroke-width="3" stroke-linecap="round"><line x1="54" y1="8" x2="54" y2="16"/><line x1="54" y1="76" x2="54" y2="84"/><line x1="16" y1="46" x2="24" y2="46"/><line x1="84" y1="46" x2="92" y2="46"/><line x1="27" y1="19" x2="33" y2="25"/><line x1="75" y1="67" x2="81" y2="73"/><line x1="81" y1="19" x2="75" y2="25"/><line x1="33" y1="67" x2="27" y2="73"/></g></g><g class="sm-fall" stroke="#C99528" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"><line x1="66" y1="74" x2="150" y2="176"/></g></g><g data-part="cactus"><g stroke="#2C5F2D" stroke-width="3" fill="#5B9B5C" stroke-linejoin="round"><path d="M262 200 L262 120 Q262 108 272 108 Q282 108 282 120 L282 200 Z"/><path d="M262 156 Q244 156 244 138 Q244 128 252 128 L252 148 L262 148 Z"/><path d="M282 146 Q300 146 300 128 Q300 120 292 120 L292 140 L282 140 Z"/></g><g stroke="#2C5F2D" stroke-width="2" stroke-linecap="round"><line x1="255" y1="130" x2="249" y2="126"/><line x1="255" y1="150" x2="249" y2="147"/><line x1="289" y1="130" x2="295" y2="126"/><line x1="272" y1="116" x2="272" y2="110"/></g></g><g data-part="producer"><g stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="66" y1="200" x2="66" y2="164"/><path d="M66 184 Q50 180 46 164 Q62 162 66 176 Z" fill="#7BB86B"/><path d="M66 176 Q82 170 88 154 Q70 152 66 168 Z" fill="#7BB86B"/><path d="M66 200 Q60 196 54 198 M66 200 Q72 196 78 198" fill="none"/></g></g><g data-part="herbivore"><g stroke="#1E2761" stroke-width="2.5" fill="#B8BEDC" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="150" cy="180" rx="24" ry="14"/><circle cx="128" cy="170" r="10"/><path d="M124 162 L120 152 M131 161 L134 151" fill="none"/><circle cx="124" cy="169" r="1.6" fill="#1E2761"/><line x1="140" y1="192" x2="140" y2="200"/><line x1="160" y1="192" x2="160" y2="200"/><path d="M174 178 q10 -8 8 -18" fill="none"/></g></g><g data-part="predator"><g stroke="#B4341E" stroke-width="2.5" fill="#E39B6B" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="256" cy="178" rx="26" ry="14"/><circle cx="282" cy="166" r="12"/><path d="M276 157 l2 -10 l6 7 z M290 157 l-2 -10 l-6 7 z" fill="#E39B6B"/><circle cx="286" cy="166" r="1.8" fill="#1E2761"/><line x1="244" y1="190" x2="244" y2="200"/><line x1="266" y1="190" x2="266" y2="200"/><path d="M230 182 q-12 2 -16 12" fill="none"/></g></g><g stroke="#1E2761" stroke-width="3" fill="#1E2761" stroke-linecap="round"><path class="sm-flow" d="M86 178 L120 176" fill="none" stroke-dasharray="6 6"/><path d="M126 176 l-11 -5 v10 z"/><path class="sm-flow" d="M178 178 L226 178" fill="none" stroke-dasharray="6 6"/><path d="M232 178 l-11 -5 v10 z"/></g>
</g>
<g data-part="sun" class="dg-label"><circle cx="57.6" cy="49.4" r="3.4"/><text x="64.6" y="41.4" font-size="12" text-anchor="start">Sun (light)</text></g>
<g data-part="cactus" class="dg-label"><circle cx="128.0" cy="130.0" r="3.4"/><text x="128.0" y="122.0" font-size="12" text-anchor="middle">Cactus (adapted)</text></g>
<g data-part="producer" class="dg-label"><circle cx="195.2" cy="176.8" r="3.4"/><text x="195.2" y="168.8" font-size="12" text-anchor="middle">Producer</text></g>
<g data-part="herbivore" class="dg-label"><circle cx="185.6" cy="221.0" r="3.4"/><text x="185.6" y="213.0" font-size="12" text-anchor="middle">Herbivore</text></g>
<g data-part="predator" class="dg-label"><circle cx="288.0" cy="202.8" r="3.4"/><text x="281.0" y="194.8" font-size="12" text-anchor="end">Predator</text></g>
<g data-part="soil" class="dg-label"><circle cx="64.0" cy="228.8" r="3.4"/><text x="71.0" y="220.8" font-size="12" text-anchor="start">Soil &amp; water</text></g>
</svg>
