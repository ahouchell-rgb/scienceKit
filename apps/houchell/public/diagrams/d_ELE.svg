<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Electricity in circuits">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="6" y="6" width="308" height="248" rx="12" fill="#F4F6FC" stroke="#1E2761" stroke-width="2"/><g data-part="wire"><line x1="46" y1="70" x2="46" y2="210" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="46" y1="210" x2="118" y2="210" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="202" y1="210" x2="274" y2="210" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="274" y1="210" x2="274" y2="150" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="274" y1="110" x2="274" y2="70" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="274" y1="70" x2="188" y2="70" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="140" y1="70" x2="112" y2="70" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="80" y1="70" x2="46" y2="70" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><circle class="sm-flow" cx="46" cy="140" r="4" fill="#C99528"/><circle class="sm-flow" cx="150" cy="210" r="4" fill="#C99528"/><circle class="sm-flow" cx="274" cy="140" r="4" fill="#C99528"/></g><g data-part="cell"><line x1="150" y1="196" x2="150" y2="224" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="168" y1="204" x2="168" y2="216" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="118" y1="210" x2="150" y2="210" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="168" y1="210" x2="202" y2="210" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><text x="140" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#B4341E">+</text><text x="180" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E2761">&#8211;</text></g><g data-part="bulb"><circle cx="164" cy="70" r="24" fill="#FBF3D9" stroke="#1E2761" stroke-width="3"/><g class="sm-glow"><line x1="148" y1="54" x2="180" y2="86" stroke="#C99528" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="54" x2="148" y2="86" stroke="#C99528" stroke-width="3" stroke-linecap="round"/></g></g><g data-part="resistor"><path d="M274 110 L266 118 L282 126 L266 134 L282 142 L274 150" fill="none" stroke="#1E2761" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></g><g data-part="ammeter"><circle cx="96" cy="70" r="16" fill="#ffffff" stroke="#2C5F2D" stroke-width="3"/><text x="96" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2C5F2D">A</text></g><g data-part="voltmeter"><line x1="140" y1="70" x2="140" y2="34" stroke="#7a8199" stroke-width="2.5" stroke-linecap="round"/><line x1="188" y1="70" x2="188" y2="34" stroke="#7a8199" stroke-width="2.5" stroke-linecap="round"/><line x1="140" y1="34" x2="148" y2="34" stroke="#7a8199" stroke-width="2.5" stroke-linecap="round"/><line x1="180" y1="34" x2="188" y2="34" stroke="#7a8199" stroke-width="2.5" stroke-linecap="round"/><circle cx="164" cy="34" r="16" fill="#ffffff" stroke="#B4341E" stroke-width="3"/><text x="164" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B4341E">V</text></g><g data-part="symbol"><rect x="222" y="150" width="72" height="44" rx="10" fill="#ffffff" stroke="#C99528" stroke-width="2.5"/><text x="258" y="172" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#1E2761">&#937;</text><text x="258" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7a8199">I = V/R</text></g>
</g>
<g data-part="cell" class="dg-label"><circle cx="38.4" cy="111.8" r="3.4"/><text x="45.4" y="103.8" font-size="12" text-anchor="start">Cell / Battery</text></g>
<g data-part="bulb" class="dg-label"><circle cx="150.4" cy="49.4" r="3.4"/><text x="150.4" y="41.4" font-size="12" text-anchor="middle">Bulb (component)</text></g>
<g data-part="resistor" class="dg-label"><circle cx="249.6" cy="49.4" r="3.4"/><text x="249.6" y="41.4" font-size="12" text-anchor="middle">Resistor</text></g>
<g data-part="voltmeter" class="dg-label"><circle cx="150.4" cy="111.8" r="3.4"/><text x="150.4" y="103.8" font-size="12" text-anchor="middle">Voltmeter (across)</text></g>
<g data-part="ammeter" class="dg-label"><circle cx="179.2" cy="174.2" r="3.4"/><text x="179.2" y="166.2" font-size="12" text-anchor="middle">Ammeter (series)</text></g>
<g data-part="wire" class="dg-label"><circle cx="291.2" cy="223.6" r="3.4"/><text x="284.2" y="215.6" font-size="12" text-anchor="end">Conducting wire</text></g>
<g data-part="symbol" class="dg-label"><circle cx="169.6" cy="223.6" r="3.4"/><text x="169.6" y="215.6" font-size="12" text-anchor="middle">Resistance (Ω)</text></g>
</svg>
