<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Skeleton">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<line x1="76" y1="66" x2="76" y2="82" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/><line x1="104" y1="66" x2="104" y2="82" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="84" x2="130" y2="84" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/><line x1="52" y1="86" x2="34" y2="164" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><line x1="128" y1="86" x2="146" y2="164" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/><path d="M60 176 q30 20 60 0 l-8 24 q-22 12 -44 0 z" fill="#F4F6FC" stroke="#1E2761" stroke-width="3"/><g data-part="skull"><ellipse cx="90" cy="34" rx="24" ry="26" fill="#F4F6FC" stroke="#1E2761" stroke-width="3"/><circle cx="80" cy="32" r="4.5" fill="#1E2761"/><circle cx="100" cy="32" r="4.5" fill="#1E2761"/><path d="M80 50 q10 8 20 0 l-2 10 q-8 5 -16 0 z" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/><line x1="86" y1="44" x2="94" y2="44" stroke="#1E2761" stroke-width="1.5"/></g><g data-part="spine"><g stroke="#1E2761" stroke-width="2" fill="#DCEAF6"><rect x="84" y="96" width="12" height="7" rx="2"/><rect x="84" y="106" width="12" height="7" rx="2"/><rect x="84" y="116" width="12" height="7" rx="2"/><rect x="84" y="126" width="12" height="7" rx="2"/><rect x="84" y="136" width="12" height="7" rx="2"/><rect x="84" y="146" width="12" height="7" rx="2"/><rect x="84" y="156" width="12" height="7" rx="2"/><rect x="84" y="166" width="12" height="7" rx="2"/></g></g><g data-part="ribcage"><g class="sm-throb" fill="none" stroke="#1E2761" stroke-width="2.5"><path d="M90 100 q-38 6 -32 44"/><path d="M90 114 q-42 6 -36 42"/><path d="M90 128 q-44 7 -36 40"/><path d="M90 100 q38 6 32 44"/><path d="M90 114 q42 6 36 42"/><path d="M90 128 q44 7 36 40"/></g></g><g data-part="femur"><circle cx="74" cy="202" r="6" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/><line x1="74" y1="206" x2="66" y2="270" stroke="#1E2761" stroke-width="6" stroke-linecap="round"/><circle cx="106" cy="202" r="6" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/><line x1="106" y1="206" x2="114" y2="270" stroke="#1E2761" stroke-width="6" stroke-linecap="round"/></g>
</g>
<g data-part="skull" class="dg-label"><circle cx="90.0" cy="28.0" r="3.4"/><text x="90.0" y="20.0" font-size="10.5" text-anchor="middle">Skull</text></g>
<g data-part="ribcage" class="dg-label"><circle cx="59.4" cy="100.8" r="3.4"/><text x="59.4" y="92.8" font-size="10.5" text-anchor="middle">Ribcage</text></g>
<g data-part="spine" class="dg-label"><circle cx="90.0" cy="154.0" r="3.4"/><text x="90.0" y="146.0" font-size="10.5" text-anchor="middle">Spine</text></g>
<g data-part="femur" class="dg-label"><circle cx="73.8" cy="229.6" r="3.4"/><text x="73.8" y="221.6" font-size="10.5" text-anchor="middle">Femur (thigh bone)</text></g>
</svg>
