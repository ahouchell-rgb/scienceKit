<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Particle model and density">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#F4F6FC"/><g data-part="solid"><rect x="10" y="14" width="88" height="76" rx="6" fill="#CDE5C6" stroke="#1E2761" stroke-width="3"/><g class="sm-osc"><circle cx="26" cy="32" r="6.5" fill="#2C5F2D"/><circle cx="43" cy="32" r="6.5" fill="#2C5F2D"/><circle cx="60" cy="32" r="6.5" fill="#2C5F2D"/><circle cx="77" cy="32" r="6.5" fill="#2C5F2D"/><circle cx="26" cy="49" r="6.5" fill="#2C5F2D"/><circle cx="43" cy="49" r="6.5" fill="#2C5F2D"/><circle cx="60" cy="49" r="6.5" fill="#2C5F2D"/><circle cx="77" cy="49" r="6.5" fill="#2C5F2D"/><circle cx="26" cy="66" r="6.5" fill="#2C5F2D"/><circle cx="43" cy="66" r="6.5" fill="#2C5F2D"/><circle cx="60" cy="66" r="6.5" fill="#2C5F2D"/><circle cx="77" cy="66" r="6.5" fill="#2C5F2D"/></g></g><g data-part="liquid"><rect x="116" y="14" width="88" height="76" rx="6" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/><g class="sm-drift" fill="#1E2761"><circle cx="134" cy="34" r="6.5"/><circle cx="154" cy="30" r="6.5"/><circle cx="174" cy="36" r="6.5"/><circle cx="192" cy="30" r="6.5"/><circle cx="142" cy="52" r="6.5"/><circle cx="164" cy="54" r="6.5"/><circle cx="186" cy="50" r="6.5"/><circle cx="132" cy="72" r="6.5"/><circle cx="156" cy="74" r="6.5"/><circle cx="180" cy="70" r="6.5"/></g></g><g data-part="gas"><rect x="222" y="14" width="88" height="76" rx="6" fill="#F1D2D8" stroke="#1E2761" stroke-width="3"/><g class="sm-drift" fill="#B4341E"><circle cx="242" cy="30" r="6.5"/><circle cx="288" cy="26" r="6.5"/><circle cx="266" cy="50" r="6.5"/><circle cx="300" cy="60" r="6.5"/><circle cx="238" cy="72" r="6.5"/><circle cx="282" cy="78" r="6.5"/></g></g><rect x="30" y="118" width="260" height="118" rx="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/><g data-part="waterSurface"><path d="M30 132 Q60 124 90 132 Q120 140 150 132 Q180 124 210 132 Q240 140 290 132" fill="none" stroke="#3D6FB0" stroke-width="3" stroke-linecap="round" class="sm-osc-x"/><g class="sm-drift" fill="#3D6FB0" opacity="0.8"><circle cx="70" cy="126" r="2.5"/><circle cx="130" cy="124" r="2.5"/><circle cx="200" cy="127" r="2.5"/><circle cx="255" cy="125" r="2.5"/></g></g><g data-part="iceCube"><rect x="70" y="118" width="40" height="34" rx="4" fill="#EAF4FC" stroke="#1E2761" stroke-width="2.5" class="sm-osc"/><g stroke="#3D6FB0" stroke-width="1.4" opacity="0.6"><line x1="80" y1="124" x2="88" y2="132"/><line x1="98" y1="126" x2="104" y2="138"/></g><path d="M70 132 L110 132" stroke="#3D6FB0" stroke-width="1.5" stroke-dasharray="3 3"/></g><g data-part="sinkingObject"><path d="M213 150 L213 190" stroke="#B4341E" stroke-width="2.5" stroke-dasharray="4 5" marker-end="url(#dnDown)" class="sm-flow"/><rect x="196" y="198" width="34" height="34" rx="3" fill="#1E2761" stroke="#0f143a" stroke-width="2.5" class="sm-fall"/></g><defs><marker id="dnDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0 0 L8 0 L4 8 Z" fill="#B4341E"/></marker></defs>
</g>
<g data-part="solid" class="dg-label"><circle cx="54.4" cy="50.0" r="3.4"/><text x="61.4" y="42.0" font-size="12" text-anchor="start">Solid (densest)</text></g>
<g data-part="liquid" class="dg-label"><circle cx="160.0" cy="50.0" r="3.4"/><text x="160.0" y="42.0" font-size="12" text-anchor="middle">Liquid</text></g>
<g data-part="gas" class="dg-label"><circle cx="265.6" cy="50.0" r="3.4"/><text x="258.6" y="42.0" font-size="12" text-anchor="end">Gas (least dense)</text></g>
<g data-part="waterSurface" class="dg-label"><circle cx="160.0" cy="147.5" r="3.4"/><text x="160.0" y="139.5" font-size="12" text-anchor="middle">Water surface</text></g>
<g data-part="iceCube" class="dg-label"><circle cx="92.8" cy="142.5" r="3.4"/><text x="92.8" y="134.5" font-size="12" text-anchor="middle">Floating ice</text></g>
<g data-part="sinkingObject" class="dg-label"><circle cx="217.6" cy="207.5" r="3.4"/><text x="217.6" y="199.5" font-size="12" text-anchor="middle">Denser object sinks</text></g>
</svg>
