<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Reaction profiles">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="240" fill="#F4F6FC"/>
<g data-part="energyAxis">
  <line x1="42" y1="24" x2="42" y2="204" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 20 l-6 12 h12 z" fill="#1E2761"/>
  <text x="20" y="120" font-family="Arial,sans-serif" font-size="12" fill="#1E2761" transform="rotate(-90 20 120)" text-anchor="middle">Energy</text>
</g>
<line x1="42" y1="204" x2="306" y2="204" stroke="#7a8199" stroke-width="2.5" stroke-linecap="round"/>
<text x="174" y="226" font-family="Arial,sans-serif" font-size="11" fill="#7a8199" text-anchor="middle">Progress of reaction</text>
<line x1="42" y1="120" x2="90" y2="120" stroke="#AEB6D6" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="42" y1="150" x2="258" y2="150" stroke="#AEB6D6" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M60 120 C110 120 120 55 158 55 C196 55 206 150 258 150" fill="none" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/>
<g data-part="reactants">
  <line x1="52" y1="120" x2="96" y2="120" stroke="#2C5F2D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="120" r="6" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <circle cx="82" cy="120" r="6" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
</g>
<g data-part="products">
  <line x1="234" y1="150" x2="278" y2="150" stroke="#B4341E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="248" cy="150" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  <circle cx="264" cy="150" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
</g>
<g data-part="activationEnergy">
  <line x1="120" y1="120" x2="120" y2="55" stroke="#B4341E" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M120 57 l-5 11 h10 z" fill="#B4341E"/>
  <path d="M120 118 l-5 -11 h10 z" fill="#B4341E"/>
  <text x="128" y="92" font-family="Arial,sans-serif" font-size="11" fill="#B4341E">Ea</text>
</g>
<g data-part="catalystPath">
  <path d="M60 120 C104 120 116 88 158 88 C200 88 210 150 258 150" fill="none" stroke="#C99528" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" class="sm-flow"/>
  <circle cx="158" cy="88" r="4" fill="#C99528"/>
</g>
<g data-part="energyChange">
  <line x1="290" y1="120" x2="290" y2="150" stroke="#2C5F2D" stroke-width="2.5"/>
  <path d="M290 148 l-5 -10 h10 z" fill="#2C5F2D"/>
  <line x1="278" y1="120" x2="296" y2="120" stroke="#2C5F2D" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="298" y="138" font-family="Arial,sans-serif" font-size="10" fill="#2C5F2D">-ΔE</text>
</g>

</g>
<g data-part="energyAxis" class="dg-label"><circle cx="41.6" cy="43.2" r="3.4"/><text x="48.6" y="35.2" font-size="12" text-anchor="start">Energy axis</text></g>
<g data-part="reactants" class="dg-label"><circle cx="70.4" cy="81.6" r="3.4"/><text x="70.4" y="73.6" font-size="12" text-anchor="middle">Reactants</text></g>
<g data-part="products" class="dg-label"><circle cx="288.0" cy="160.8" r="3.4"/><text x="281.0" y="152.8" font-size="12" text-anchor="end">Products</text></g>
<g data-part="activationEnergy" class="dg-label"><circle cx="188.8" cy="24.0" r="3.4"/><text x="188.8" y="16.0" font-size="12" text-anchor="middle">Activation energy</text></g>
<g data-part="catalystPath" class="dg-label"><circle cx="198.4" cy="57.6" r="3.4"/><text x="198.4" y="49.6" font-size="12" text-anchor="middle">Catalyst path</text></g>
<g data-part="energyChange" class="dg-label"><circle cx="112.0" cy="124.8" r="3.4"/><text x="112.0" y="116.8" font-size="12" text-anchor="middle">Energy change</text></g>
</svg>
