<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Acids, bases &amp; salts">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="210" fill="#fff"/><rect x="10" y="10" width="300" height="60" rx="10" fill="#F4F6FC" stroke="#1E2761" stroke-width="2"/><g data-part="phScale"><line x1="24" y1="52" x2="296" y2="52" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/><text x="24" y="24" font-family="sans-serif" font-size="11" fill="#1E2761" text-anchor="middle">0</text><text x="160" y="24" font-family="sans-serif" font-size="11" fill="#2C5F2D" text-anchor="middle">7</text><text x="296" y="24" font-family="sans-serif" font-size="11" fill="#1E2761" text-anchor="middle">14</text><line x1="24" y1="46" x2="24" y2="58" stroke="#1E2761" stroke-width="2"/><line x1="160" y1="46" x2="160" y2="58" stroke="#1E2761" stroke-width="2"/><line x1="296" y1="46" x2="296" y2="58" stroke="#1E2761" stroke-width="2"/></g><g data-part="indicatorBar"><rect x="24" y="30" width="39" height="16" fill="#B4341E"/><rect x="63" y="30" width="39" height="16" fill="#E8785A"/><rect x="102" y="30" width="39" height="16" fill="#F1D2D8"/><rect x="141" y="30" width="38" height="16" fill="#CDE5C6"/><rect x="179" y="30" width="39" height="16" fill="#8FC08A"/><rect x="218" y="30" width="39" height="16" fill="#AEB6D6"/><rect x="257" y="30" width="39" height="16" fill="#1E2761"/><rect x="24" y="30" width="272" height="16" fill="none" stroke="#1E2761" stroke-width="2"/></g><g data-part="acidicEnd"><path d="M40 118 h44 l-5 68 h-34 z" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 118 h44" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><text class="sm-drift" x="54" y="150" font-family="sans-serif" font-size="12" fill="#B4341E" font-weight="bold">H&#8314;</text><text class="sm-drift" x="66" y="172" font-family="sans-serif" font-size="12" fill="#B4341E" font-weight="bold">H&#8314;</text></g><g data-part="neutralPoint"><path d="M138 118 h44 l-5 68 h-34 z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" stroke-linejoin="round"/><path d="M138 118 h44" stroke="#2C5F2D" stroke-width="2.5" stroke-linecap="round"/><text x="160" y="158" font-family="sans-serif" font-size="10" fill="#2C5F2D" text-anchor="middle" font-weight="bold">H&#8322;O</text></g><g data-part="alkalineEnd"><path d="M236 118 h44 l-5 68 h-34 z" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/><path d="M236 118 h44" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/><text class="sm-drift" x="248" y="150" font-family="sans-serif" font-size="11" fill="#1E2761" font-weight="bold">OH&#8315;</text><text class="sm-drift" x="256" y="172" font-family="sans-serif" font-size="11" fill="#1E2761" font-weight="bold">OH&#8315;</text></g>
</g>
<g data-part="phScale" class="dg-label"><circle cx="160.0" cy="84.0" r="3.4"/><text x="160.0" y="76.0" font-size="12" text-anchor="middle">pH scale</text></g>
<g data-part="indicatorBar" class="dg-label"><circle cx="160.0" cy="115.5" r="3.4"/><text x="160.0" y="107.5" font-size="12" text-anchor="middle">Universal indicator</text></g>
<g data-part="acidicEnd" class="dg-label"><circle cx="54.4" cy="168.0" r="3.4"/><text x="61.4" y="160.0" font-size="12" text-anchor="start">Acidic (H+)</text></g>
<g data-part="neutralPoint" class="dg-label"><circle cx="160.0" cy="168.0" r="3.4"/><text x="160.0" y="160.0" font-size="12" text-anchor="middle">Neutral pH 7</text></g>
<g data-part="alkalineEnd" class="dg-label"><circle cx="262.4" cy="168.0" r="3.4"/><text x="255.4" y="160.0" font-size="12" text-anchor="end">Alkaline (OH-)</text></g>
</svg>
