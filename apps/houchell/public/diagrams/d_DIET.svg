<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Diet and health">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="4" y="4" width="312" height="242" rx="14" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/><ellipse cx="146" cy="132" rx="104" ry="100" fill="#e7ecf6"/><g data-part="plate"><circle cx="146" cy="128" r="100" fill="#ffffff" stroke="#1E2761" stroke-width="3.5"/><circle cx="146" cy="128" r="82" fill="none" stroke="#7a8199" stroke-width="1.5"/></g><g data-part="carbsSlice"><path d="M146 128 L146 48 A80 80 0 0 1 222 103 Z" fill="#F0D8A8" stroke="#C99528" stroke-width="2.5" stroke-linejoin="round"/></g><g data-part="proteinSlice"><path d="M146 128 L222 103 A80 80 0 0 1 199 200 Z" fill="#E9B7A0" stroke="#B4341E" stroke-width="2.5" stroke-linejoin="round"/></g><g data-part="fatSlice"><path d="M146 128 L199 200 A80 80 0 0 1 118 205 Z" fill="#F7E9A0" stroke="#C99528" stroke-width="2.5" stroke-linejoin="round"/></g><g data-part="fibreSlice"><path d="M146 128 L118 205 A80 80 0 0 1 66 128 Z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" stroke-linejoin="round"/></g><g data-part="vitMinSlice"><path d="M146 128 L66 128 A80 80 0 0 1 146 48 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/></g><g data-part="water"><path d="M280 30 L308 30 L302 96 Q301 104 293 104 Q285 104 284 96 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/><path d="M285 78 L307 78 L302 96 Q301 104 293 104 Q285 104 285 96 Z" fill="#8CC0EA"/><path class="sm-fall" d="M290 104 Q284 128 279 150" fill="none" stroke="#8CC0EA" stroke-width="4" stroke-linecap="round"/><circle class="sm-fall" cx="276" cy="162" r="4" fill="#8CC0EA"/></g>
</g>
<g data-part="carbsSlice" class="dg-label"><circle cx="153.6" cy="60.0" r="3.4"/><text x="153.6" y="52.0" font-size="12" text-anchor="middle">Carbohydrates</text></g>
<g data-part="proteinSlice" class="dg-label"><circle cx="198.4" cy="145.0" r="3.4"/><text x="198.4" y="137.0" font-size="12" text-anchor="middle">Protein</text></g>
<g data-part="fatSlice" class="dg-label"><circle cx="166.4" cy="195.0" r="3.4"/><text x="166.4" y="187.0" font-size="12" text-anchor="middle">Fats</text></g>
<g data-part="fibreSlice" class="dg-label"><circle cx="108.8" cy="175.0" r="3.4"/><text x="108.8" y="167.0" font-size="12" text-anchor="middle">Fibre</text></g>
<g data-part="vitMinSlice" class="dg-label"><circle cx="99.2" cy="100.0" r="3.4"/><text x="99.2" y="92.0" font-size="12" text-anchor="middle">Vitamins &amp; Minerals</text></g>
<g data-part="plate" class="dg-label"><circle cx="57.6" cy="40.0" r="3.4"/><text x="64.6" y="32.0" font-size="12" text-anchor="start">Balanced Plate</text></g>
<g data-part="water" class="dg-label"><circle cx="281.6" cy="72.5" r="3.4"/><text x="274.6" y="64.5" font-size="12" text-anchor="end">Water</text></g>
</svg>
