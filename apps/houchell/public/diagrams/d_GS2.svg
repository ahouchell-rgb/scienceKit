<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The life cycle of stars">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="300" fill="#F4F6FC"/>
<defs>
  <marker id="gs2arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0 0 L8 4 L0 8 Z" fill="#1E2761"/>
  </marker>
  <radialGradient id="gs2neb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#DCEAF6"/>
    <stop offset="100%" stop-color="#CDE5C6"/>
  </radialGradient>
</defs>
<g stroke="#1E2761" stroke-width="2" fill="none" marker-end="url(#gs2arr)">
  <line x1="62" y1="55" x2="98" y2="55"/>
  <line x1="140" y1="55" x2="176" y2="55"/>
</g>
<g data-part="nebula">
  <circle cx="38" cy="55" r="22" fill="url(#gs2neb)" opacity="0.55"/>
  <circle cx="38" cy="55" r="22" fill="none" stroke="#1E2761" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="31" cy="51" r="1.6" fill="#1E2761"/>
  <circle cx="45" cy="48" r="1.6" fill="#1E2761"/>
  <circle cx="48" cy="61" r="1.6" fill="#1E2761"/>
  <circle cx="33" cy="63" r="1.6" fill="#1E2761"/>
  <circle cx="39" cy="55" r="1.6" fill="#1E2761"/>
  <g stroke="#B4341E" stroke-width="1.6" marker-end="url(#gs2arr)" opacity="0.8">
    <line x1="16" y1="36" x2="28" y2="46"/>
    <line x1="60" y1="36" x2="48" y2="46"/>
    <line x1="16" y1="74" x2="28" y2="64"/>
  </g>
</g>
<g data-part="protostar">
  <circle cx="120" cy="55" r="16" fill="#C99528" opacity="0.85"/>
  <circle cx="120" cy="55" r="16" fill="none" stroke="#1E2761" stroke-width="2"/>
  <path d="M120 55 a10 10 0 0 1 8 -6" fill="none" stroke="#B4341E" stroke-width="1.6" class="sm-spin"/>
</g>
<g data-part="mainSequence">
  <circle cx="200" cy="55" r="18" fill="#C99528"/>
  <circle cx="200" cy="55" r="18" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <g stroke="#B4341E" stroke-width="2" stroke-linecap="round" marker-end="url(#gs2arr)">
    <line x1="200" y1="45" x2="200" y2="37"/>
    <line x1="210" y1="55" x2="218" y2="55"/>
    <line x1="200" y1="65" x2="200" y2="73"/>
    <line x1="190" y1="55" x2="182" y2="55"/>
  </g>
</g>
<g stroke="#1E2761" stroke-width="2" fill="none" marker-end="url(#gs2arr)">
  <path d="M190 70 q-70 40 -70 88"/>
  <path d="M212 70 q60 40 60 88"/>
</g>
<g data-part="redGiant">
  <circle cx="118" cy="180" r="24" fill="#B4341E" opacity="0.85"/>
  <circle cx="118" cy="180" r="24" fill="none" stroke="#1E2761" stroke-width="2.5"/>
</g>
<g data-part="supernova">
  <g transform="translate(272,180)">
    <circle r="14" fill="#B4341E" class="sm-pulse"/>
    <circle r="14" fill="none" stroke="#1E2761" stroke-width="2"/>
    <g stroke="#C99528" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-16"/>
      <line x1="0" y1="24" x2="0" y2="16"/>
      <line x1="-24" y1="0" x2="-16" y2="0"/>
      <line x1="24" y1="0" x2="16" y2="0"/>
      <line x1="-17" y1="-17" x2="-11" y2="-11"/>
      <line x1="17" y1="17" x2="11" y2="11"/>
      <line x1="17" y1="-17" x2="11" y2="-11"/>
      <line x1="-17" y1="17" x2="-11" y2="11"/>
    </g>
  </g>
</g>
<g stroke="#1E2761" stroke-width="2" fill="none" marker-end="url(#gs2arr)">
  <line x1="118" y1="206" x2="118" y2="248"/>
  <line x1="272" y1="196" x2="272" y2="248"/>
</g>
<g data-part="whiteDwarf">
  <circle cx="118" cy="268" r="11" fill="#DCEAF6"/>
  <circle cx="118" cy="268" r="11" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <circle cx="118" cy="268" r="4.5" fill="#C99528"/>
</g>
<g data-part="blackHole">
  <circle cx="272" cy="270" r="16" fill="#C99528" opacity="0.55"/>
  <circle cx="272" cy="270" r="10" fill="#1E2761"/>
  <circle cx="272" cy="270" r="16" fill="none" stroke="#1E2761" stroke-width="2" class="sm-spin"/>
</g>
</g>
<g data-part="nebula" class="dg-label"><circle cx="57.6" cy="75.0" r="3.4"/><text x="64.6" y="67.0" font-size="12" text-anchor="start">Nebula</text></g>
<g data-part="protostar" class="dg-label"><circle cx="150.4" cy="75.0" r="3.4"/><text x="150.4" y="67.0" font-size="12" text-anchor="middle">Protostar</text></g>
<g data-part="mainSequence" class="dg-label"><circle cx="249.6" cy="75.0" r="3.4"/><text x="249.6" y="67.0" font-size="12" text-anchor="middle">Main sequence</text></g>
<g data-part="redGiant" class="dg-label"><circle cx="70.4" cy="207.0" r="3.4"/><text x="70.4" y="199.0" font-size="12" text-anchor="middle">Red giant</text></g>
<g data-part="whiteDwarf" class="dg-label"><circle cx="70.4" cy="270.0" r="3.4"/><text x="70.4" y="262.0" font-size="12" text-anchor="middle">White dwarf</text></g>
<g data-part="supernova" class="dg-label"><circle cx="249.6" cy="207.0" r="3.4"/><text x="249.6" y="199.0" font-size="12" text-anchor="middle">Supernova</text></g>
<g data-part="blackHole" class="dg-label"><circle cx="249.6" cy="279.0" r="3.4"/><text x="249.6" y="271.0" font-size="12" text-anchor="middle">Black hole</text></g>
</svg>
