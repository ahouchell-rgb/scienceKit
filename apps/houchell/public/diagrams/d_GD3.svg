<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Specific latent heat">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#fff"/><line x1="40" y1="18" x2="40" y2="212" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/><line x1="40" y1="212" x2="306" y2="212" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/><polygon points="40,14 35,24 45,24" fill="#1E2761"/><polygon points="310,212 300,207 300,217" fill="#1E2761"/><text x="16" y="120" font-family="sans-serif" font-size="11" fill="#1E2761" transform="rotate(-90 16 120)">&#176;C</text><g data-part="yAxis"><line x1="36" y1="40" x2="44" y2="40" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><line x1="36" y1="120" x2="44" y2="120" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><line x1="36" y1="185" x2="44" y2="185" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/></g><g data-part="xAxis"><line class="sm-flow" x1="60" y1="230" x2="290" y2="230" stroke="#C99528" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><polygon points="296,230 285,225 285,235" fill="#C99528"/></g><g data-part="meltSlope"><path d="M40 192 L92 150" fill="none" stroke="#1E2761" stroke-width="3.2" stroke-linecap="round"/></g><g data-part="fusionPlateau"><path d="M92 150 L150 150" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round"/><path d="M150 150 L182 108" fill="none" stroke="#1E2761" stroke-width="3.2" stroke-linecap="round"/></g><g data-part="vapPlateau"><path d="M182 108 L276 108" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round"/><path d="M276 108 L300 90" fill="none" stroke="#1E2761" stroke-width="3.2" stroke-linecap="round"/></g><g data-part="breakingBonds"><circle class="sm-drift" cx="212" cy="150" r="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="2"/><circle class="sm-drift" cx="238" cy="164" r="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="2"/><line x1="220" y1="153" x2="230" y2="161" stroke="#7a8199" stroke-width="1.6" stroke-dasharray="3 3"/><path d="M198 150 l-12 0" stroke="#B4341E" stroke-width="2.4" stroke-linecap="round"/><polygon points="184,150 192,146 192,154" fill="#B4341E"/><path d="M252 164 l12 0" stroke="#B4341E" stroke-width="2.4" stroke-linecap="round"/><polygon points="266,164 258,160 258,168" fill="#B4341E"/></g>
</g>
<g data-part="yAxis" class="dg-label"><circle cx="25.6" cy="100.0" r="3.4"/><text x="32.6" y="92.0" font-size="12" text-anchor="start">Temperature</text></g>
<g data-part="xAxis" class="dg-label"><circle cx="217.6" cy="230.0" r="3.4"/><text x="217.6" y="222.0" font-size="12" text-anchor="middle">Energy added</text></g>
<g data-part="meltSlope" class="dg-label"><circle cx="57.6" cy="185.0" r="3.4"/><text x="64.6" y="177.0" font-size="12" text-anchor="start">Solid warming up</text></g>
<g data-part="fusionPlateau" class="dg-label"><circle cx="115.2" cy="155.0" r="3.4"/><text x="115.2" y="147.0" font-size="12" text-anchor="middle">Melting (latent heat of fusion)</text></g>
<g data-part="vapPlateau" class="dg-label"><circle cx="236.8" cy="100.0" r="3.4"/><text x="236.8" y="92.0" font-size="12" text-anchor="middle">Boiling (latent heat of vaporisation)</text></g>
<g data-part="breakingBonds" class="dg-label"><circle cx="140.8" cy="222.5" r="3.4"/><text x="140.8" y="214.5" font-size="12" text-anchor="middle">Bonds breaking, temp constant</text></g>
</svg>
