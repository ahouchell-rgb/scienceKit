<g data-part="refractedRay" class="dg-label"><circle cx="268.8" cy="100.0" r="3.4"/><text x="261.8" y="92.0" font-size="12" text-anchor="end">Refracted ray</text></g>
<g data-part="prism" class="dg-label"><circle cx="160.0" cy="200.0" r="3.4"/><text x="160.0" y="192.0" font-size="12" text-anchor="middle">Prism</text></g>
<g data-part="spectrum" class="dg-label"><circle cx="288.0" cy="195.0" r="3.4"/><text x="281.0" y="187.0" font-size="12" text-anchor="end">Spectrum</text></g>
</svg>
