<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Light">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x='0' y='0' width='320' height='250' fill='#F4F6FC'/><g data-part='mirror'><rect x='40' y='96' width='150' height='8' rx='2' fill='#DCEAF6' stroke='#1E2761' stroke-width='2.5'/><line x1='48' y1='104' x2='42' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='66' y1='104' x2='60' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='84' y1='104' x2='78' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='102' y1='104' x2='96' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='120' y1='104' x2='114' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='138' y1='104' x2='132' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='156' y1='104' x2='150' y2='114' stroke='#1E2761' stroke-width='2'/><line x1='174' y1='104' x2='168' y2='114' stroke='#1E2761' stroke-width='2'/></g><g data-part='normal'><line x1='115' y1='30' x2='115' y2='96' stroke='#7a8199' stroke-width='2' stroke-dasharray='5 4'/></g><g data-part='incidentRay'><line class='sm-flow' x1='40' y1='34' x2='108' y2='90' stroke='#C99528' stroke-width='3' stroke-linecap='round' stroke-dasharray='7 6'/><polygon points='115,96 100,86 106,80' fill='#C99528'/></g><g data-part='reflectedRay'><line class='sm-flow' x1='122' y1='90' x2='190' y2='34' stroke='#C99528' stroke-width='3' stroke-linecap='round' stroke-dasharray='7 6'/><polygon points='190,34 176,40 174,32' fill='#C99528'/></g><line x1='20' y1='186' x2='120' y2='186' stroke='#7a8199' stroke-width='4' stroke-linecap='round'/><g data-part='prism'><polygon points='150,150 118,210 182,210' fill='#DCEAF6' stroke='#1E2761' stroke-width='2.5'/></g><g data-part='refractedRay'><line class='sm-flow' x1='120' y1='186' x2='146' y2='198' stroke='#7a8199' stroke-width='4' stroke-linecap='round' stroke-dasharray='6 5'/><polygon points='150,200 138,196 142,190' fill='#7a8199'/></g><g data-part='spectrum'><line x1='170' y1='196' x2='300' y2='168' stroke='#B4341E' stroke-width='3' stroke-linecap='round'/><line x1='170' y1='198' x2='300' y2='180' stroke='#E08A2E' stroke-width='3' stroke-linecap='round'/><line x1='170' y1='200' x2='300' y2='192' stroke='#D9B72E' stroke-width='3' stroke-linecap='round'/><line x1='170' y1='202' x2='300' y2='204' stroke='#2C5F2D' stroke-width='3' stroke-linecap='round'/><line x1='170' y1='204' x2='300' y2='216' stroke='#2E5FA3' stroke-width='3' stroke-linecap='round'/><line x1='170' y1='206' x2='300' y2='228' stroke='#5B3E8E' stroke-width='3' stroke-linecap='round'/></g>
</g>
<g data-part="incidentRay" class="dg-label"><circle cx="41.6" cy="112.5" r="3.4"/><text x="48.6" y="104.5" font-size="12" text-anchor="start">Incident ray</text></g>
<g data-part="normal" class="dg-label"><circle cx="89.6" cy="90.0" r="3.4"/><text x="89.6" y="82.0" font-size="12" text-anchor="middle">Normal</text></g>
