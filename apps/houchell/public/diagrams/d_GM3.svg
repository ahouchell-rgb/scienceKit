<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The motor effect">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" fill="#ffffff"/>

<!-- Field lines N -> S across the gap -->
<g data-part="fieldLines">
  <g stroke="#7a8199" stroke-width="2" stroke-linecap="round" class="sm-flow" stroke-dasharray="7 5">
    <line x1="84" y1="70" x2="236" y2="70"/>
    <line x1="84" y1="96" x2="236" y2="96"/>
    <line x1="84" y1="122" x2="236" y2="122"/>
  </g>
  <polygon points="236,70 226,65 226,75" fill="#7a8199"/>
  <polygon points="236,96 226,91 226,101" fill="#7a8199"/>
  <polygon points="236,122 226,117 226,127" fill="#7a8199"/>
</g>

<!-- North pole -->
<g data-part="northPole">
  <rect x="46" y="52" width="40" height="92" rx="4" fill="#B4341E" stroke="#1E2761" stroke-width="3"/>
  <text x="66" y="104" font-size="16" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">N</text>
</g>
<!-- South pole -->
<g data-part="southPole">
  <rect x="234" y="52" width="40" height="92" rx="4" fill="#1E2761" stroke="#1E2761" stroke-width="3"/>
  <text x="254" y="104" font-size="16" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">S</text>
</g>

<!-- Current-carrying coil -->
<g data-part="coil">
  <line x1="120" y1="96" x2="200" y2="96" stroke="#C99528" stroke-width="6" stroke-linecap="round"/>
  <polygon points="200,96 190,91 190,101" fill="#C99528"/>
</g>

<!-- Upward force -->
<g data-part="forceUp">
  <line x1="160" y1="92" x2="160" y2="40" stroke="#2C5F2D" stroke-width="4" stroke-linecap="round" class="sm-throb"/>
  <polygon points="160,30 152,46 168,46" fill="#2C5F2D" class="sm-throb"/>
  <text x="176" y="42" font-size="11" fill="#2C5F2D" font-family="sans-serif" font-weight="bold">F</text>
</g>

<!-- Split-ring commutator -->
<g data-part="commutator">
  <path d="M130 176 a18 18 0 0 1 16 0 l0 34 a18 18 0 0 1 -16 0 z" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
  <path d="M150 176 a18 18 0 0 1 16 0 l0 34 a18 18 0 0 1 -16 0 z" fill="#e0b45a" stroke="#1E2761" stroke-width="2"/>
  <rect x="146" y="174" width="4" height="38" fill="#ffffff"/>
  <rect x="112" y="188" width="14" height="10" rx="2" fill="#1E2761"/>
  <rect x="170" y="188" width="14" height="10" rx="2" fill="#1E2761"/>
</g>

<!-- Battery -->
<g data-part="battery">
  <path d="M119 193 H100 V222 H150" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M177 193 H220 V222 H150" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="143" y1="212" x2="143" y2="232" stroke="#1E2761" stroke-width="3"/>
  <line x1="157" y1="217" x2="157" y2="227" stroke="#1E2761" stroke-width="6"/>
  <text x="135" y="210" font-size="11" fill="#B4341E" text-anchor="middle" font-family="sans-serif" font-weight="bold">+</text>
</g>
</g>
<g data-part="northPole" class="dg-label"><circle cx="35.2" cy="120.0" r="3.4"/><text x="42.2" y="112.0" font-size="12" text-anchor="start">North pole</text></g>
<g data-part="southPole" class="dg-label"><circle cx="284.8" cy="120.0" r="3.4"/><text x="277.8" y="112.0" font-size="12" text-anchor="end">South pole</text></g>
<g data-part="fieldLines" class="dg-label"><circle cx="240.0" cy="84.0" r="3.4"/><text x="240.0" y="76.0" font-size="12" text-anchor="middle">Magnetic field</text></g>
<g data-part="coil" class="dg-label"><circle cx="160.0" cy="120.0" r="3.4"/><text x="160.0" y="112.0" font-size="12" text-anchor="middle">Current-carrying coil</text></g>
<g data-part="forceUp" class="dg-label"><circle cx="105.6" cy="36.0" r="3.4"/><text x="105.6" y="28.0" font-size="12" text-anchor="middle">Upward force</text></g>
<g data-part="commutator" class="dg-label"><circle cx="160.0" cy="172.8" r="3.4"/><text x="160.0" y="164.8" font-size="12" text-anchor="middle">Split-ring commutator</text></g>
<g data-part="battery" class="dg-label"><circle cx="176.0" cy="235.2" r="3.4"/><text x="176.0" y="227.2" font-size="12" text-anchor="middle">Battery</text></g>
</svg>
