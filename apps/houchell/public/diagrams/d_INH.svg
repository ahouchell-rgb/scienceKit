<g data-part="doubleHelix" class="dg-label"><circle cx="272.0" cy="65.1" r="3.4"/><text x="265.0" y="57.1" font-size="12" text-anchor="end">Double Helix</text></g>
<g data-part="base" class="dg-label"><circle cx="272.0" cy="118.4" r="3.4"/><text x="265.0" y="110.4" font-size="12" text-anchor="end">DNA Base Pair</text></g>
<g data-part="gene" class="dg-label"><circle cx="272.0" cy="177.6" r="3.4"/><text x="265.0" y="169.6" font-size="12" text-anchor="end">Gene</text></g>
