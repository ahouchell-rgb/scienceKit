'188' stroke='#7a8199' stroke-width='2'/></g><g data-part='base'><line x1='44' y1='224' x2='44' y2='282' stroke='#1E2761' stroke-width='3'/><line x1='96' y1='224' x2='96' y2='282' stroke='#2C5F2D' stroke-width='3'/><rect x='44' y='234' width='24' height='12' rx='3' fill='#B4341E'/><rect x='68' y='234' width='28' height='12' rx='3' fill='#C99528'/><rect x='44' y='260' width='30' height='12' rx='3' fill='#2C5F2D'/><rect x='74' y='260' width='22' height='12' rx='3' fill='#DCEAF6' stroke='#1E2761' stroke-width='1.5'/></g><g data-part='gene'><path d='M150 258 H300' fill='none' stroke='#1E2761' stroke-width='3'/><rect x='196' y='248' width='52' height='20' rx='6' class='sm-glow' fill='#F4C542' stroke='#C99528' stroke-width='2.5'/><line x1='204' y1='248' x2='204' y2='268' stroke='#1E2761' stroke-width='1.5'/><line x1='216' y1='248' x2='216' y2='268' stroke='#1E2761' stroke-width='1.5'/><line x1='228' y1='248' x2='228' y2='268' stroke='#1E2761' stroke-width='1.5'/><line x1='240' y1='248' x2='240' y2='268' stroke='#1E2761' stroke-width='1.5'/></g>
</g>
