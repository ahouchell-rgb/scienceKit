<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hormones &amp; the endocrine system">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="300" height="300" fill="#F4F6FC"/><path d="M150 20 C168 20 178 34 178 50 C178 62 172 70 172 76 C200 84 208 110 210 150 C212 200 206 250 202 286 C202 290 198 292 194 292 L106 292 C102 292 98 290 98 286 C94 250 88 200 90 150 C92 110 100 84 128 76 C128 70 122 62 122 50 C122 34 132 20 150 20 Z" fill="#EAF0FA" stroke="#1E2761" stroke-width="2.5"/><g data-part="pituitary"><circle cx="150" cy="42" r="9" fill="#C99528" stroke="#1E2761" stroke-width="2.5" class="sm-throb"/><polyline class="sm-flow" points="150,52 150,110 150,150" fill="none" stroke="#C99528" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/><polygon points="150,150 145,142 155,142" fill="#C99528"/></g><g data-part="thyroid"><path d="M138 70 q12 10 24 0 q-2 12 -12 12 q-10 0 -12 -12 Z" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="150" cy="76" r="2.5" fill="#B4341E" class="sm-drift"/></g><g data-part="pancreas"><path d="M150 158 q34 -8 44 6 q-14 12 -44 6 Z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/><circle cx="176" cy="162" r="3" fill="#2C5F2D"/></g><g data-part="liver"><path d="M100 150 q-10 -12 12 -14 q30 -2 34 12 q-16 16 -46 2 Z" fill="#7a4a34" stroke="#5a3424" stroke-width="2.5"/><path d="M118 150 q6 6 18 4" fill="none" stroke="#3a2418" stroke-width="1.6"/></g><g data-part="bloodHormone"><path class="sm-flow" d="M148 166 C120 172 110 158 118 152" fill="none" stroke="#B4341E" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/><polygon points="118,152 122,160 112,159" fill="#B4341E"/><circle cx="134" cy="168" r="3.5" fill="#B4341E" class="sm-drift"/><circle cx="126" cy="160" r="3.5" fill="#B4341E" class="sm-drift"/></g><g data-part="ovaries"><ellipse cx="130" cy="236" rx="11" ry="8" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><ellipse cx="170" cy="236" rx="11" ry="8" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><path d="M141 236 h18" stroke="#B4341E" stroke-width="2"/><circle cx="130" cy="236" r="3" fill="#B4341E" class="sm-throb"/><circle cx="170" cy="236" r="3" fill="#B4341E" class="sm-throb"/></g>
</g>
<g data-part="pituitary" class="dg-label"><circle cx="147.0" cy="45.0" r="3.4"/><text x="147.0" y="37.0" font-size="11" text-anchor="middle">Pituitary gland</text></g>
<g data-part="thyroid" class="dg-label"><circle cx="153.0" cy="90.0" r="3.4"/><text x="153.0" y="82.0" font-size="11" text-anchor="middle">Thyroid gland</text></g>
<g data-part="liver" class="dg-label"><circle cx="186.0" cy="126.0" r="3.4"/><text x="186.0" y="118.0" font-size="11" text-anchor="middle">Liver</text></g>
<g data-part="pancreas" class="dg-label"><circle cx="114.0" cy="156.0" r="3.4"/><text x="114.0" y="148.0" font-size="11" text-anchor="middle">Pancreas</text></g>
<g data-part="bloodHormone" class="dg-label"><circle cx="159.0" cy="183.0" r="3.4"/><text x="159.0" y="175.0" font-size="11" text-anchor="middle">Hormone in blood</text></g>
<g data-part="ovaries" class="dg-label"><circle cx="126.0" cy="210.0" r="3.4"/><text x="126.0" y="202.0" font-size="11" text-anchor="middle">Ovaries</text></g>
</svg>
