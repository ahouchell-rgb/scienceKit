<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Uses &amp; dangers of EM waves">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="6" y="6" width="308" height="228" rx="12" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/>
<rect x="20" y="28" width="280" height="40" rx="6" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/>
<line x1="90" y1="28" x2="90" y2="68" stroke="#1E2761" stroke-width="1.4"/>
<line x1="160" y1="28" x2="160" y2="68" stroke="#1E2761" stroke-width="1.4"/>
<line x1="230" y1="28" x2="230" y2="68" stroke="#1E2761" stroke-width="1.4"/>
<g data-part="radioBand">
  <rect x="20" y="28" width="70" height="40" rx="6" fill="#CDE5C6" stroke="#1E2761" stroke-width="2"/>
</g>
<g data-part="infraredBand">
  <rect x="90" y="28" width="70" height="40" fill="#F7F2E6" stroke="#1E2761" stroke-width="2"/>
</g>
<g data-part="uvBand">
  <rect x="160" y="28" width="70" height="40" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
</g>
<g data-part="gammaBand">
  <rect x="230" y="28" width="70" height="40" rx="6" fill="#F1D2D8" stroke="#1E2761" stroke-width="2"/>
</g>
<g data-part="freqArrow">
  <line x1="30" y1="84" x2="288" y2="84" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="292,84 282,79 282,89" fill="#B4341E"/>
</g>
<g data-part="leslieCube">
  <rect x="118" y="128" width="70" height="70" rx="4" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M118 128 L134 112 L204 112 L188 128 Z" fill="#C7D8EC" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M188 128 L204 112 L204 182 L188 198 Z" fill="#B9CCE4" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="sm-throb" d="M198 150 q10 -3 20 0" fill="none" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
  <path class="sm-throb" d="M198 165 q10 -3 20 0" fill="none" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
</g>
<g data-part="mattFace">
  <rect x="118" y="128" width="70" height="70" fill="#1E2761"/>
  <line x1="126" y1="136" x2="180" y2="190" stroke="#3A4478" stroke-width="1.4"/>
  <line x1="126" y1="150" x2="166" y2="190" stroke="#3A4478" stroke-width="1.4"/>
  <line x1="140" y1="136" x2="180" y2="176" stroke="#3A4478" stroke-width="1.4"/>
  <g class="sm-throb" stroke="#B4341E" stroke-width="2.4" stroke-linecap="round">
    <line x1="110" y1="146" x2="92" y2="146"/>
    <line x1="110" y1="163" x2="92" y2="163"/>
    <line x1="110" y1="180" x2="92" y2="180"/>
  </g>
  <polygon points="90,146 98,142 98,150" fill="#B4341E"/>
  <polygon points="90,163 98,159 98,167" fill="#B4341E"/>
  <polygon points="90,180 98,176 98,184" fill="#B4341E"/>
  <rect x="52" y="150" width="34" height="30" rx="4" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/>
  <rect x="57" y="155" width="24" height="12" rx="2" fill="#CDE5C6" stroke="#1E2761" stroke-width="1.2"/>
  <circle cx="69" cy="174" r="2.4" fill="#B4341E" class="sm-blink"/>
</g>
</g>
<g data-part="radioBand" class="dg-label"><circle cx="35.2" cy="52.8" r="3.4"/><text x="42.2" y="44.8" font-size="12" text-anchor="start">Radio waves</text></g>
<g data-part="infraredBand" class="dg-label"><circle cx="160.0" cy="52.8" r="3.4"/><text x="160.0" y="44.8" font-size="12" text-anchor="middle">Infrared</text></g>
<g data-part="uvBand" class="dg-label"><circle cx="198.4" cy="79.2" r="3.4"/><text x="198.4" y="71.2" font-size="12" text-anchor="middle">Ultraviolet</text></g>
<g data-part="gammaBand" class="dg-label"><circle cx="262.4" cy="52.8" r="3.4"/><text x="255.4" y="44.8" font-size="12" text-anchor="end">X-rays &amp; gamma</text></g>
<g data-part="freqArrow" class="dg-label"><circle cx="96.0" cy="100.8" r="3.4"/><text x="96.0" y="92.8" font-size="12" text-anchor="middle">Increasing frequency</text></g>
<g data-part="leslieCube" class="dg-label"><circle cx="80.0" cy="192.0" r="3.4"/><text x="80.0" y="184.0" font-size="12" text-anchor="middle">Leslie cube</text></g>
<g data-part="mattFace" class="dg-label"><circle cx="41.6" cy="148.8" r="3.4"/><text x="48.6" y="140.8" font-size="12" text-anchor="start">Black matt face</text></g>
</svg>
