<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Magnets &amp; magnetic fields">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="230" fill="#ffffff"/>
<!-- Earth as a huge bar magnet (background scaffolding + labelled part) -->
<g data-part="earth">
  <circle cx="252" cy="176" r="44" fill="#DCEAF6" stroke="#7a8199" stroke-width="2"/>
  <path d="M212 158 q40 -20 80 0" fill="none" stroke="#2C5F2D" stroke-width="2" opacity="0.5"/>
  <path d="M210 176 h84" fill="none" stroke="#2C5F2D" stroke-width="2" opacity="0.5"/>
  <path d="M212 194 q40 20 80 0" fill="none" stroke="#2C5F2D" stroke-width="2" opacity="0.5"/>
  <rect x="246" y="140" width="12" height="72" rx="3" fill="#B4341E" stroke="#1E2761" stroke-width="1.5"/>
  <rect x="246" y="176" width="12" height="36" rx="0" fill="#1E2761"/>
  <text x="252" y="150" font-size="9" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">N</text>
  <text x="252" y="208" font-size="9" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">S</text>
</g>

<!-- Field lines looping N (left) to S (right) -->
<g data-part="fieldLine">
  <g fill="none" stroke="#1E2761" stroke-width="2" stroke-linecap="round" class="sm-flow" stroke-dasharray="6 5">
    <path d="M118 62 C150 20 190 20 222 62"/>
    <path d="M114 74 C150 30 190 30 226 74"/>
    <path d="M114 106 C150 150 190 150 226 106"/>
    <path d="M118 118 C150 160 190 160 222 118"/>
  </g>
  <polygon points="168,15 178,18 170,24" fill="#1E2761"/>
  <polygon points="168,165 178,162 170,156" fill="#1E2761"/>
</g>

<!-- North pole (left, red) -->
<g data-part="northPole">
  <rect x="86" y="76" width="44" height="28" rx="4" fill="#B4341E" stroke="#1E2761" stroke-width="3"/>
  <text x="108" y="96" font-size="14" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">N</text>
</g>
<!-- South pole (right, navy) -->
<g data-part="southPole">
  <rect x="130" y="76" width="44" height="28" rx="4" fill="#1E2761" stroke="#1E2761" stroke-width="3"/>
  <text x="152" y="96" font-size="14" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">S</text>
</g>

<!-- Plotting compass, needle aligned with field -->
<g data-part="compass">
  <circle cx="60" cy="150" r="20" fill="#F4F6FC" stroke="#7a8199" stroke-width="2.5"/>
  <circle cx="60" cy="150" r="20" fill="none" stroke="#ffffff" stroke-width="1"/>
  <g class="sm-osc">
    <polygon points="60,134 65,150 60,150" fill="#B4341E"/>
    <polygon points="60,166 65,150 60,150" fill="#1E2761"/>
    <polygon points="60,134 55,150 60,150" fill="#d85f4c"/>
    <polygon points="60,166 55,150 60,150" fill="#3a4a91"/>
    <circle cx="60" cy="150" r="2.5" fill="#1E2761"/>
  </g>
</g>
</g>
<g data-part="northPole" class="dg-label"><circle cx="92.8" cy="75.9" r="3.4"/><text x="92.8" y="67.9" font-size="12" text-anchor="middle">North pole</text></g>
<g data-part="southPole" class="dg-label"><circle cx="156.8" cy="75.9" r="3.4"/><text x="156.8" y="67.9" font-size="12" text-anchor="middle">South pole</text></g>
<g data-part="fieldLine" class="dg-label"><circle cx="128.0" cy="20.7" r="3.4"/><text x="128.0" y="40.7" font-size="12" text-anchor="middle">Field line</text></g>
<g data-part="compass" class="dg-label"><circle cx="76.8" cy="179.4" r="3.4"/><text x="76.8" y="171.4" font-size="12" text-anchor="middle">Plotting compass</text></g>
<g data-part="earth" class="dg-label"><circle cx="243.2" cy="167.9" r="3.4"/><text x="243.2" y="159.9" font-size="12" text-anchor="middle">Earth's field</text></g>
</svg>
