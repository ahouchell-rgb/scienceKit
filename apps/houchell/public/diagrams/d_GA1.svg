<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The atom &amp; isotopes">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="4" y="4" width="312" height="272" rx="14" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/>
<g data-part="shell">
  <circle cx="140" cy="142" r="52" fill="none" stroke="#1E2761" stroke-width="2.4"/>
  <circle cx="140" cy="142" r="98" fill="none" stroke="#1E2761" stroke-width="2.4"/>
</g>
<g data-part="nucleus">
  <circle cx="140" cy="142" r="26" fill="none" stroke="#7a8199" stroke-width="1.4" stroke-dasharray="3 3"/>
</g>
<g data-part="proton">
  <circle cx="130" cy="134" r="9" fill="#B4341E" stroke="#1E2761" stroke-width="1.6"/>
  <circle cx="150" cy="132" r="9" fill="#B4341E" stroke="#1E2761" stroke-width="1.6"/>
  <circle cx="140" cy="152" r="9" fill="#B4341E" stroke="#1E2761" stroke-width="1.6"/>
  <line x1="127" y1="134" x2="133" y2="134" stroke="#fff" stroke-width="1.4"/>
  <line x1="130" y1="131" x2="130" y2="137" stroke="#fff" stroke-width="1.4"/>
  <line x1="147" y1="132" x2="153" y2="132" stroke="#fff" stroke-width="1.4"/>
  <line x1="150" y1="129" x2="150" y2="135" stroke="#fff" stroke-width="1.4"/>
  <line x1="137" y1="152" x2="143" y2="152" stroke="#fff" stroke-width="1.4"/>
  <line x1="140" y1="149" x2="140" y2="155" stroke="#fff" stroke-width="1.4"/>
</g>
<g data-part="neutron">
  <circle cx="141" cy="133" r="9" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.6"/>
  <circle cx="130" cy="150" r="9" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.6"/>
  <circle cx="151" cy="150" r="9" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.6"/>
</g>
<g data-part="electron">
  <circle class="sm-spin-slow" cx="140" cy="90" r="5.5" fill="#2C5F2D"/>
  <circle cx="192" cy="142" r="5.5" fill="#2C5F2D"/>
  <circle cx="140" cy="240" r="5.5" fill="#2C5F2D"/>
  <circle cx="66" cy="180" r="5.5" fill="#2C5F2D"/>
  <line x1="137" y1="90" x2="143" y2="90" stroke="#fff" stroke-width="1.4"/>
  <line x1="189" y1="142" x2="195" y2="142" stroke="#fff" stroke-width="1.4"/>
  <line x1="137" y1="240" x2="143" y2="240" stroke="#fff" stroke-width="1.4"/>
  <line x1="63" y1="180" x2="69" y2="180" stroke="#fff" stroke-width="1.4"/>
</g>
<g data-part="ejectedElectron">
  <path d="M170 60 Q220 40 268 32" fill="none" stroke="#B4341E" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <polygon points="268,32 259,31 262,40" fill="#B4341E"/>
  <circle class="sm-drift" cx="270" cy="30" r="5.5" fill="#2C5F2D" stroke="#B4341E" stroke-width="1.6"/>
  <text x="228" y="118" font-family="Arial,sans-serif" font-size="16" fill="#B4341E" text-anchor="middle" font-weight="bold">+</text>
  <circle cx="228" cy="113" r="12" fill="none" stroke="#B4341E" stroke-width="1.6"/>
</g>
</g>
<g data-part="nucleus" class="dg-label"><circle cx="150.4" cy="106.4" r="3.4"/><text x="150.4" y="98.4" font-size="12" text-anchor="middle">Nucleus</text></g>
<g data-part="proton" class="dg-label"><circle cx="137.6" cy="168.0" r="3.4"/><text x="137.6" y="160.0" font-size="12" text-anchor="middle">Proton</text></g>
<g data-part="neutron" class="dg-label"><circle cx="192.0" cy="140.0" r="3.4"/><text x="192.0" y="132.0" font-size="12" text-anchor="middle">Neutron</text></g>
<g data-part="electron" class="dg-label"><circle cx="262.4" cy="140.0" r="3.4"/><text x="255.4" y="132.0" font-size="12" text-anchor="end">Electron</text></g>
<g data-part="shell" class="dg-label"><circle cx="105.6" cy="95.2" r="3.4"/><text x="105.6" y="87.2" font-size="12" text-anchor="middle">Electron shell</text></g>
<g data-part="ejectedElectron" class="dg-label"><circle cx="294.4" cy="16.8" r="3.4"/><text x="287.4" y="36.8" font-size="12" text-anchor="end">Ejected electron (ion)</text></g>
</svg>
