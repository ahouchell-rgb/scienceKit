<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Greenhouse gases &amp; pollutants">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" rx="10" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/>
<path d="M0 196 Q160 182 320 196 L320 234 Q160 234 0 234 Z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" stroke-linejoin="round"/>
<g data-part="sun">
  <circle cx="40" cy="42" r="22" fill="#F4C430" stroke="#B4341E" stroke-width="3"/>
  <g class="sm-glow" stroke="#B4341E" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="10" x2="40" y2="2"/>
    <line x1="70" y1="20" x2="76" y2="13"/>
    <line x1="10" y1="20" x2="4" y2="13"/>
    <line x1="72" y1="42" x2="80" y2="42"/>
    <line x1="18" y1="66" x2="12" y2="73"/>
  </g>
</g>
<g data-part="sunlight">
  <g class="sm-fall" stroke="#F4C430" stroke-width="3" stroke-linecap="round" fill="#F4C430">
    <line x1="66" y1="58" x2="116" y2="150" stroke-dasharray="8 7"/>
    <polygon points="116,150 105,142 120,138"/>
    <line x1="86" y1="52" x2="140" y2="150" stroke-dasharray="8 7"/>
    <polygon points="140,150 129,143 144,138"/>
  </g>
</g>
<g data-part="greenhouseGases">
  <g fill="none" stroke="#7a8199" stroke-width="2.5" stroke-dasharray="8 6">
    <line x1="150" y1="70" x2="286" y2="70"/>
    <line x1="150" y1="84" x2="286" y2="84"/>
  </g>
  <g fill="#AEB6D6" stroke="#1E2761" stroke-width="2">
    <circle cx="168" cy="77" r="7"/>
    <circle cx="202" cy="77" r="7"/>
    <circle cx="236" cy="77" r="7"/>
    <circle cx="270" cy="77" r="7"/>
  </g>
</g>
<g data-part="infrared">
  <g class="sm-flow" stroke="#B4341E" stroke-width="3" stroke-linecap="round" fill="#B4341E">
    <path d="M172 188 L172 96" fill="none" stroke-dasharray="7 6"/>
    <polygon points="172,96 165,108 179,108"/>
    <path d="M172 96 L150 150" fill="none" stroke-dasharray="7 6"/>
    <polygon points="150,150 150,137 161,144"/>
  </g>
</g>
<g data-part="factory">
  <rect x="40" y="164" width="60" height="34" fill="#B0B7C9" stroke="#1E2761" stroke-width="2.5"/>
  <rect x="50" y="150" width="12" height="48" fill="#8891A8" stroke="#1E2761" stroke-width="2.5"/>
  <rect x="72" y="150" width="12" height="48" fill="#8891A8" stroke="#1E2761" stroke-width="2.5"/>
  <rect x="46" y="176" width="12" height="12" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.5"/>
  <rect x="66" y="176" width="12" height="12" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.5"/>
</g>
<g data-part="soot">
  <g class="sm-rise" fill="#4a4a4a" opacity="0.85">
    <circle cx="56" cy="140" r="6"/>
    <circle cx="62" cy="128" r="5"/>
    <circle cx="53" cy="118" r="4.5"/>
    <circle cx="60" cy="108" r="3.5"/>
  </g>
</g>
<g data-part="acidRain">
  <ellipse cx="250" cy="150" rx="40" ry="18" fill="#9AA2B8" stroke="#1E2761" stroke-width="2.5"/>
  <g class="sm-fall" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round">
    <line x1="224" y1="170" x2="220" y2="184"/>
    <line x1="242" y1="170" x2="238" y2="186"/>
    <line x1="260" y1="170" x2="256" y2="184"/>
    <line x1="278" y1="170" x2="274" y2="186"/>
  </g>
</g>
</g>
<g data-part="sun" class="dg-label"><circle cx="41.6" cy="43.2" r="3.4"/><text x="48.6" y="35.2" font-size="12" text-anchor="start">Sun</text></g>
<g data-part="sunlight" class="dg-label"><circle cx="112.0" cy="84.0" r="3.4"/><text x="112.0" y="76.0" font-size="12" text-anchor="middle">Incoming sunlight</text></g>
<g data-part="greenhouseGases" class="dg-label"><circle cx="198.4" cy="67.2" r="3.4"/><text x="198.4" y="59.2" font-size="12" text-anchor="middle">Greenhouse gases</text></g>
<g data-part="infrared" class="dg-label"><circle cx="160.0" cy="144.0" r="3.4"/><text x="160.0" y="136.0" font-size="12" text-anchor="middle">Re-emitted infrared</text></g>
<g data-part="factory" class="dg-label"><circle cx="249.6" cy="172.8" r="3.4"/><text x="249.6" y="164.8" font-size="12" text-anchor="middle">Burning fossil fuels</text></g>
<g data-part="soot" class="dg-label"><circle cx="281.6" cy="120.0" r="3.4"/><text x="274.6" y="112.0" font-size="12" text-anchor="end">Soot (particulates)</text></g>
<g data-part="acidRain" class="dg-label"><circle cx="89.6" cy="177.6" r="3.4"/><text x="89.6" y="169.6" font-size="12" text-anchor="middle">Acid rain</text></g>
</svg>
