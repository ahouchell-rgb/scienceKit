<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Series &amp; parallel circuits">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="2" y="2" width="316" height="236" rx="12" fill="#F4F6FC" stroke="#1E2761" stroke-width="2"/>
<line x1="160" y1="20" x2="160" y2="220" stroke="#7a8199" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="70" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#1E2761">SERIES</text>
<text x="238" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#1E2761">PARALLEL</text>

<!-- battery : bottom-left, the shared supply -->
<g data-part="battery">
  <line x1="44" y1="188" x2="44" y2="212" stroke="#F4F6FC" stroke-width="6"/>
  <line x1="34" y1="190" x2="54" y2="190" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="36" y1="198" x2="52" y2="198" stroke="#1E2761" stroke-width="6" stroke-linecap="round"/>
  <line x1="34" y1="206" x2="54" y2="206" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="36" y1="214" x2="52" y2="214" stroke="#1E2761" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- seriesLoop : the single loop wire on the left -->
<g data-part="seriesLoop">
  <path d="M44 188 V50 H140 V212 H44" fill="none" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 44 l10 5 -10 5 z" fill="#C99528" class="sm-drift"/>
</g>

<!-- seriesResistor : two resistors in the top run of the series loop -->
<g data-part="seriesResistor">
  <line x1="60" y1="50" x2="92" y2="50" stroke="#F4F6FC" stroke-width="7"/>
  <rect x="60" y="42" width="32" height="16" rx="3" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/>
  <line x1="100" y1="50" x2="132" y2="50" stroke="#F4F6FC" stroke-width="7"/>
  <rect x="100" y="42" width="32" height="16" rx="3" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/>
</g>

<!-- seriesBreak : a gap in the right vertical of the series loop -->
<g data-part="seriesBreak">
  <line x1="140" y1="118" x2="140" y2="142" stroke="#F4F6FC" stroke-width="8"/>
  <circle cx="140" cy="118" r="3.5" fill="#B4341E"/>
  <circle cx="140" cy="142" r="3.5" fill="#B4341E"/>
  <path d="M126 122 l16 16 M142 122 l-16 16" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- parallelJunction : node on the right where current splits -->
<g data-part="parallelJunction">
  <path d="M210 188 V70 H300 V70" fill="none" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/>
  <path d="M210 212 H300 V70" fill="none" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/>
  <line x1="188" y1="200" x2="210" y2="200" stroke="#1E2761" stroke-width="3"/>
  <path d="M210 188 V212" fill="none" stroke="#1E2761" stroke-width="3"/>
  <circle cx="210" cy="130" r="4.5" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
  <circle cx="300" cy="130" r="4.5" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
  <line x1="188" y1="200" x2="188" y2="200" stroke="#1E2761" stroke-width="3"/>
</g>

<!-- parallelBranch : two horizontal branches each with a resistor -->
<g data-part="parallelBranch">
  <line x1="210" y1="100" x2="300" y2="100" stroke="#1E2761" stroke-width="3"/>
  <line x1="210" y1="160" x2="300" y2="160" stroke="#1E2761" stroke-width="3"/>
  <rect x="238" y="92" width="34" height="16" rx="3" fill="#F4F6FC" stroke="#1E2761" stroke-width="3"/>
  <rect x="238" y="152" width="34" height="16" rx="3" fill="#F4F6FC" stroke="#1E2761" stroke-width="3"/>
  <g fill="#C99528" class="sm-drift">
    <path d="M258 94 l0 0" />
    <path d="M226 100 l8 4 -8 4 z"/>
    <path d="M226 160 l8 4 -8 4 z"/>
  </g>
</g>

</g>
<g data-part="battery" class="dg-label"><circle cx="41.6" cy="45.6" r="3.4"/><text x="48.6" y="37.6" font-size="12" text-anchor="start">Battery (supply)</text></g>
<g data-part="seriesLoop" class="dg-label"><circle cx="131.2" cy="48.0" r="3.4"/><text x="131.2" y="40.0" font-size="12" text-anchor="middle">Series loop</text></g>
<g data-part="seriesResistor" class="dg-label"><circle cx="121.6" cy="134.4" r="3.4"/><text x="121.6" y="126.4" font-size="12" text-anchor="middle">Resistor</text></g>
<g data-part="seriesBreak" class="dg-label"><circle cx="60.8" cy="206.4" r="3.4"/><text x="67.8" y="198.4" font-size="12" text-anchor="start">Single break</text></g>
<g data-part="parallelJunction" class="dg-label"><circle cx="230.4" cy="60.0" r="3.4"/><text x="230.4" y="52.0" font-size="12" text-anchor="middle">Junction</text></g>
<g data-part="parallelBranch" class="dg-label"><circle cx="288.0" cy="98.4" r="3.4"/><text x="281.0" y="90.4" font-size="12" text-anchor="end">Parallel branch</text></g>
</svg>
