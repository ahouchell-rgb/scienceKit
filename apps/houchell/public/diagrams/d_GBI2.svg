<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Defence &amp; medicines">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="300" fill="#F4F6FC"/><path d="M150 24 v250" stroke="#7a8199" stroke-width="1.4" stroke-dasharray="2 6"/><g data-part="skin"><rect x="18" y="24" width="118" height="34" rx="6" fill="#F4C9A0" stroke="#1E2761" stroke-width="2.5"/><path d="M18 42 q14 -8 28 0 t28 0 t28 0 t28 0" fill="none" stroke="#B4341E" stroke-width="2"/><circle cx="70" cy="14" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2" class="sm-osc"/><polyline points="70,20 70,36" fill="none" stroke="#7a8199" stroke-width="2" stroke-dasharray="3 3"/><polyline points="70,36 62,26 78,26" fill="none" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/></g><g data-part="airwayCilia"><rect x="18" y="86" width="118" height="24" rx="4" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/><g stroke="#2C5F2D" stroke-width="2.5" stroke-linecap="round" class="sm-osc-x"><line x1="30" y1="86" x2="30" y2="74"/><line x1="44" y1="86" x2="44" y2="74"/><line x1="58" y1="86" x2="58" y2="74"/><line x1="72" y1="86" x2="72" y2="74"/><line x1="86" y1="86" x2="86" y2="74"/><line x1="100" y1="86" x2="100" y2="74"/><line x1="114" y1="86" x2="114" y2="74"/></g><circle cx="60" cy="80" r="5" fill="#7a8199" class="sm-drift"/><polyline class="sm-flow" points="60,78 90,72 120,70" fill="none" stroke="#7a8199" stroke-width="2" stroke-dasharray="5 5"/></g><g data-part="stomachAcid"><path d="M40 138 q-14 6 -6 26 q10 24 34 24 q24 0 34 -24 q8 -20 -6 -26 Z" fill="#F7ECD3" stroke="#C99528" stroke-width="2.5"/><g class="sm-drift"><text x="52" y="176" font-family="Georgia, serif" font-size="11" fill="#B4341E">H+</text><text x="82" y="168" font-family="Georgia, serif" font-size="11" fill="#B4341E">H+</text><text x="66" y="184" font-family="Georgia, serif" font-size="11" fill="#B4341E">H+</text></g></g><g data-part="whiteBloodCell"><path d="M230 70 q-8 -24 16 -26 q10 -10 22 2 q22 -6 22 18 q14 12 -2 26 q4 22 -18 20 q-10 12 -24 0 q-22 4 -20 -18 q-12 -12 4 -22 Z" fill="#fff" stroke="#1E2761" stroke-width="3" class="sm-pulse"/><circle cx="252" cy="74" r="12" fill="#DCEAF6" stroke="#1E2761" stroke-width="2"/></g><g data-part="pathogen"><circle cx="252" cy="74" r="7" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" class="sm-throb"/><g stroke="#2C5F2D" stroke-width="1.6" stroke-linecap="round"><line x1="252" y1="65" x2="252" y2="61"/><line x1="252" y1="83" x2="252" y2="87"/><line x1="243" y1="74" x2="239" y2="74"/></g><path d="M285 100 l6 8 M285 100 l-6 8 M285 100 v-8" stroke="#B4341E" stroke-width="2" stroke-linecap="round" class="sm-drift"/></g><g data-part="antibiotic"><rect x="24" y="222" width="120" height="60" rx="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><rect x="36" y="244" width="34" height="16" rx="8" fill="#B4341E" stroke="#1E2761" stroke-width="2"/><rect x="36" y="244" width="17" height="16" rx="8" fill="#fff" stroke="#1E2761" stroke-width="2"/><rect x="88" y="240" width="30" height="12" rx="6" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><path d="M96 236 l16 20 M112 236 l-16 20" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><rect x="94" y="262" width="26" height="11" rx="5" fill="#C99528" stroke="#1E2761" stroke-width="2" class="sm-throb"/></g><g data-part="drugTrial"><rect x="184" y="196" width="112" height="88" rx="8" fill="#fff" stroke="#1E2761" stroke-width="2.5"/><rect x="216" y="188" width="48" height="16" rx="4" fill="#7a8199" stroke="#1E2761" stroke-width="2"/><g stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M196 218 l6 6 12 -12"/><path d="M196 242 l6 6 12 -12"/><path d="M196 266 l6 6 12 -12"/></g><g stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"><line x1="224" y1="220" x2="284" y2="220"/><line x1="224" y1="244" x2="284" y2="244"/><line x1="224" y1="268" x2="284" y2="268"/></g></g>
</g>
<g data-part="skin" class="dg-label"><circle cx="105.6" cy="66.0" r="3.4"/><text x="105.6" y="58.0" font-size="12" text-anchor="middle">Skin barrier</text></g>
<g data-part="airwayCilia" class="dg-label"><circle cx="105.6" cy="126.0" r="3.4"/><text x="105.6" y="118.0" font-size="12" text-anchor="middle">Mucus &amp; cilia</text></g>
<g data-part="stomachAcid" class="dg-label"><circle cx="105.6" cy="177.0" r="3.4"/><text x="105.6" y="169.0" font-size="12" text-anchor="middle">Stomach acid</text></g>
<g data-part="whiteBloodCell" class="dg-label"><circle cx="214.4" cy="87.0" r="3.4"/><text x="214.4" y="79.0" font-size="12" text-anchor="middle">White blood cell</text></g>
<g data-part="pathogen" class="dg-label"><circle cx="284.8" cy="66.0" r="3.4"/><text x="277.8" y="58.0" font-size="12" text-anchor="end">Pathogen</text></g>
<g data-part="antibiotic" class="dg-label"><circle cx="256.0" cy="186.0" r="3.4"/><text x="249.0" y="178.0" font-size="12" text-anchor="end">Antibiotic vs bacteria</text></g>
<g data-part="drugTrial" class="dg-label"><circle cx="256.0" cy="258.0" r="3.4"/><text x="249.0" y="250.0" font-size="12" text-anchor="end">Drug trial test</text></g>
</svg>
