<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Rate of reaction">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="280" fill="#ffffff"/>
<!-- ================= TOP: collision scene in a reaction box ================= -->
<rect x="14" y="14" width="292" height="104" rx="10" fill="#F4F6FC" stroke="#7a8199" stroke-width="1.6"/>
<!-- REACTANT PARTICLES (left) moving toward each other -->
<g data-part="reactants">
  <g class="sm-osc-x">
    <circle cx="46" cy="52" r="11" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.4"/>
    <circle cx="52" cy="82" r="11" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.4"/>
  </g>
  <!-- motion arrow -->
  <line x1="66" y1="66" x2="118" y2="66" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
  <polyline points="110,60 120,66 110,72" fill="none" stroke="#7a8199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- COLLISION (centre): two particles smashing, burst -->
<g data-part="collision">
  <circle cx="150" cy="66" r="11" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.4"/>
  <circle cx="172" cy="66" r="11" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.4"/>
  <g class="sm-throb">
    <line x1="161" y1="46" x2="161" y2="38" stroke="#C99528" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="177" y1="52" x2="184" y2="46" stroke="#C99528" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="145" y1="52" x2="138" y2="46" stroke="#C99528" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="161" y1="86" x2="161" y2="94" stroke="#C99528" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</g>
<!-- arrow to products -->
<line x1="196" y1="66" x2="228" y2="66" stroke="#7a8199" stroke-width="2.4" stroke-linecap="round"/>
<polyline points="220,60 230,66 220,72" fill="none" stroke="#7a8199" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- PRODUCT PARTICLES (right): rearranged, joined -->
<g data-part="products">
  <circle cx="256" cy="58" r="10" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.4"/>
  <circle cx="274" cy="76" r="10" fill="#C99528" stroke="#1E2761" stroke-width="2.4"/>
  <line x1="263" y1="65" x2="267" y2="69" stroke="#2C5F2D" stroke-width="2.4" stroke-linecap="round"/>
</g>
<!-- TEMPERATURE (heat) makes particles faster: thermometer + fast marks, below-left -->
<g data-part="temperature">
  <!-- thermometer -->
  <rect x="30" y="150" width="12" height="70" rx="6" fill="#ffffff" stroke="#B4341E" stroke-width="2.4"/>
  <circle cx="36" cy="226" r="12" fill="#B4341E"/>
  <rect x="33" y="188" width="6" height="34" fill="#B4341E"/>
  <g class="sm-glow">
    <line x1="50" y1="162" x2="62" y2="158" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="178" x2="64" y2="176" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="194" x2="62" y2="196" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- fast particles zooming -->
  <g class="sm-osc-x">
    <circle cx="92" cy="170" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
    <circle cx="116" cy="200" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
    <circle cx="80" cy="210" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  </g>
</g>
<!-- ================= BOTTOM-RIGHT: energy barrier profile ================= -->
<!-- axes (scaffolding) -->
<line x1="150" y1="255" x2="304" y2="255" stroke="#1E2761" stroke-width="2"/>
<line x1="150" y1="255" x2="150" y2="140" stroke="#1E2761" stroke-width="2"/>
<text x="146" y="150" font-family="sans-serif" font-size="9" fill="#1E2761" text-anchor="end">energy</text>
<!-- ACTIVATION ENERGY: the high barrier hump on the profile -->
<g data-part="activationEnergy">
  <path d="M158 238 L188 238 Q210 238 224 168 Q238 238 262 238 L298 238" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- barrier height marker -->
  <line x1="188" y1="238" x2="188" y2="172" stroke="#B4341E" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polyline points="184,180 188,172 192,180" fill="none" stroke="#B4341E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- CATALYST PATHWAY: lower barrier alternative route -->
<g data-part="catalystPath">
  <path d="M158 238 L188 238 Q206 238 224 206 Q242 238 262 238 L298 238" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
  <text x="256" y="200" font-family="sans-serif" font-size="9" fill="#2C5F2D" text-anchor="middle">lower</text>
</g>
</g>
<g data-part="reactants" class="dg-label"><circle cx="64.0" cy="56.0" r="3.4"/><text x="71.0" y="48.0" font-size="12" text-anchor="start">Reactant particles</text></g>
<g data-part="collision" class="dg-label"><circle cx="160.0" cy="58.8" r="3.4"/><text x="160.0" y="50.8" font-size="12" text-anchor="middle">Collision</text></g>
<g data-part="products" class="dg-label"><circle cx="256.0" cy="67.2" r="3.4"/><text x="249.0" y="59.2" font-size="12" text-anchor="end">Product particles</text></g>
<g data-part="temperature" class="dg-label"><circle cx="262.4" cy="117.6" r="3.4"/><text x="255.4" y="109.6" font-size="12" text-anchor="end">Faster particles (heat)</text></g>
<g data-part="activationEnergy" class="dg-label"><circle cx="160.0" cy="190.4" r="3.4"/><text x="160.0" y="182.4" font-size="12" text-anchor="middle">Activation energy</text></g>
<g data-part="catalystPath" class="dg-label"><circle cx="185.6" cy="224.0" r="3.4"/><text x="185.6" y="216.0" font-size="12" text-anchor="middle">Catalyst pathway</text></g>
</svg>
