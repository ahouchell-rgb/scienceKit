<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Enzymes &amp; digestion">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x='0' y='0' width='320' height='230' fill='#ffffff'/><rect x='0' y='0' width='320' height='230' fill='#F4F6FC'/><line x1='185' y1='28' x2='185' y2='202' stroke='#AEB6D6' stroke-width='2' stroke-dasharray='5 6'/><g data-part='enzyme'><path d='M30 96 q-12 0 -12 14 v20 q0 14 14 14 h58 q0 -20 20 -20 q20 0 20 20 h4 q14 0 14 -14 v-20 q0 -14 -14 -14 h-4 q0 20 -20 20 q-20 0 -20 -20 z' fill='#CDE5C6' stroke='#2C5F2D' stroke-width='3' stroke-linejoin='round'/></g><g data-part='activeSite'><path d='M70 60 h44 q10 0 10 10 v12 q-20 0 -20 20 q-20 0 -20 -20 q-10 0 -10 -10 v-2 q0 -10 10 -10 z' fill='#ffffff' stroke='#1E2761' stroke-width='3' stroke-linejoin='round'/></g><g data-part='substrate'><rect class='sm-drift' x='80' y='30' width='18' height='16' rx='5' fill='#F1D2D8' stroke='#B4341E' stroke-width='2.5'/><rect class='sm-drift' x='98' y='32' width='18' height='16' rx='5' fill='#DCEAF6' stroke='#1E2761' stroke-width='2.5'/><line x1='97' y1='50' x2='97' y2='60' stroke='#7a8199' stroke-width='2.5'/><polygon points='92,58 97,66 102,58' fill='#7a8199'/></g><g data-part='products'><path class='sm-flow' d='M140 120 h34' fill='none' stroke='#2C5F2D' stroke-width='3' stroke-dasharray='6 6'/><polygon points='174,114 186,120 174,126' fill='#2C5F2D'/><rect x='214' y='150' width='20' height='17' rx='5' fill='#F1D2D8' stroke='#B4341E' stroke-width='2.5'/><rect x='250' y='150' width='20' height='17' rx='5' fill='#DCEAF6' stroke='#1E2761' stroke-width='2.5'/></g><g data-part='denatured'><path class='sm-shake' d='M232 96 q-14 -6 -8 -20 q-16 4 -20 -10 q-6 12 -22 6 q6 16 -8 20 q16 6 10 22 q14 -8 22 4 q6 -14 22 -14 z' fill='#E7D6C0' stroke='#B4341E' stroke-width='3' stroke-linejoin='round'/><rect x='236' y='120' width='18' height='16' rx='5' fill='#DCEAF6' stroke='#7a8199' stroke-width='2.5'/><line x1='256' y1='120' x2='276' y2='138' stroke='#B4341E' stroke-width='2.5'/><text x='268' y='118' font-size='12' fill='#B4341E' text-anchor='middle'>&#215;</text></g>
</g>
<g data-part="enzyme" class="dg-label"><circle cx="64.0" cy="138.0" r="3.4"/><text x="71.0" y="130.0" font-size="12" text-anchor="start">Enzyme</text></g>
<g data-part="activeSite" class="dg-label"><circle cx="108.8" cy="96.6" r="3.4"/><text x="108.8" y="88.6" font-size="12" text-anchor="middle">Active site</text></g>
<g data-part="substrate" class="dg-label"><circle cx="89.6" cy="57.5" r="3.4"/><text x="89.6" y="49.5" font-size="12" text-anchor="middle">Substrate</text></g>
<g data-part="products" class="dg-label"><circle cx="256.0" cy="66.7" r="3.4"/><text x="249.0" y="58.7" font-size="12" text-anchor="end">Products</text></g>
<g data-part="denatured" class="dg-label"><circle cx="38.4" cy="195.5" r="3.4"/><text x="45.4" y="187.5" font-size="12" text-anchor="start">Denatured enzyme</text></g>
</svg>
