<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Life cycle assessment &amp; recycling">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="2" y="2" width="316" height="296" rx="14" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/>
<g fill="#1E2761" stroke="#1E2761" stroke-width="3" stroke-linecap="round">
  <line x1="132" y1="58" x2="184" y2="58"/><polygon points="192,58 180,52 180,64"/>
  <line x1="240" y1="92" x2="240" y2="140"/><polygon points="240,148 234,136 246,136"/>
  <line x1="188" y1="180" x2="136" y2="180"/><polygon points="128,180 140,174 140,186"/>
</g>
<g data-part="rawMaterials">
  <rect x="34" y="34" width="92" height="48" rx="8" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/>
  <path d="M52 70 L62 52 L72 70 Z M70 70 L80 56 L90 70 Z" fill="#2C5F2D" opacity="0.85"/>
  <path d="M96 66 l6 -10 l6 10 Z" fill="#8A6A52"/>
</g>
<g data-part="manufacture">
  <rect x="194" y="34" width="92" height="48" rx="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M206 70 L206 50 L216 58 L216 50 L226 58 L226 50 L236 58 L236 70 Z" fill="#8891A8" stroke="#1E2761" stroke-width="1.5" stroke-linejoin="round"/>
  <g class="sm-rise" fill="#7a8199" opacity="0.7"><circle cx="252" cy="48" r="4"/><circle cx="260" cy="42" r="3"/></g>
  <rect x="266" y="46" width="14" height="24" fill="#8891A8" stroke="#1E2761" stroke-width="1.5"/>
</g>
<g data-part="use">
  <rect x="194" y="150" width="92" height="48" rx="8" fill="#F7F2E6" stroke="#C99528" stroke-width="2.5"/>
  <rect x="222" y="162" width="36" height="24" rx="3" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/>
  <g class="sm-blink" fill="#C99528"><circle cx="240" cy="174" r="4"/></g>
  <line x1="240" y1="150" x2="240" y2="162" stroke="#1E2761" stroke-width="2"/>
</g>
<g data-part="disposal">
  <rect x="34" y="150" width="92" height="48" rx="8" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/>
  <path d="M56 168 L104 168 L100 192 L60 192 Z" fill="#B0B7C9" stroke="#B4341E" stroke-width="2" stroke-linejoin="round"/>
  <line x1="52" y1="168" x2="108" y2="168" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="162" x2="80" y2="168" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="176" x2="74" y2="188" stroke="#B4341E" stroke-width="1.5"/><line x1="84" y1="176" x2="84" y2="188" stroke="#B4341E" stroke-width="1.5"/><line x1="94" y1="176" x2="92" y2="188" stroke="#B4341E" stroke-width="1.5"/>
</g>
<g data-part="recycleLoop">
  <path class="sm-flow" d="M50 150 C34 122 34 100 50 74" fill="none" stroke="#2C5F2D" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round"/>
  <polygon points="55 70 42 76 52 84" fill="#2C5F2D"/>
  <g transform="translate(30,112)" stroke="#2C5F2D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8 -6 L0 -12 L4 -4"/><path d="M8 -2 L10 8 L2 6"/><path d="M-6 8 L-10 0 L-2 2"/>
  </g>
</g>
<g data-part="biasScale">
  <line x1="160" y1="232" x2="160" y2="288" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 288 L180 288" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
  <g class="sm-osc">
    <line x1="112" y1="238" x2="208" y2="226" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 238 a12 8 0 0 0 24 0 Z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
    <path d="M196 226 a12 8 0 0 0 24 0 Z" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  </g>
  <circle cx="160" cy="230" r="4" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
</g>
</g>
<g data-part="rawMaterials" class="dg-label"><circle cx="80.0" cy="60.0" r="3.4"/><text x="80.0" y="52.0" font-size="12" text-anchor="middle">Raw materials</text></g>
<g data-part="manufacture" class="dg-label"><circle cx="240.0" cy="60.0" r="3.4"/><text x="240.0" y="52.0" font-size="12" text-anchor="middle">Manufacture</text></g>
<g data-part="use" class="dg-label"><circle cx="240.0" cy="177.0" r="3.4"/><text x="240.0" y="169.0" font-size="12" text-anchor="middle">Use product</text></g>
<g data-part="disposal" class="dg-label"><circle cx="80.0" cy="177.0" r="3.4"/><text x="80.0" y="169.0" font-size="12" text-anchor="middle">Disposal</text></g>
<g data-part="recycleLoop" class="dg-label"><circle cx="92.8" cy="120.0" r="3.4"/><text x="92.8" y="112.0" font-size="12" text-anchor="middle">Recycle loop</text></g>
<g data-part="biasScale" class="dg-label"><circle cx="160.0" cy="255.0" r="3.4"/><text x="160.0" y="247.0" font-size="12" text-anchor="middle">Bias / judgement</text></g>
</svg>
