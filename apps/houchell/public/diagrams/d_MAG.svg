<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Magnets">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#F4F6FC"/>
<rect x="70" y="70" width="120" height="40" rx="6" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
<line x1="130" y1="70" x2="130" y2="110" stroke="#1E2761" stroke-width="2"/>
<g data-part="fieldLine" fill="none" stroke="#C99528" stroke-width="2" class="sm-flow" stroke-dasharray="7 6">
  <path d="M190 78 C 245 40, 245 140, 190 102"/>
  <path d="M190 84 C 230 55, 230 125, 190 96"/>
  <path d="M70 78 C 15 40, 15 140, 70 102"/>
  <path d="M70 84 C 30 55, 30 125, 70 96"/>
  <path d="M228 44 l9 3 l-6 7 z" fill="#C99528" stroke="none"/>
  <path d="M30 44 l-9 3 l6 7 z" fill="#C99528" stroke="none"/>
</g>
<g data-part="northPole">
  <rect x="130" y="70" width="60" height="40" fill="#B4341E"/>
  <rect x="184" y="70" width="6" height="40" rx="3" fill="#B4341E"/>
  <text x="150" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">N</text>
</g>
<g data-part="southPole">
  <rect x="70" y="70" width="60" height="40" fill="#1E2761"/>
  <rect x="70" y="70" width="6" height="40" rx="3" fill="#1E2761"/>
  <text x="94" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">S</text>
</g>
<g data-part="ironObject">
  <rect x="248" y="80" width="34" height="20" rx="3" fill="#B8C0CC" stroke="#7a8199" stroke-width="2"/>
  <rect x="248" y="80" width="34" height="7" rx="3" fill="#dfe4ea"/>
  <path class="sm-osc-x" d="M244 90 l14 -6 l0 4 l10 0 l0 4 l-10 0 l0 4 z" fill="#2C5F2D"/>
</g>
<g data-part="compass">
  <circle cx="60" cy="185" r="26" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
  <circle cx="60" cy="185" r="26" fill="none" stroke="#DCEAF6" stroke-width="3" opacity="0.6"/>
  <g class="sm-osc">
    <path d="M60 185 L52 164 L60 168 L68 164 Z" fill="#B4341E"/>
    <path d="M60 185 L52 206 L60 202 L68 206 Z" fill="#1E2761"/>
    <circle cx="60" cy="185" r="3" fill="#1E2761"/>
  </g>
  <text x="56" y="167" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1E2761">N</text>
</g>
<g data-part="solenoid">
  <line x1="150" y1="200" x2="270" y2="200" stroke="#1E2761" stroke-width="2.5"/>
  <g fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round">
    <path d="M162 188 a9 12 0 1 1 0 24"/>
    <path d="M178 188 a9 12 0 1 1 0 24"/>
    <path d="M194 188 a9 12 0 1 1 0 24"/>
    <path d="M210 188 a9 12 0 1 1 0 24"/>
    <path d="M226 188 a9 12 0 1 1 0 24"/>
    <path d="M242 188 a9 12 0 1 1 0 24"/>
  </g>
  <path d="M150 200 L150 226 L182 226" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M270 200 L270 226 L238 226" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="206" y1="218" x2="206" y2="234" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="214" y1="222" x2="214" y2="230" stroke="#1E2761" stroke-width="6"/>
</g>
</g>
<g data-part="northPole" class="dg-label"><circle cx="134.4" cy="100.0" r="3.4"/><text x="134.4" y="92.0" font-size="12" text-anchor="middle">North pole</text></g>
<g data-part="southPole" class="dg-label"><circle cx="185.6" cy="100.0" r="3.4"/><text x="185.6" y="92.0" font-size="12" text-anchor="middle">South pole</text></g>
<g data-part="fieldLine" class="dg-label"><circle cx="214.4" cy="30.0" r="3.4"/><text x="214.4" y="22.0" font-size="12" text-anchor="middle">Field line</text></g>
<g data-part="ironObject" class="dg-label"><circle cx="44.8" cy="100.0" r="3.4"/><text x="51.8" y="92.0" font-size="12" text-anchor="start">Iron object</text></g>
<g data-part="compass" class="dg-label"><circle cx="160.0" cy="212.5" r="3.4"/><text x="160.0" y="204.5" font-size="12" text-anchor="middle">Compass</text></g>
<g data-part="solenoid" class="dg-label"><circle cx="249.6" cy="130.0" r="3.4"/><text x="249.6" y="122.0" font-size="12" text-anchor="middle">Solenoid (coil)</text></g>
</svg>
