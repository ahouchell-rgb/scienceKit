<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Materials">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x='0' y='0' width='340' height='300' fill='#F4F6FC'/><g data-part='acidReaction'><path d='M28 40 L28 118 Q28 132 42 132 Q56 132 56 118 L56 40' fill='#F1D2D8' stroke='#1E2761' stroke-width='2.5'/><rect x='34' y='96' width='16' height='10' rx='2' fill='#AEB6D6' stroke='#1E2761' stroke-width='2'/><circle class='sm-rise' cx='40' cy='88' r='3' fill='#DCEAF6' stroke='#7a8199' stroke-width='1.2'/><circle class='sm-rise' cx='46' cy='76' r='2.5' fill='#DCEAF6' stroke='#7a8199' stroke-width='1.2'/><circle class='sm-rise' cx='36' cy='68' r='2' fill='#DCEAF6' stroke='#7a8199' stroke-width='1.2'/><text x='60' y='60' font-size='9' fill='#B4341E' font-family='sans-serif'>H₂</text></g><g data-part='reactivitySeries'><rect x='138' y='34' width='64' height='16' rx='3' fill='#B4341E'/><rect x='138' y='54' width='64' height='16' rx='3' fill='#D9772E'/><rect x='138' y='74' width='64' height='16' rx='3' fill='#C99528'/><rect x='138' y='94' width='64' height='16' rx='3' fill='#6C8E4E'/><rect x='138' y='114' width='64' height='16' rx='3' fill='#7a8199'/><line x1='128' y1='32' x2='128' y2='130' stroke='#1E2761' stroke-width='2'/><polygon points='128,32 124,42 132,42' fill='#1E2761'/></g><g data-part='furnace'><path d='M246 118 L246 60 Q246 40 266 40 L308 40 Q328 40 328 60 L328 118 Z' fill='#F7F2E6' stroke='#1E2761' stroke-width='2.5'/><rect x='262' y='24' width='16' height='20' fill='#AEB6D6' stroke='#1E2761' stroke-width='2'/><path class='sm-glow' d='M262 110 q10 -20 20 0 q10 -20 20 0' fill='none' stroke='#B4341E' stroke-width='3' stroke-linecap='round'/><circle cx='276' cy='72' r='6' fill='#3a3a3a'/><circle cx='300' cy='80' r='6' fill='#8a5a2a'/><rect x='300' y='118' width='24' height='8' fill='#C99528'/></g><g data-part='ceramic'><path d='M30 220 Q26 268 60 272 Q94 268 90 220 Q60 210 30 220 Z' fill='#D9A066' stroke='#1E2761' stroke-width='2.5'/><ellipse cx='60' cy='220' rx='30' ry='9' fill='#E9C79A' stroke='#1E2761' stroke-width='2.5'/><line x1='68' y1='240' x2='74' y2='252' stroke='#8a5a2a' stroke-width='1.5'/></g><g data-part='polymer'><path class='sm-flow' d='M132 234 q14 -16 28 0 q14 16 28 0 q14 -16 28 0' fill='none' stroke='#2C5F2D' stroke-width='3' stroke-dasharray='2 0'/><circle cx='132' cy='234' r='6' fill='#2C5F2D'/><circle cx='160' cy='234' r='6' fill='#2C5F2D'/><circle cx='188' cy='234' r='6' fill='#2C5F2D'/><circle cx='216' cy='234' r='6' fill='#2C5F2D'/><path class='sm-osc-x' d='M138 258 q14 -16 28 0 q14 16 28 0' fill='none' stroke='#6C8E4E' stroke-width='3'/><circle cx='138' cy='258' r='5' fill='#6C8E4E'/><circle cx='166' cy='258' r='5' fill='#6C8E4E'/><circle cx='194' cy='258' r='5' fill='#6C8E4E'/></g><g data-part='composite'><rect x='250' y='222' width='78' height='52' rx='4' fill='#CDCFDA' stroke='#1E2761' stroke-width='2.5'/><line x1='250' y1='236' x2='328' y2='236' stroke='#7a8199' stroke-width='4'/><line x1='250' y1='260' x2='328' y2='260' stroke='#7a8199' stroke-width='4'/><line x1='268' y1='222' x2='268' y2='274' stroke='#7a8199' stroke-width='3'/><line x1='300' y1='222' x2='300' y2='274' stroke='#7a8199' stroke-width='3'/><circle cx='266' cy='232' r='2' fill='#8a8f9e'/><circle cx='290' cy='250' r='2' fill='#8a8f9e'/><circle cx='312' cy='266' r='2' fill='#8a8f9e'/></g>
</g>
<g data-part="acidReaction" class="dg-label"><circle cx="149.6" cy="99.0" r="3.4"/><text x="149.6" y="91.0" font-size="13" text-anchor="middle">Metal + acid</text></g>
<g data-part="reactivitySeries" class="dg-label"><circle cx="44.2" cy="87.0" r="3.4"/><text x="51.2" y="79.0" font-size="13" text-anchor="start">Reactivity series</text></g>
<g data-part="furnace" class="dg-label"><circle cx="275.4" cy="87.0" r="3.4"/><text x="268.4" y="79.0" font-size="13" text-anchor="end">Furnace</text></g>
<g data-part="ceramic" class="dg-label"><circle cx="74.8" cy="237.0" r="3.4"/><text x="74.8" y="229.0" font-size="13" text-anchor="middle">Ceramic</text></g>
<g data-part="polymer" class="dg-label"><circle cx="173.4" cy="240.0" r="3.4"/><text x="173.4" y="232.0" font-size="13" text-anchor="middle">Polymer chain</text></g>
<g data-part="composite" class="dg-label"><circle cx="282.2" cy="237.0" r="3.4"/><text x="275.2" y="229.0" font-size="13" text-anchor="end">Composite</text></g>
</svg>
