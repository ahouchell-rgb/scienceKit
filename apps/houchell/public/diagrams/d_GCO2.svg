<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cracking &amp; alkenes">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" fill="#ffffff"/>
<!-- LARGE HYDROCARBON: long chain entering left -->
<g data-part="largeHydrocarbon">
  <line x1="20" y1="60" x2="96" y2="60" stroke="#1E2761" stroke-width="2.4"/>
  <circle cx="20" cy="60" r="7" fill="#1E2761"/>
  <circle cx="34" cy="60" r="7" fill="#1E2761"/>
  <circle cx="48" cy="60" r="7" fill="#1E2761"/>
  <circle cx="62" cy="60" r="7" fill="#1E2761"/>
  <circle cx="76" cy="60" r="7" fill="#1E2761"/>
  <circle cx="90" cy="60" r="7" fill="#1E2761"/>
</g>
<!-- HOT CATALYST: heated vessel, red flames, arrow through -->
<g data-part="catalyst">
  <rect x="118" y="34" width="84" height="56" rx="10" fill="#F1D2D8" stroke="#B4341E" stroke-width="3"/>
  <path class="sm-glow" d="M126 90 q6 12 12 4 q6 12 12 4 q6 12 12 4 q6 12 12 4 q6 12 12 4" fill="none" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round"/>
  <text x="160" y="68" font-family="sans-serif" font-size="13" fill="#B4341E" text-anchor="middle" font-weight="700">heat</text>
</g>
<!-- arrow into catalyst (scaffolding) -->
<line x1="98" y1="60" x2="116" y2="60" stroke="#7a8199" stroke-width="2.6" stroke-linecap="round"/>
<polyline points="109,54 118,60 109,66" fill="none" stroke="#7a8199" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- split arrows out of catalyst (scaffolding) -->
<path d="M202 55 Q230 40 250 34" fill="none" stroke="#7a8199" stroke-width="2.6" stroke-linecap="round"/>
<polyline points="243,32 252,32 250,42" fill="none" stroke="#7a8199" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M202 70 Q230 92 250 106" fill="none" stroke="#7a8199" stroke-width="2.6" stroke-linecap="round"/>
<polyline points="243,108 252,106 250,96" fill="none" stroke="#7a8199" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- SMALL ALKANE (fuel): short saturated chain top-right -->
<g data-part="smallAlkane">
  <line x1="258" y1="32" x2="298" y2="32" stroke="#2C5F2D" stroke-width="2.4"/>
  <circle cx="258" cy="32" r="7" fill="#2C5F2D"/>
  <circle cx="278" cy="32" r="7" fill="#2C5F2D"/>
  <circle cx="298" cy="32" r="7" fill="#2C5F2D"/>
</g>
<!-- ALKENE: shorter unsaturated molecule lower-right -->
<g data-part="alkene">
  <circle cx="262" cy="110" r="7" fill="#C99528"/>
  <circle cx="286" cy="110" r="7" fill="#C99528"/>
</g>
<!-- C=C DOUBLE BOND: the two parallel lines between alkene carbons -->
<g data-part="doubleBond">
  <line x1="269" y1="106" x2="279" y2="106" stroke="#B4341E" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="269" y1="114" x2="279" y2="114" stroke="#B4341E" stroke-width="2.8" stroke-linecap="round"/>
</g>
<!-- BROMINE WATER TEST: test tube, orange -> colourless -->
<g data-part="bromineTest">
  <!-- tube -->
  <path d="M132 150 h44 v70 a22 22 0 0 1 -44 0 z" fill="#ffffff" stroke="#1E2761" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- orange bromine water turning clear (gradient-ish via two fills) -->
  <path d="M134 190 h40 v30 a20 20 0 0 1 -40 0 z" fill="#F5E6C8" stroke="none"/>
  <path d="M134 172 h40 v20 h-40 z" fill="#E8A13C" opacity="0.85"/>
  <!-- alkene added, drifting -->
  <g class="sm-drift">
    <circle cx="150" cy="182" r="3" fill="#C99528"/>
    <circle cx="160" cy="200" r="3" fill="#C99528"/>
  </g>
  <text x="154" y="238" font-family="sans-serif" font-size="10" fill="#1E2761" text-anchor="middle">colourless</text>
</g>
</g>
<g data-part="largeHydrocarbon" class="dg-label"><circle cx="57.6" cy="103.2" r="3.4"/><text x="64.6" y="95.2" font-size="12" text-anchor="start">Large hydrocarbon</text></g>
<g data-part="catalyst" class="dg-label"><circle cx="153.6" cy="103.2" r="3.4"/><text x="153.6" y="95.2" font-size="12" text-anchor="middle">Hot catalyst</text></g>
<g data-part="smallAlkane" class="dg-label"><circle cx="236.8" cy="72.0" r="3.4"/><text x="236.8" y="64.0" font-size="12" text-anchor="middle">Small alkane (fuel)</text></g>
<g data-part="alkene" class="dg-label"><circle cx="214.4" cy="124.8" r="3.4"/><text x="214.4" y="116.8" font-size="12" text-anchor="middle">Alkene</text></g>
<g data-part="doubleBond" class="dg-label"><circle cx="256.0" cy="148.8" r="3.4"/><text x="249.0" y="140.8" font-size="12" text-anchor="end">C=C double bond</text></g>
<g data-part="bromineTest" class="dg-label"><circle cx="115.2" cy="225.6" r="3.4"/><text x="115.2" y="217.6" font-size="12" text-anchor="middle">Bromine water test</text></g>
</svg>
