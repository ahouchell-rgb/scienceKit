<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cell structure">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="250" fill="#ffffff"/>
<g data-part="cellWall">
  <rect x="20" y="24" width="280" height="202" rx="20" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="4"/>
</g>
<g data-part="cellMembrane">
  <rect x="30" y="34" width="260" height="182" rx="14" fill="none" stroke="#1E2761" stroke-width="2" stroke-dasharray="1 3"/>
</g>
<g data-part="cytoplasm">
  <rect x="33" y="37" width="254" height="176" rx="12" fill="#DCEAF6"/>
</g>
<g data-part="nucleus">
  <circle cx="160" cy="128" r="30" fill="#F1D2D8" stroke="#1E2761" stroke-width="3"/>
  <circle cx="160" cy="128" r="11" fill="#B4341E"/>
  <path d="M145 118 q8 -6 16 2 M150 138 q10 5 20 -3" stroke="#1E2761" stroke-width="1.5" fill="none" opacity="0.5"/>
</g>
<g data-part="chloroplast">
  <ellipse cx="72" cy="78" rx="21" ry="12" fill="#2C5F2D" stroke="#1b3d1c" stroke-width="2" transform="rotate(-20 72 78)"/>
  <line x1="60" y1="76" x2="84" y2="80" stroke="#79b06f" stroke-width="1.4" transform="rotate(-20 72 78)"/>
  <line x1="61" y1="82" x2="83" y2="85" stroke="#79b06f" stroke-width="1.4" transform="rotate(-20 72 78)"/>
  <ellipse cx="82" cy="180" rx="20" ry="11" fill="#2C5F2D" stroke="#1b3d1c" stroke-width="2" transform="rotate(15 82 180)"/>
  <line x1="70" y1="178" x2="94" y2="182" stroke="#79b06f" stroke-width="1.4" transform="rotate(15 82 180)"/>
</g>
<g data-part="mitochondria">
  <ellipse cx="238" cy="72" rx="24" ry="12" fill="#B4341E" stroke="#7a1a10" stroke-width="2" transform="rotate(18 238 72)"/>
  <path d="M220 72 q6 -7 12 0 t12 0 t12 0" stroke="#F1D2D8" stroke-width="2" fill="none" transform="rotate(18 238 72)"/>
</g>
<g data-part="ribosomes">
  <circle cx="110" cy="118" r="3.5" fill="#1E2761"/>
  <circle cx="120" cy="160" r="3.5" fill="#1E2761"/>
  <circle cx="205" cy="150" r="3.5" fill="#1E2761"/>
  <circle cx="222" cy="180" r="3.5" fill="#1E2761"/>
  <circle cx="245" cy="130" r="3.5" fill="#1E2761"/>
  <circle cx="190" cy="190" r="3.5" fill="#1E2761"/>
</g>

</g>
<g data-part="cellWall" class="dg-label"><circle cx="32.0" cy="35.0" r="3.4"/><text x="39.0" y="27.0" font-size="12" text-anchor="start">Cell wall</text></g>
<g data-part="cellMembrane" class="dg-label"><circle cx="166.4" cy="40.0" r="3.4"/><text x="166.4" y="32.0" font-size="12" text-anchor="middle">Cell membrane</text></g>
<g data-part="chloroplast" class="dg-label"><circle cx="92.8" cy="80.0" r="3.4"/><text x="92.8" y="72.0" font-size="12" text-anchor="middle">Chloroplast</text></g>
<g data-part="mitochondria" class="dg-label"><circle cx="230.4" cy="77.5" r="3.4"/><text x="230.4" y="69.5" font-size="12" text-anchor="middle">Mitochondria</text></g>
<g data-part="nucleus" class="dg-label"><circle cx="166.4" cy="125.0" r="3.4"/><text x="166.4" y="117.0" font-size="12" text-anchor="middle">Nucleus</text></g>
<g data-part="cytoplasm" class="dg-label"><circle cx="96.0" cy="200.0" r="3.4"/><text x="96.0" y="192.0" font-size="12" text-anchor="middle">Cytoplasm</text></g>
<g data-part="ribosomes" class="dg-label"><circle cx="246.4" cy="175.0" r="3.4"/><text x="246.4" y="167.0" font-size="12" text-anchor="middle">Ribosomes</text></g>
</svg>
