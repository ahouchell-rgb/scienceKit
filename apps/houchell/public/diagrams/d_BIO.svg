<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Biodiversity">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="280" fill="#F4F6FC"/><g stroke="#7a8199" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M160 62 L160 88"/><path d="M81 118 L160 100 L239 118"/><path d="M160 100 L160 118"/><path d="M160 162 L160 128"/></g><g data-part="classification"><rect x="120" y="32" width="80" height="30" rx="8" fill="#1E2761"/><g stroke="#fff" stroke-width="2" fill="none"><circle cx="140" cy="47" r="5"/><circle cx="160" cy="47" r="5"/><circle cx="180" cy="47" r="5"/><line x1="145" y1="47" x2="155" y2="47"/><line x1="165" y1="47" x2="175" y2="47"/></g></g><g data-part="fiveKingdoms"><rect x="120" y="88" width="80" height="30" rx="8" fill="#2C5F2D"/><g fill="#fff"><circle cx="133" cy="103" r="4"/><circle cx="146" cy="103" r="4"/><circle cx="160" cy="103" r="4"/><circle cx="174" cy="103" r="4"/><circle cx="187" cy="103" r="4"/></g></g><g data-part="vertebrate"><rect x="36" y="118" width="90" height="44" rx="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><line x1="52" y1="140" x2="110" y2="140" stroke="#1E2761" stroke-width="3"/><g fill="#1E2761"><circle cx="56" cy="140" r="4"/><circle cx="68" cy="140" r="4"/><circle cx="80" cy="140" r="4"/><circle cx="92" cy="140" r="4"/><circle cx="104" cy="140" r="4"/></g></g><g data-part="invertebrate"><rect x="194" y="118" width="90" height="44" rx="8" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/><path d="M208 140 Q222 128 236 140 Q250 152 262 140" fill="none" stroke="#2C5F2D" stroke-width="4" stroke-linecap="round"/><circle cx="268" cy="136" r="6" fill="#2C5F2D"/><g stroke="#2C5F2D" stroke-width="2" stroke-linecap="round"><line x1="272" y1="130" x2="278" y2="125"/><line x1="273" y1="140" x2="280" y2="142"/></g></g><g data-part="species"><g fill="#C99528" stroke="#1E2761" stroke-width="2" stroke-linejoin="round"><path d="M92 210 Q100 198 116 202 Q124 204 122 214 Q108 220 92 214 Z"/><circle cx="120" cy="203" r="6"/><path d="M126 203 L134 201 L128 207 Z"/></g><g fill="#C99528" stroke="#1E2761" stroke-width="2" stroke-linejoin="round" transform="translate(320,0) scale(-1,1)"><path d="M92 210 Q100 198 116 202 Q124 204 122 214 Q108 220 92 214 Z"/><circle cx="120" cy="203" r="6"/><path d="M126 203 L134 201 L128 207 Z"/></g><path d="M160 208 Q156 202 152 206 Q149 209 160 218 Q171 209 168 206 Q164 202 160 208 Z" fill="#B4341E" class="sm-throb"/><circle cx="160" cy="232" r="6" fill="#C99528" stroke="#1E2761" stroke-width="2"/></g><g data-part="conservation"><path d="M40 262 Q60 244 80 262" fill="none" stroke="#2C5F2D" stroke-width="3.5" stroke-linecap="round"/><path d="M46 266 Q60 250 74 266" fill="none" stroke="#2C5F2D" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="252" x2="60" y2="240" stroke="#2C5F2D" stroke-width="3"/><path d="M60 244 Q50 240 46 232 Q56 232 60 242 Z" fill="#2C5F2D"/><path d="M60 244 Q70 238 74 230 Q64 230 60 240 Z" fill="#357a36"/></g><g data-part="seedVault"><rect x="238" y="232" width="52" height="42" rx="6" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/><rect x="248" y="224" width="32" height="10" rx="3" fill="#1E2761"/><g fill="#C99528"><circle cx="252" cy="256" r="4"/><circle cx="264" cy="262" r="4"/><circle cx="276" cy="254" r="4"/><circle cx="258" cy="248" r="4"/><circle cx="272" cy="246" r="4"/></g><g stroke="#3D6FB0" stroke-width="1.6" stroke-linecap="round" class="sm-glow"><line x1="222" y1="240" x2="234" y2="240"/><line x1="228" y1="234" x2="228" y2="246"/><line x1="224" y1="236" x2="232" y2="244"/><line x1="232" y1="236" x2="224" y2="244"/></g></g>
</g>
<g data-part="classification" class="dg-label"><circle cx="134.4" cy="30.8" r="3.4"/><text x="134.4" y="22.8" font-size="12" text-anchor="middle">Classification</text></g>
<g data-part="fiveKingdoms" class="dg-label"><circle cx="134.4" cy="84.0" r="3.4"/><text x="134.4" y="76.0" font-size="12" text-anchor="middle">Five Kingdoms</text></g>
<g data-part="vertebrate" class="dg-label"><circle cx="64.0" cy="154.0" r="3.4"/><text x="71.0" y="146.0" font-size="12" text-anchor="start">Vertebrate</text></g>
<g data-part="invertebrate" class="dg-label"><circle cx="64.0" cy="201.6" r="3.4"/><text x="71.0" y="193.6" font-size="12" text-anchor="start">Invertebrate</text></g>
<g data-part="species" class="dg-label"><circle cx="192.0" cy="162.4" r="3.4"/><text x="192.0" y="154.4" font-size="12" text-anchor="middle">Species</text></g>
<g data-part="conservation" class="dg-label"><circle cx="134.4" cy="246.4" r="3.4"/><text x="134.4" y="238.4" font-size="12" text-anchor="middle">Conservation</text></g>
<g data-part="seedVault" class="dg-label"><circle cx="256.0" cy="246.4" r="3.4"/><text x="249.0" y="238.4" font-size="12" text-anchor="end">Seed Vault</text></g>
</svg>
