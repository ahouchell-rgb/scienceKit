<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hazards &amp; uses of radiation">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="250" fill="#ffffff"/>
<line x1="0" y1="212" x2="320" y2="212" stroke="#7a8199" stroke-width="1.5"/>
<g data-part="body">
  <circle cx="205" cy="70" r="16" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M205 86 L205 150 M205 100 L182 128 M205 100 L228 128 M205 150 L190 200 M205 150 L220 200" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
</g>
<g data-part="externalSource">
  <rect x="18" y="86" width="34" height="34" rx="5" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/>
  <circle cx="35" cy="103" r="9" fill="#B4341E"/>
  <circle cx="32" cy="100" r="1.8" fill="#fff"/><circle cx="38" cy="105" r="1.8" fill="#fff"/>
</g>
<g data-part="rays">
  <path class="sm-flow" d="M54 96 L178 88" stroke="#C99528" stroke-width="2.4" fill="none" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#ga5ray)"/>
  <path class="sm-flow" d="M54 105 L178 105" stroke="#C99528" stroke-width="2.4" fill="none" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#ga5ray)"/>
  <path class="sm-flow" d="M54 114 L178 122" stroke="#C99528" stroke-width="2.4" fill="none" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#ga5ray)"/>
</g>
<g data-part="shield">
  <rect x="120" y="60" width="16" height="96" rx="3" fill="#c7ccd6" stroke="#1E2761" stroke-width="3"/>
  <line x1="126" y1="64" x2="126" y2="152" stroke="#7a8199" stroke-width="1.2"/>
  <line x1="131" y1="64" x2="131" y2="152" stroke="#7a8199" stroke-width="1.2"/>
</g>
<g data-part="contaminant">
  <circle cx="216" cy="118" r="7" fill="#B4341E" stroke="#7a1a10" stroke-width="1.5"/>
  <circle cx="214" cy="116" r="1.6" fill="#fff"/><circle cx="219" cy="120" r="1.6" fill="#fff"/>
  <path class="sm-flow" d="M223 114 L246 104" stroke="#B4341E" stroke-width="2" fill="none" stroke-dasharray="4 3" stroke-linecap="round" marker-end="url(#ga5rayR)"/>
  <path class="sm-flow" d="M223 122 L246 132" stroke="#B4341E" stroke-width="2" fill="none" stroke-dasharray="4 3" stroke-linecap="round" marker-end="url(#ga5rayR)"/>
  <path class="sm-flow" d="M224 118 L248 118" stroke="#B4341E" stroke-width="2" fill="none" stroke-dasharray="4 3" stroke-linecap="round" marker-end="url(#ga5rayR)"/>
</g>
<g data-part="backgroundSource">
  <circle cx="285" cy="34" r="10" fill="#C99528"/>
  <path class="sm-flow" d="M280 44 L262 66" stroke="#C99528" stroke-width="1.6" fill="none" stroke-dasharray="3 4" stroke-linecap="round"/>
  <path d="M22 235 q10 -18 26 -12 q14 -10 26 4 q10 -2 12 8 z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <path class="sm-flow" d="M50 222 L64 200" stroke="#2C5F2D" stroke-width="1.6" fill="none" stroke-dasharray="3 4" stroke-linecap="round"/>
  <circle class="sm-drift" cx="270" cy="196" r="4" fill="#7a8199" opacity="0.7"/>
  <circle class="sm-drift" cx="288" cy="204" r="3.5" fill="#7a8199" opacity="0.6"/>
  <circle class="sm-drift" cx="256" cy="205" r="3" fill="#7a8199" opacity="0.6"/>
</g>
<defs>
  <marker id="ga5ray" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#C99528"/></marker>
  <marker id="ga5rayR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#B4341E"/></marker>
</defs>

</g>
<g data-part="externalSource" class="dg-label"><circle cx="60.8" cy="150.0" r="3.4"/><text x="67.8" y="142.0" font-size="12" text-anchor="start">External source</text></g>
<g data-part="rays" class="dg-label"><circle cx="121.6" cy="125.0" r="3.4"/><text x="121.6" y="117.0" font-size="12" text-anchor="middle">Radiation rays</text></g>
<g data-part="contaminant" class="dg-label"><circle cx="172.8" cy="95.0" r="3.4"/><text x="172.8" y="87.0" font-size="12" text-anchor="middle">Contaminant on body</text></g>
<g data-part="body" class="dg-label"><circle cx="195.2" cy="170.0" r="3.4"/><text x="195.2" y="162.0" font-size="12" text-anchor="middle">Exposed body</text></g>
<g data-part="shield" class="dg-label"><circle cx="288.0" cy="177.5" r="3.4"/><text x="281.0" y="169.5" font-size="12" text-anchor="end">Shield (precaution)</text></g>
<g data-part="backgroundSource" class="dg-label"><circle cx="41.6" cy="40.0" r="3.4"/><text x="48.6" y="32.0" font-size="12" text-anchor="start">Background source</text></g>
</svg>
