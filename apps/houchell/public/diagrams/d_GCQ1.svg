<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Conservation of mass &amp; Mr">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="300" fill="#F4F6FC"/>
<!-- BALANCE BEAM: central stand + level beam + fulcrum -->
<g data-part="balanceBeam">
  <!-- stand -->
  <rect x="152" y="80" width="16" height="150" rx="4" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.5"/>
  <!-- base -->
  <rect x="110" y="228" width="100" height="16" rx="5" fill="#1E2761"/>
  <!-- beam (level) -->
  <line x1="52" y1="84" x2="268" y2="84" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/>
  <!-- pointer / fulcrum -->
  <polygon points="160,66 151,84 169,84" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
</g>
<!-- REACTANTS pan (left) -->
<g data-part="reactantsPan">
  <line x1="60" y1="84" x2="60" y2="118" stroke="#1E2761" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M28 118 h64 l-14 30 h-36 z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.6" stroke-linejoin="round"/>
</g>
<!-- PRODUCTS pan (right) -->
<g data-part="productsPan">
  <line x1="260" y1="84" x2="260" y2="118" stroke="#1E2761" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M228 118 h64 l-14 30 h-36 z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.6" stroke-linejoin="round"/>
</g>
<!-- ATOMS: same atoms on both pans (2 red + 1 green each) -->
<g data-part="atoms">
  <!-- left -->
  <circle cx="46" cy="128" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  <circle cx="62" cy="128" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  <circle cx="54" cy="140" r="7" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <!-- right (rearranged but same count) -->
  <circle cx="246" cy="128" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  <circle cx="270" cy="128" r="7" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/>
  <circle cx="258" cy="140" r="7" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <!-- equals sign in middle to stress same atoms -->
  <line x1="150" y1="132" x2="170" y2="132" stroke="#7a8199" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="150" y1="142" x2="170" y2="142" stroke="#7a8199" stroke-width="2.4" stroke-linecap="round"/>
</g>
<!-- ESCAPING GAS: bubbles rising & drifting off (mass falls) - lower left -->
<g data-part="escapingGas">
  <g class="sm-rise">
    <circle cx="70" cy="200" r="4" fill="none" stroke="#7a8199" stroke-width="2"/>
    <circle cx="80" cy="184" r="3" fill="none" stroke="#7a8199" stroke-width="2"/>
    <circle cx="90" cy="170" r="2.5" fill="none" stroke="#7a8199" stroke-width="2"/>
  </g>
  <!-- down arrow = mass falls -->
  <line x1="50" y1="196" x2="50" y2="222" stroke="#B4341E" stroke-width="3" stroke-linecap="round"/>
  <polyline points="44,214 50,224 56,214" fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- INCOMING GAS: gas from air joining (mass rises) - lower right -->
<g data-part="incomingGas">
  <g class="sm-fall">
    <circle cx="250" cy="170" r="2.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.8"/>
    <circle cx="240" cy="184" r="3" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.8"/>
    <circle cx="230" cy="200" r="4" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.8"/>
  </g>
  <!-- up arrow = mass rises -->
  <line x1="272" y1="222" x2="272" y2="196" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="266,204 272,194 278,204" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
<g data-part="balanceBeam" class="dg-label"><circle cx="160.0" cy="33.6" r="3.4"/><text x="160.0" y="25.6" font-size="12" text-anchor="middle">Balance beam</text></g>
<g data-part="reactantsPan" class="dg-label"><circle cx="57.6" cy="91.2" r="3.4"/><text x="64.6" y="83.2" font-size="12" text-anchor="start">Reactants</text></g>
<g data-part="productsPan" class="dg-label"><circle cx="262.4" cy="91.2" r="3.4"/><text x="255.4" y="83.2" font-size="12" text-anchor="end">Products</text></g>
<g data-part="atoms" class="dg-label"><circle cx="160.0" cy="74.4" r="3.4"/><text x="160.0" y="66.4" font-size="12" text-anchor="middle">Atoms (same on both sides)</text></g>
<g data-part="escapingGas" class="dg-label"><circle cx="115.2" cy="57.6" r="3.4"/><text x="115.2" y="49.6" font-size="12" text-anchor="middle">Gas escaping (mass falls)</text></g>
<g data-part="incomingGas" class="dg-label"><circle cx="211.2" cy="52.8" r="3.4"/><text x="211.2" y="44.8" font-size="12" text-anchor="middle">Gas taken in (mass rises)</text></g>
</svg>
