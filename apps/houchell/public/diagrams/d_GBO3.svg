<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Plant tissues &amp; transport">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x='0' y='0' width='320' height='300' fill='#ffffff'/><rect x='0' y='200' width='320' height='100' fill='#E8D9C0'/><g data-part='leaf'><path d='M96 70 q-56 -6 -70 30 q40 22 70 4 q30 18 70 -4 q-14 -36 -70 -30 z' fill='#CDE5C6' stroke='#2C5F2D' stroke-width='2.5' stroke-linejoin='round'/><path d='M96 74 v26' stroke='#2C5F2D' stroke-width='2' fill='none'/><path d='M96 82 l-22 8 M96 88 l22 8 M96 90 l-18 12' stroke='#2C5F2D' stroke-width='1.2' fill='none'/></g><g data-part='stem'><rect x='150' y='96' width='16' height='108' fill='#CDE5C6' stroke='#2C5F2D' stroke-width='2.5'/></g><g data-part='root'><path d='M150 204 q-10 20 -30 34 q-6 4 -12 2 M158 204 q0 28 4 50 M162 204 q10 22 32 34 q6 4 10 0' fill='none' stroke='#8a6a3a' stroke-width='3' stroke-linecap='round'/></g><g data-part='xylem'><line class='sm-flow' x1='153' y1='202' x2='153' y2='100' stroke='#1E5A9E' stroke-width='3.5' stroke-dasharray='7 6'/><polygon points='149,104 153,92 157,104' fill='#1E5A9E'/></g><g data-part='phloem'><line class='sm-flow' x1='163' y1='100' x2='163' y2='202' stroke='#2C5F2D' stroke-width='3.5' stroke-dasharray='7 6'/><polygon points='159,198 163,210 167,198' fill='#2C5F2D'/></g><g data-part='stomata'><ellipse cx='150' cy='104' rx='11' ry='6' fill='#DCEAF6' stroke='#2C5F2D' stroke-width='2.5'/><ellipse cx='150' cy='104' rx='4' ry='5' fill='#ffffff' stroke='#2C5F2D' stroke-width='1.5'/><circle class='sm-rise' cx='150' cy='96' r='3' fill='#DCEAF6' stroke='#1E5A9E' stroke-width='1.5'/><circle class='sm-rise' cx='158' cy='90' r='2.5' fill='#DCEAF6' stroke='#1E5A9E' stroke-width='1.5'/></g><g data-part='transpirationStream'><path class='sm-flow' d='M204 180 q10 -50 -6 -110' fill='none' stroke='#1E5A9E' stroke-width='2.5' stroke-dasharray='5 6'/><polygon points='194,74 197,62 202,72' fill='#1E5A9E'/><circle cx='210' cy='150' r='2.5' fill='#1E5A9E'/><circle cx='206' cy='120' r='2.5' fill='#1E5A9E'/></g>
</g>
<g data-part="leaf" class="dg-label"><circle cx="57.6" cy="45.0" r="3.4"/><text x="64.6" y="37.0" font-size="12" text-anchor="start">Leaf</text></g>
<g data-part="stem" class="dg-label"><circle cx="134.4" cy="144.0" r="3.4"/><text x="134.4" y="136.0" font-size="12" text-anchor="middle">Stem</text></g>
<g data-part="root" class="dg-label"><circle cx="86.4" cy="276.0" r="3.4"/><text x="86.4" y="268.0" font-size="12" text-anchor="middle">Roots</text></g>
<g data-part="xylem" class="dg-label"><circle cx="80.0" cy="126.0" r="3.4"/><text x="80.0" y="118.0" font-size="12" text-anchor="middle">Xylem</text></g>
<g data-part="phloem" class="dg-label"><circle cx="176.0" cy="174.0" r="3.4"/><text x="176.0" y="166.0" font-size="12" text-anchor="middle">Phloem</text></g>
<g data-part="stomata" class="dg-label"><circle cx="86.4" cy="81.0" r="3.4"/><text x="86.4" y="73.0" font-size="12" text-anchor="middle">Stomata</text></g>
<g data-part="transpirationStream" class="dg-label"><circle cx="153.6" cy="60.0" r="3.4"/><text x="153.6" y="52.0" font-size="12" text-anchor="middle">Transpiration stream</text></g>
</svg>
