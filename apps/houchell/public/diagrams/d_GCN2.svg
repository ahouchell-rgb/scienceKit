<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tests for gases">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="220" fill="#fff"/><g stroke="#1E2761" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 70 v104 a16 16 0 0 0 16 16 a16 16 0 0 0 16 -16 v-104 z" fill="#DCEAF6"/><path d="M22 70 h32" fill="none"/><path d="M100 70 v104 a16 16 0 0 0 16 16 a16 16 0 0 0 16 -16 v-104 z" fill="#DCEAF6"/><path d="M100 70 h32" fill="none"/><path d="M188 70 v104 a16 16 0 0 0 16 16 a16 16 0 0 0 16 -16 v-104 z" fill="#DCEAF6"/><path d="M188 70 h32" fill="none"/><path d="M266 70 v104 a16 16 0 0 0 16 16 a16 16 0 0 0 16 -16 v-104 z" fill="#DCEAF6"/><path d="M266 70 h32" fill="none"/></g><g data-part="splint"><rect x="34" y="18" width="6" height="44" rx="3" fill="#C99528" stroke="#1E2761" stroke-width="2"/></g><g data-part="hydrogenTest"><path class="sm-throb" d="M37 8 q10 12 4 24 q-2 6 -8 6 q-10 -2 -8 -14 q1 -8 6 -10 q-2 8 4 8 q4 -10 6 -14 z" fill="#B4341E" stroke="#B4341E" stroke-width="1.5"/><path d="M60 40 l10 -6 M64 54 l11 -3 M60 68 l10 -1" stroke="#C99528" stroke-width="2" stroke-linecap="round"/></g><g data-part="oxygenTest"><rect x="112" y="18" width="6" height="40" rx="3" fill="#C99528" stroke="#1E2761" stroke-width="2"/><path class="sm-glow" d="M115 10 q7 9 3 18 q-2 5 -6 5 q-7 -1 -5 -10 q1 -6 4 -8 q-1 6 3 6 q2 -7 4 -11 z" fill="#B4341E" stroke="#B4341E" stroke-width="1.2"/><circle class="sm-rise" cx="108" cy="86" r="3" fill="#F1D2D8" stroke="#B4341E" stroke-width="1.6"/><circle class="sm-rise" cx="124" cy="104" r="3" fill="#F1D2D8" stroke="#B4341E" stroke-width="1.6"/></g><g data-part="limewater"><path d="M190 118 v56 a14 14 0 0 0 14 14 a14 14 0 0 0 14 -14 v-56 z" fill="#E8E4D6" stroke="#1E2761" stroke-width="2.2"/><circle class="sm-rise" cx="200" cy="150" r="3" fill="#fff" stroke="#7a8199" stroke-width="1.4"/><circle class="sm-rise" cx="210" cy="164" r="2.6" fill="#fff" stroke="#7a8199" stroke-width="1.4"/><circle class="sm-rise" cx="204" cy="176" r="3" fill="#fff" stroke="#7a8199" stroke-width="1.4"/><path d="M204 118 v-40" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/><polygon points="204,116 200,106 208,106" fill="#7a8199"/></g><g data-part="litmusPaper"><rect x="272" y="86" width="20" height="40" rx="2" fill="#fff" stroke="#1E2761" stroke-width="2"/><rect x="272" y="86" width="20" height="14" rx="2" fill="#2C5F2D" opacity="0.5"/><path class="sm-fall" d="M282 76 v8" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/><path d="M296 96 l8 -3 M296 110 l8 0" stroke="#C99528" stroke-width="1.8" stroke-linecap="round"/></g>
</g>
<g data-part="hydrogenTest" class="dg-label"><circle cx="32.0" cy="66.0" r="3.4"/><text x="39.0" y="58.0" font-size="12" text-anchor="start">Hydrogen: squeaky pop</text></g>
<g data-part="oxygenTest" class="dg-label"><circle cx="115.2" cy="26.4" r="3.4"/><text x="115.2" y="18.4" font-size="12" text-anchor="middle">Oxygen: relights splint</text></g>
<g data-part="limewater" class="dg-label"><circle cx="192.0" cy="118.8" r="3.4"/><text x="192.0" y="110.8" font-size="12" text-anchor="middle">Limewater turns milky</text></g>
<g data-part="litmusPaper" class="dg-label"><circle cx="272.0" cy="26.4" r="3.4"/><text x="265.0" y="18.4" font-size="12" text-anchor="end">Chlorine: bleaches litmus</text></g>
<g data-part="splint" class="dg-label"><circle cx="70.4" cy="8.8" r="3.4"/><text x="70.4" y="28.8" font-size="12" text-anchor="middle">Splint</text></g>
</svg>
