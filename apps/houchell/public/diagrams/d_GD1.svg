<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Density">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#ffffff"/>
<defs>
  <marker id="d1arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1E2761"/></marker>
  <marker id="d1arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B4341E"/></marker>
</defs>
<g data-part="cylinder">
  <path d="M40,44 L40,208 Q40,220 52,220 L76,220 Q88,220 88,208 L88,44" fill="#ffffff" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40,44 L34,38" stroke="#1E2761" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <g stroke="#1E2761" stroke-width="1.2">
    <line x1="40" y1="70" x2="52" y2="70"/><line x1="40" y1="94" x2="52" y2="94"/>
    <line x1="40" y1="118" x2="52" y2="118"/><line x1="40" y1="142" x2="52" y2="142"/>
    <line x1="40" y1="166" x2="52" y2="166"/><line x1="40" y1="190" x2="52" y2="190"/>
  </g>
  <text x="94" y="73" font-family="sans-serif" font-size="8" fill="#1E2761">cm&#179;</text>
</g>
<g data-part="water">
  <path d="M42,150 L86,150 L86,206 Q86,218 74,218 L54,218 Q42,218 42,206 Z" fill="#DCEAF6"/>
  <line x1="42" y1="150" x2="86" y2="150" stroke="#1E2761" stroke-width="1.5" stroke-dasharray="4 3"/>
</g>
<g data-part="irregularSolid">
  <path d="M56,168 L72,162 L82,176 L74,190 L58,188 L52,178 Z" fill="#7a8199" stroke="#1E2761" stroke-width="1.5" class="sm-fall"/>
</g>
<g data-part="displacedLevel">
  <line x1="40" y1="128" x2="94" y2="128" stroke="#B4341E" stroke-width="2"/>
  <path d="M100,150 L100,130" stroke="#B4341E" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#d1arrR)" class="sm-rise"/>
  <text x="104" y="144" font-family="sans-serif" font-size="8" fill="#B4341E">rise</text>
</g>
<g data-part="balance">
  <rect x="196" y="40" width="108" height="46" rx="6" fill="#F4F6FC" stroke="#1E2761" stroke-width="2"/>
  <rect x="222" y="30" width="56" height="12" rx="3" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.5"/>
  <rect x="240" y="18" width="20" height="14" rx="2" fill="#7a8199" stroke="#1E2761" stroke-width="1.5"/>
  <rect x="212" y="54" width="76" height="20" rx="3" fill="#1E2761"/>
  <text x="250" y="69" font-family="monospace" font-size="12" font-weight="bold" fill="#C99528" text-anchor="middle">48 g</text>
</g>
<g data-part="regularSolid">
  <path d="M200,120 L240,120 L240,152 L200,152 Z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <path d="M200,120 L212,110 L252,110 L240,120 Z" fill="#B6D9AE" stroke="#2C5F2D" stroke-width="2"/>
  <path d="M240,120 L252,110 L252,142 L240,152 Z" fill="#A4CE9B" stroke="#2C5F2D" stroke-width="2"/>
  <rect x="196" y="158" width="44" height="8" fill="#C99528" stroke="#8a6a1a" stroke-width="1"/>
  <g stroke="#8a6a1a" stroke-width="0.8">
    <line x1="204" y1="158" x2="204" y2="163"/><line x1="212" y1="158" x2="212" y2="163"/><line x1="220" y1="158" x2="220" y2="163"/><line x1="228" y1="158" x2="228" y2="163"/><line x1="236" y1="158" x2="236" y2="163"/>
  </g>
  <text x="258" y="140" font-family="sans-serif" font-size="8" fill="#2C5F2D">l&#215;w&#215;h</text>
</g>
<g data-part="floatingObject">
  <path d="M196,196 L196,236 Q196,244 204,244 L292,244 Q300,244 300,236 L300,196" fill="#ffffff" stroke="#1E2761" stroke-width="2" stroke-linecap="round"/>
  <path d="M198,210 L298,210 L298,234 Q298,242 290,242 L206,242 Q198,242 198,234 Z" fill="#DCEAF6"/>
  <line x1="198" y1="210" x2="298" y2="210" stroke="#1E2761" stroke-width="1.2" opacity="0.5"/>
  <g class="sm-osc">
    <rect x="234" y="200" width="30" height="18" rx="2" fill="#C99528" stroke="#8a6a1a" stroke-width="1.5"/>
  </g>
</g>
</g>
<g data-part="cylinder" class="dg-label"><circle cx="73.6" cy="85.0" r="3.4"/><text x="73.6" y="77.0" font-size="12" text-anchor="middle">Measuring cylinder</text></g>
<g data-part="water" class="dg-label"><circle cx="48.0" cy="205.0" r="3.4"/><text x="55.0" y="197.0" font-size="12" text-anchor="start">Water</text></g>
<g data-part="irregularSolid" class="dg-label"><circle cx="92.8" cy="160.0" r="3.4"/><text x="92.8" y="152.0" font-size="12" text-anchor="middle">Irregular solid</text></g>
<g data-part="displacedLevel" class="dg-label"><circle cx="48.0" cy="120.0" r="3.4"/><text x="55.0" y="112.0" font-size="12" text-anchor="start">Displaced level</text></g>
<g data-part="balance" class="dg-label"><circle cx="272.0" cy="47.5" r="3.4"/><text x="265.0" y="39.5" font-size="12" text-anchor="end">Balance</text></g>
<g data-part="regularSolid" class="dg-label"><circle cx="256.0" cy="100.0" r="3.4"/><text x="249.0" y="92.0" font-size="12" text-anchor="end">Regular solid</text></g>
<g data-part="floatingObject" class="dg-label"><circle cx="224.0" cy="187.5" r="3.4"/><text x="224.0" y="179.5" font-size="12" text-anchor="middle">Floating object</text></g>
</svg>
