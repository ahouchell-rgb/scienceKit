<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Exothermic &amp; endothermic reactions">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" fill="#fff"/><line x1="26" y1="24" x2="26" y2="210" stroke="#1E2761" stroke-width="2.2" stroke-linecap="round"/><line x1="26" y1="210" x2="150" y2="210" stroke="#1E2761" stroke-width="2.2" stroke-linecap="round"/><line x1="180" y1="24" x2="180" y2="210" stroke="#1E2761" stroke-width="2.2" stroke-linecap="round"/><line x1="180" y1="210" x2="304" y2="210" stroke="#1E2761" stroke-width="2.2" stroke-linecap="round"/><path d="M34 96 H60 C86 96 82 48 106 48 C130 48 128 160 150 160" fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-part="reactants"><line x1="34" y1="96" x2="62" y2="96" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/></g><g data-part="activation"><line x1="106" y1="42" x2="106" y2="96" stroke="#C99528" stroke-width="2" stroke-dasharray="4 4"/><circle cx="106" cy="48" r="6" fill="#F7ECCB" stroke="#C99528" stroke-width="2.5"/></g><g data-part="products"><line x1="122" y1="160" x2="150" y2="160" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/></g><g data-part="energyOut"><line class="sm-fall" x1="70" y1="104" x2="70" y2="152" stroke="#B4341E" stroke-width="3" stroke-linecap="round"/><polygon points="70,158 64,146 76,146" fill="#B4341E"/></g><path d="M188 160 H214 C240 160 236 66 260 66 C284 66 282 96 304 96" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="188" y1="160" x2="216" y2="160" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/><g data-part="endoCurve"><line x1="276" y1="96" x2="304" y2="96" stroke="#1E2761" stroke-width="4" stroke-linecap="round"/></g><g data-part="energyIn"><line class="sm-rise" x1="230" y1="152" x2="230" y2="104" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/><polygon points="230,98 224,110 236,110" fill="#2C5F2D"/></g>
</g>
<g data-part="reactants" class="dg-label"><circle cx="48.0" cy="79.2" r="3.4"/><text x="55.0" y="71.2" font-size="12" text-anchor="start">Reactants</text></g>
<g data-part="activation" class="dg-label"><circle cx="99.2" cy="43.2" r="3.4"/><text x="99.2" y="35.2" font-size="12" text-anchor="middle">Activation energy</text></g>
<g data-part="products" class="dg-label"><circle cx="128.0" cy="151.2" r="3.4"/><text x="128.0" y="143.2" font-size="12" text-anchor="middle">Products</text></g>
<g data-part="energyOut" class="dg-label"><circle cx="134.4" cy="105.6" r="3.4"/><text x="134.4" y="97.6" font-size="12" text-anchor="middle">Energy released</text></g>
<g data-part="endoCurve" class="dg-label"><circle cx="233.6" cy="96.0" r="3.4"/><text x="233.6" y="88.0" font-size="12" text-anchor="middle">Endothermic profile</text></g>
<g data-part="energyIn" class="dg-label"><circle cx="294.4" cy="129.6" r="3.4"/><text x="287.4" y="121.6" font-size="12" text-anchor="end">Energy taken in</text></g>
</svg>
