<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Resources &amp; potable water">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="2" y="2" width="316" height="226" rx="12" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/>
<g stroke="#7a8199" stroke-width="3" fill="#7a8199" stroke-linecap="round">
  <line x1="72" y1="52" x2="96" y2="52"/><polygon points="96,46 108,52 96,58"/>
  <line x1="172" y1="52" x2="196" y2="52"/><polygon points="196,46 208,52 196,58"/>
</g>
<g data-part="sourceWater">
  <path d="M22 40 L70 40 L64 78 L28 78 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 58 q10 -6 18 0 t14 0" fill="none" stroke="#1E2761" stroke-width="1.6" opacity="0.6"/>
  <circle cx="38" cy="68" r="1.8" fill="#8A6A52"/><circle cx="50" cy="72" r="1.8" fill="#8A6A52"/>
</g>
<g data-part="filterBed">
  <rect x="112" y="34" width="52" height="50" rx="4" fill="#EFE6D2" stroke="#1E2761" stroke-width="2.5"/>
  <rect x="112" y="34" width="52" height="14" rx="4" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <g fill="#8A6A52"><circle cx="122" cy="60" r="2.4"/><circle cx="134" cy="66" r="2.4"/><circle cx="148" cy="58" r="2.4"/><circle cx="156" cy="70" r="2.4"/><circle cx="128" cy="74" r="2.4"/><circle cx="144" cy="76" r="2.4"/></g>
  <g class="sm-fall" stroke="#1E2761" stroke-width="2" stroke-linecap="round"><line x1="138" y1="86" x2="138" y2="96"/></g>
</g>
<g data-part="steriliser">
  <rect x="212" y="34" width="52" height="50" rx="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/>
  <g class="sm-glow" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M226 74 L226 52 a12 12 0 0 1 24 0 L250 74"/>
  </g>
  <g class="sm-blink" stroke="#C99528" stroke-width="2" stroke-linecap="round">
    <line x1="238" y1="46" x2="238" y2="70"/><line x1="232" y1="52" x2="244" y2="64"/><line x1="244" y1="52" x2="232" y2="64"/>
  </g>
</g>
<g data-part="potableTap">
  <path d="M282 40 L282 60 L296 60" fill="none" stroke="#7a8199" stroke-width="4" stroke-linecap="round"/>
  <rect x="278" y="34" width="8" height="10" rx="2" fill="#7a8199"/>
  <g class="sm-fall" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.5">
    <circle cx="298" cy="72" r="3"/><circle cx="298" cy="82" r="3"/>
  </g>
  <path d="M286 96 h26 v10 a4 4 0 0 1 -4 4 h-18 a4 4 0 0 1 -4 -4 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2"/>
</g>
<line x1="14" y1="120" x2="306" y2="120" stroke="#AEB6D6" stroke-width="1.5" stroke-dasharray="5 5"/>
<g data-part="desalUnit">
  <path d="M24 140 L72 140 L72 176 L24 176 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M24 158 q9 -5 16 0 t16 0 t16 0" fill="none" stroke="#1E2761" stroke-width="1.6" opacity="0.6"/>
  <text x="48" y="192" font-family="sans-serif" font-size="11" fill="#1E2761" text-anchor="middle" font-weight="700">NaCl</text>
  <g class="sm-throb" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round">
    <line x1="42" y1="128" x2="54" y2="128"/><line x1="48" y1="122" x2="48" y2="134"/>
  </g>
</g>
<g data-part="reverseOsmosis">
  <rect x="120" y="138" width="80" height="42" rx="6" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="160" y1="138" x2="160" y2="180" stroke="#2C5F2D" stroke-width="3" stroke-dasharray="3 3"/>
  <g class="sm-flow" stroke="#B4341E" stroke-width="2.5" fill="#B4341E" stroke-linecap="round">
    <line x1="128" y1="159" x2="152" y2="159" stroke-dasharray="5 4"/>
  </g>
  <g class="sm-flow" stroke="#2C5F2D" stroke-width="2.5" fill="#2C5F2D" stroke-linecap="round">
    <line x1="168" y1="159" x2="194" y2="159" stroke-dasharray="5 4"/><polygon points="194,159 186,155 186,163"/>
  </g>
  <text x="140" y="200" font-family="sans-serif" font-size="9" fill="#B4341E" text-anchor="middle">high P</text>
  <text x="180" y="200" font-family="sans-serif" font-size="9" fill="#2C5F2D" text-anchor="middle">pure</text>
</g>
<g data-part="settlingTank">
  <path d="M228 138 L300 138 L288 190 L240 190 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M244 178 L284 178 L280 190 L248 190 Z" fill="#8A6A52" stroke="#5c4632" stroke-width="1.5"/>
  <g class="sm-fall" fill="#8A6A52"><circle cx="258" cy="160" r="2.4"/><circle cx="272" cy="166" r="2.4"/><circle cx="264" cy="152" r="2.4"/></g>
  <path d="M236 150 q14 -4 28 0 t28 0" fill="none" stroke="#1E2761" stroke-width="1.6" opacity="0.5"/>
</g>
</g>
<g data-part="sourceWater" class="dg-label"><circle cx="44.8" cy="55.2" r="3.4"/><text x="51.8" y="47.2" font-size="12" text-anchor="start">Fresh water source</text></g>
<g data-part="filterBed" class="dg-label"><circle cx="137.6" cy="55.2" r="3.4"/><text x="137.6" y="47.2" font-size="12" text-anchor="middle">Filtration</text></g>
<g data-part="steriliser" class="dg-label"><circle cx="233.6" cy="55.2" r="3.4"/><text x="233.6" y="47.2" font-size="12" text-anchor="middle">Sterilising</text></g>
<g data-part="potableTap" class="dg-label"><circle cx="294.4" cy="69.0" r="3.4"/><text x="287.4" y="61.0" font-size="12" text-anchor="end">Potable water</text></g>
<g data-part="desalUnit" class="dg-label"><circle cx="51.2" cy="144.9" r="3.4"/><text x="58.2" y="136.9" font-size="12" text-anchor="start">Desalination</text></g>
<g data-part="settlingTank" class="dg-label"><circle cx="182.4" cy="147.2" r="3.4"/><text x="182.4" y="139.2" font-size="12" text-anchor="middle">Sedimentation tank</text></g>
<g data-part="reverseOsmosis" class="dg-label"><circle cx="284.8" cy="144.9" r="3.4"/><text x="277.8" y="136.9" font-size="12" text-anchor="end">Reverse osmosis</text></g>
</svg>
