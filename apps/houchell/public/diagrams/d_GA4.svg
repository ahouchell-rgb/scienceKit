<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Nuclear equations &amp; half-life">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="260" fill="#ffffff"/>
<g data-part="parentNucleus">
  <circle class="sm-throb" cx="60" cy="60" r="26" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/>
  <g transform="translate(60,60)">
    <circle cx="-9" cy="-7" r="5" fill="#B4341E"/><circle cx="4" cy="-9" r="5" fill="#B4341E"/><circle cx="11" cy="2" r="5" fill="#B4341E"/><circle cx="-2" cy="9" r="5" fill="#B4341E"/>
    <circle cx="-10" cy="5" r="5" fill="#8f9099"/><circle cx="8" cy="-1" r="5" fill="#8f9099"/><circle cx="0" cy="-1" r="5" fill="#8f9099"/><circle cx="-3" cy="-8" r="5" fill="#8f9099"/>
  </g>
</g>
<g data-part="alphaParticle">
  <path class="sm-flow" d="M84 46 L138 26" stroke="#B4341E" stroke-width="2.6" fill="none" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ga4arrowR)"/>
  <g transform="translate(150,22)">
    <circle cx="-5" cy="-4" r="4.5" fill="#B4341E"/><circle cx="5" cy="-4" r="4.5" fill="#B4341E"/>
    <circle cx="-5" cy="5" r="4.5" fill="#8f9099"/><circle cx="5" cy="5" r="4.5" fill="#8f9099"/>
  </g>
  <text x="150" y="42" font-family="Arial" font-size="8" fill="#B4341E" text-anchor="middle" font-weight="bold">-4 mass, -2 Z</text>
</g>
<g data-part="betaParticle">
  <path class="sm-flow" d="M82 76 L140 98" stroke="#2C5F2D" stroke-width="2.6" fill="none" stroke-dasharray="4 4" stroke-linecap="round" marker-end="url(#ga4arrowG)"/>
  <circle cx="150" cy="101" r="6" fill="#2C5F2D"/>
  <text x="150" y="104" font-family="Arial" font-size="7.5" fill="#fff" text-anchor="middle" font-weight="bold">e</text>
  <text x="150" y="120" font-family="Arial" font-size="8" fill="#2C5F2D" text-anchor="middle" font-weight="bold">+1 Z</text>
</g>
<line x1="40" y1="240" x2="308" y2="240" stroke="#1E2761" stroke-width="2.5"/>
<line x1="40" y1="240" x2="40" y2="150" stroke="#1E2761" stroke-width="2.5"/>
<text x="26" y="158" font-family="Arial" font-size="8" fill="#1E2761" text-anchor="middle">A</text>
<text x="304" y="252" font-family="Arial" font-size="8" fill="#1E2761" text-anchor="middle">t</text>
<line x1="40" y1="163" x2="300" y2="163" stroke="#DCEAF6" stroke-width="1"/>
<g data-part="decayCurve">
  <path d="M40 163 C 90 163, 110 201, 130 201 C 170 201, 180 221, 220 221 C 250 221, 260 231, 300 231.5" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
</g>
<g data-part="oneHalfLife">
  <line x1="130" y1="240" x2="130" y2="201.5" stroke="#C99528" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="40" y1="201.5" x2="130" y2="201.5" stroke="#C99528" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="130" cy="201.5" r="4.5" fill="#C99528"/>
  <text x="130" y="252" font-family="Arial" font-size="8" fill="#C99528" text-anchor="middle" font-weight="bold">1 t&#189;</text>
</g>
<g data-part="twoHalfLives">
  <line x1="220" y1="240" x2="220" y2="220.75" stroke="#2C5F2D" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="40" y1="220.75" x2="220" y2="220.75" stroke="#2C5F2D" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="220" cy="220.75" r="4.5" fill="#2C5F2D"/>
  <text x="220" y="252" font-family="Arial" font-size="8" fill="#2C5F2D" text-anchor="middle" font-weight="bold">2 t&#189;</text>
</g>
<defs>
  <marker id="ga4arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#B4341E"/></marker>
  <marker id="ga4arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2C5F2D"/></marker>
</defs>

</g>
<g data-part="parentNucleus" class="dg-label"><circle cx="76.8" cy="70.2" r="3.4"/><text x="76.8" y="62.2" font-size="12" text-anchor="middle">Parent nucleus</text></g>
<g data-part="alphaParticle" class="dg-label"><circle cx="169.6" cy="31.2" r="3.4"/><text x="169.6" y="23.2" font-size="12" text-anchor="middle">Alpha particle</text></g>
<g data-part="betaParticle" class="dg-label"><circle cx="166.4" cy="111.8" r="3.4"/><text x="166.4" y="103.8" font-size="12" text-anchor="middle">Beta particle (electron)</text></g>
<g data-part="decayCurve" class="dg-label"><circle cx="256.0" cy="158.6" r="3.4"/><text x="249.0" y="150.6" font-size="12" text-anchor="end">Activity curve</text></g>
<g data-part="oneHalfLife" class="dg-label"><circle cx="108.8" cy="195.0" r="3.4"/><text x="108.8" y="187.0" font-size="12" text-anchor="middle">After 1 half-life</text></g>
<g data-part="twoHalfLives" class="dg-label"><circle cx="176.0" cy="218.4" r="3.4"/><text x="176.0" y="210.4" font-size="12" text-anchor="middle">After 2 half-lives</text></g>
</svg>
