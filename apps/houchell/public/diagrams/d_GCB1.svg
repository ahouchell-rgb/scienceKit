<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ionic, covalent &amp; metallic bonding">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" fill="#ffffff"/>
<defs>
  <marker id="b1arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B4341E"/></marker>
</defs>
<g data-part="ionicPanel">
  <rect x="8" y="40" width="98" height="176" rx="8" fill="#F1D2D8" stroke="#1E2761" stroke-width="1.5"/>
</g>
<g data-part="positiveIon">
  <circle cx="36" cy="98" r="20" fill="#DCEAF6" stroke="#1E2761" stroke-width="2"/>
  <text x="36" y="102" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">+</text>
  <circle cx="60" cy="90" r="4" fill="#B4341E" class="sm-drift"/>
  <path d="M50,92 L72,88" stroke="#B4341E" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#b1arrow)"/>
</g>
<circle cx="84" cy="170" r="20" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
<text x="84" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2C5F2D" text-anchor="middle">&#8722;</text>
<path d="M48,112 L72,152" stroke="#1E2761" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
<g data-part="covalentPanel">
  <rect x="112" y="40" width="98" height="176" rx="8" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.5"/>
</g>
<circle cx="142" cy="128" r="26" fill="#ffffff" stroke="#1E2761" stroke-width="2"/>
<circle cx="180" cy="128" r="26" fill="#ffffff" stroke="#1E2761" stroke-width="2"/>
<g data-part="sharedPair">
  <circle cx="156" cy="128" r="4.5" fill="#B4341E" class="sm-throb"/>
  <circle cx="166" cy="128" r="4.5" fill="#B4341E" class="sm-throb"/>
  <circle cx="142" cy="128" r="3" fill="#1E2761"/>
  <circle cx="180" cy="128" r="3" fill="#1E2761"/>
</g>
<g data-part="metalIon">
  <rect x="216" y="40" width="96" height="176" rx="8" fill="#F4F6FC" stroke="#1E2761" stroke-width="1.5"/>
  <g fill="#DCEAF6" stroke="#1E2761" stroke-width="1.5">
    <circle cx="238" cy="70" r="9"/><circle cx="266" cy="70" r="9"/><circle cx="294" cy="70" r="9"/>
    <circle cx="238" cy="108" r="9"/><circle cx="266" cy="108" r="9"/><circle cx="294" cy="108" r="9"/>
    <circle cx="238" cy="146" r="9"/><circle cx="266" cy="146" r="9"/><circle cx="294" cy="146" r="9"/>
    <circle cx="238" cy="184" r="9"/><circle cx="266" cy="184" r="9"/><circle cx="294" cy="184" r="9"/>
  </g>
  <g font-family="sans-serif" font-size="8" font-weight="bold" fill="#1E2761" text-anchor="middle">
    <text x="238" y="73">+</text><text x="266" y="73">+</text><text x="294" y="73">+</text>
    <text x="238" y="111">+</text><text x="266" y="111">+</text><text x="294" y="111">+</text>
    <text x="238" y="149">+</text><text x="266" y="149">+</text><text x="294" y="149">+</text>
    <text x="238" y="187">+</text><text x="266" y="187">+</text><text x="294" y="187">+</text>
  </g>
</g>
<g data-part="electronSea">
  <g fill="#B4341E" class="sm-drift">
    <circle cx="252" cy="89" r="3"/><circle cx="280" cy="89" r="3"/>
    <circle cx="224" cy="127" r="3"/><circle cx="252" cy="127" r="3"/><circle cx="280" cy="127" r="3"/>
    <circle cx="252" cy="165" r="3"/><circle cx="280" cy="165" r="3"/>
    <circle cx="224" cy="89" r="3"/><circle cx="306" cy="127" r="3"/>
  </g>
</g>
</g>
<g data-part="ionicPanel" class="dg-label"><circle cx="64.0" cy="96.0" r="3.4"/><text x="71.0" y="88.0" font-size="12" text-anchor="start">Ionic bond</text></g>
<g data-part="covalentPanel" class="dg-label"><circle cx="163.2" cy="96.0" r="3.4"/><text x="163.2" y="88.0" font-size="12" text-anchor="middle">Covalent bond</text></g>
<g data-part="sharedPair" class="dg-label"><circle cx="163.2" cy="139.2" r="3.4"/><text x="163.2" y="131.2" font-size="12" text-anchor="middle">Shared electron pair</text></g>
<g data-part="metalIon" class="dg-label"><circle cx="236.8" cy="57.6" r="3.4"/><text x="236.8" y="49.6" font-size="12" text-anchor="middle">Positive metal ion</text></g>
<g data-part="electronSea" class="dg-label"><circle cx="262.4" cy="120.0" r="3.4"/><text x="255.4" y="112.0" font-size="12" text-anchor="end">Sea of delocalised electrons</text></g>
<g data-part="positiveIon" class="dg-label"><circle cx="38.4" cy="201.6" r="3.4"/><text x="45.4" y="193.6" font-size="12" text-anchor="start">Metal loses electron</text></g>
</svg>
