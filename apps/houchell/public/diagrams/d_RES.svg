<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Respiration">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="250" fill="#ffffff"/>
<rect x="6" y="6" width="308" height="238" rx="16" fill="#F4F6FC" stroke="#1E2761" stroke-width="1.5"/>

<g data-part="cell">
  <path d="M40 120 q0 -55 60 -58 q60 -3 78 8 q30 -14 62 6 q34 22 20 60 q14 34 -16 52 q-22 26 -66 20 q-40 22 -82 -4 q-42 -22 -30 -60 q-30 -12 -26 -24 z"
        fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/>
  <circle cx="108" cy="86" r="14" fill="#ffffff" stroke="#1E2761" stroke-width="2"/>
</g>

<g data-part="mitochondria">
  <ellipse cx="112" cy="140" rx="52" ry="30" fill="#F1D2D8" stroke="#B4341E" stroke-width="3" class="sm-throb"/>
  <path d="M66 140 q13 -16 26 0 q13 16 26 0 q13 -16 26 0 q13 16 12 0"
        fill="none" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="112" cy="140" rx="52" ry="30" fill="none" stroke="#B4341E" stroke-width="1.4" opacity="0.5" class="sm-glow"/>
</g>

<g data-part="glucose">
  <polygon points="30,34 46,26 62,34 62,52 46,60 30,52" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" class="sm-throb"/>
  <path class="sm-flow" d="M52 56 L84 92" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <polygon points="86,96 74,92 80,84" fill="#2C5F2D"/>
</g>

<g data-part="oxygen">
  <g class="sm-drift">
    <circle cx="196" cy="36" r="11" fill="#B4341E" stroke="#7a1f12" stroke-width="2"/>
    <circle cx="216" cy="36" r="11" fill="#B4341E" stroke="#7a1f12" stroke-width="2"/>
    <line x1="196" y1="30" x2="216" y2="30" stroke="#7a1f12" stroke-width="2"/>
    <line x1="196" y1="42" x2="216" y2="42" stroke="#7a1f12" stroke-width="2"/>
  </g>
  <path class="sm-flow" d="M200 52 L150 100" fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <polygon points="148,104 160,100 154,92" fill="#B4341E"/>
</g>

<g data-part="products">
  <path class="sm-flow" d="M120 170 L120 206" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <polygon points="120,212 113,201 127,201" fill="#1E2761"/>
  <g class="sm-rise">
    <circle cx="104" cy="228" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.6"/>
    <circle cx="120" cy="232" r="6" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.6"/>
    <circle cx="136" cy="228" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.6"/>
  </g>
</g>

<g data-part="lacticAcid">
  <path d="M186 132 q30 -6 44 6" fill="none" stroke="#7a8199" stroke-width="2" stroke-dasharray="4 5"/>
  <polygon points="232,140 222,132 228,127" fill="#7a8199"/>
  <rect x="230" y="114" width="62" height="38" rx="9" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/>
  <path d="M242 143 q9 -12 18 0 q9 12 18 0" fill="none" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
  <circle cx="261" cy="128" r="5" fill="#B4341E"/>
</g>

<g data-part="fermentation">
  <path d="M188 158 q30 12 44 24" fill="none" stroke="#7a8199" stroke-width="2" stroke-dasharray="4 5"/>
  <polygon points="234,186 224,178 220,186" fill="#7a8199"/>
  <rect x="230" y="182" width="62" height="44" rx="9" fill="#F6EBCB" stroke="#C99528" stroke-width="2.5"/>
  <circle cx="248" cy="202" r="8" fill="#C99528" stroke="#8a6614" stroke-width="1.6"/>
  <g class="sm-rise">
    <circle cx="272" cy="206" r="4" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.2"/>
    <circle cx="280" cy="198" r="3" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.2"/>
    <circle cx="268" cy="194" r="3" fill="#AEB6D6" stroke="#1E2761" stroke-width="1.2"/>
  </g>
</g>

</g>
<g data-part="glucose" class="dg-label"><circle cx="60.2" cy="61.0" r="3.4"/><text x="67.2" y="53.0" font-size="12" text-anchor="start">Glucose</text></g>
<g data-part="oxygen" class="dg-label"><circle cx="259.8" cy="52.0" r="3.4"/><text x="252.8" y="44.0" font-size="12" text-anchor="end">Oxygen</text></g>
<g data-part="mitochondria" class="dg-label"><circle cx="160.0" cy="118.0" r="3.4"/><text x="160.0" y="110.0" font-size="12" text-anchor="middle">Mitochondria</text></g>
<g data-part="cell" class="dg-label"><circle cx="110.1" cy="72.0" r="3.4"/><text x="110.1" y="64.0" font-size="12" text-anchor="middle">Cell</text></g>
<g data-part="products" class="dg-label"><circle cx="160.0" cy="216.0" r="3.4"/><text x="160.0" y="208.0" font-size="12" text-anchor="middle">CO₂ + Water</text></g>
<g data-part="lacticAcid" class="dg-label"><circle cx="63.0" cy="208.0" r="3.4"/><text x="70.0" y="200.0" font-size="12" text-anchor="start">Lactic Acid</text></g>
<g data-part="fermentation" class="dg-label"><circle cx="257.0" cy="208.0" r="3.4"/><text x="250.0" y="200.0" font-size="12" text-anchor="end">Fermentation</text></g>
</svg>
