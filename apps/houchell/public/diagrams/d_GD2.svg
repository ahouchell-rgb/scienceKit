<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="States &amp; internal energy">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="230" fill="#F4F6FC"/>
<text x="160" y="20" font-family="sans-serif" font-size="10" fill="#7a8199" text-anchor="middle">cold  →  add energy  →  hot</text>
<g data-part="solid">
  <rect x="16" y="40" width="82" height="82" rx="8" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
  <g class="sm-osc">
    <circle cx="34" cy="58" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><circle cx="57" cy="58" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><circle cx="80" cy="58" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
    <circle cx="34" cy="81" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><circle cx="57" cy="81" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><circle cx="80" cy="81" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
    <circle cx="34" cy="104" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><circle cx="57" cy="104" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/><circle cx="80" cy="104" r="6.5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  </g>
</g>
<g data-part="liquid">
  <path d="M120 68 v46 a8 8 0 0 0 8 8 h66 a8 8 0 0 0 8 -8 v-46 z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <g class="sm-drift">
    <circle cx="136" cy="86" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/><circle cx="159" cy="82" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/><circle cx="182" cy="88" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="148" cy="102" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/><circle cx="171" cy="104" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="137" cy="112" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/><circle cx="184" cy="110" r="6.5" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
  </g>
</g>
<g data-part="gas">
  <rect x="222" y="40" width="82" height="82" rx="8" fill="#fff" stroke="#7a8199" stroke-width="2" stroke-dasharray="4 4"/>
  <g class="sm-drift">
    <circle cx="240" cy="56" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/><line x1="244" y1="50" x2="253" y2="45" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="288" cy="62" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/><line x1="284" y1="68" x2="294" y2="73" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="264" cy="84" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/><line x1="260" y1="90" x2="251" y2="97" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="236" cy="106" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/><line x1="240" y1="102" x2="230" y2="98" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="290" cy="104" r="6" fill="#F1D2D8" stroke="#B4341E" stroke-width="2"/><line x1="286" y1="100" x2="296" y2="94" stroke="#B4341E" stroke-width="2" stroke-linecap="round"/>
  </g>
</g>
<g data-part="meltFreeze">
  <line x1="102" y1="70" x2="115" y2="70" stroke="#B4341E" stroke-width="3" stroke-linecap="round"/><polygon points="115,64 126,70 115,76" fill="#B4341E"/>
  <line x1="118" y1="90" x2="105" y2="90" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/><polygon points="105,84 94,90 105,96" fill="#1E2761"/>
</g>
<g data-part="boilCondense">
  <line x1="206" y1="70" x2="219" y2="70" stroke="#B4341E" stroke-width="3" stroke-linecap="round"/><polygon points="219,64 230,70 219,76" fill="#B4341E"/>
  <line x1="222" y1="90" x2="209" y2="90" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/><polygon points="209,84 198,90 209,96" fill="#1E2761"/>
</g>
<g data-part="sublime">
  <path d="M57 138 C57 190 263 190 263 138" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
  <polygon points="255,144 264,136 268,148" fill="#2C5F2D"/>
</g>
</g>
<g data-part="solid" class="dg-label"><circle cx="54.4" cy="96.6" r="3.4"/><text x="61.4" y="88.6" font-size="12" text-anchor="start">Solid</text></g>
<g data-part="liquid" class="dg-label"><circle cx="160.0" cy="96.6" r="3.4"/><text x="160.0" y="88.6" font-size="12" text-anchor="middle">Liquid</text></g>
<g data-part="gas" class="dg-label"><circle cx="265.6" cy="96.6" r="3.4"/><text x="258.6" y="88.6" font-size="12" text-anchor="end">Gas</text></g>
<g data-part="meltFreeze" class="dg-label"><circle cx="108.8" cy="126.5" r="3.4"/><text x="108.8" y="118.5" font-size="12" text-anchor="middle">Melting / Freezing</text></g>
<g data-part="boilCondense" class="dg-label"><circle cx="211.2" cy="126.5" r="3.4"/><text x="211.2" y="118.5" font-size="12" text-anchor="middle">Boiling / Condensing</text></g>
<g data-part="sublime" class="dg-label"><circle cx="160.0" cy="36.8" r="3.4"/><text x="160.0" y="28.8" font-size="12" text-anchor="middle">Sublimation</text></g>
</svg>
