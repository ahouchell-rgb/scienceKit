<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Reproduction &amp; DNA">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="0" y="0" width="320" height="220" fill="#F4F6FC"/>
<text x="80" y="14" font-family="Arial,sans-serif" font-size="10" fill="#7a8199" text-anchor="middle">Sexual reproduction</text>
<g data-part="eggCell">
  <circle cx="40" cy="52" r="20" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/>
  <circle cx="40" cy="52" r="8" fill="#B4341E" opacity="0.5"/>
</g>
<g data-part="spermCell">
  <ellipse cx="40" cy="112" rx="10" ry="7" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M50 112 q10 -8 20 0 q-10 8 -20 0" fill="none" stroke="#1E2761" stroke-width="2" class="sm-osc"/>
  <line x1="50" y1="112" x2="72" y2="112" stroke="#1E2761" stroke-width="1.5" stroke-dasharray="3 3"/>
</g>
<path d="M64 60 L96 78" stroke="#7a8199" stroke-width="2" fill="none"/>
<path d="M96 78 l-11 -1 l3 -8 z" fill="#7a8199"/>
<path d="M56 108 L96 86" stroke="#7a8199" stroke-width="2" fill="none"/>
<path d="M96 86 l-11 1 l3 8 z" fill="#7a8199"/>
<g data-part="zygote">
  <circle cx="118" cy="82" r="18" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/>
</g>
<g data-part="chromosomes">
  <path d="M35 46 v12 M45 46 v12" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M37 108 v8 M43 108 v8" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 78 v10 M117 76 v12 M122 78 v10 M127 80 v8" stroke="#2C5F2D" stroke-width="2.5" stroke-linecap="round"/>
  <text x="118" y="112" font-family="Arial,sans-serif" font-size="8" fill="#2C5F2D" text-anchor="middle">n + n = 2n</text>
</g>
<g data-part="asexualParent">
  <text x="60" y="150" font-family="Arial,sans-serif" font-size="10" fill="#7a8199" text-anchor="middle">Asexual (clone)</text>
  <circle cx="30" cy="182" r="15" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/>
  <path d="M48 175 h18 M48 189 h18" stroke="#7a8199" stroke-width="2" fill="none"/>
  <path d="M66 175 l-8 -3 v6 z M66 189 l-8 -3 v6 z" fill="#7a8199"/>
  <circle cx="82" cy="170" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <circle cx="82" cy="196" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
</g>
<line x1="134" y1="82" x2="176" y2="70" stroke="#AEB6D6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="230" y="20" font-family="Arial,sans-serif" font-size="10" fill="#7a8199" text-anchor="middle">Zoom in: DNA</text>
<g data-part="dnaHelix">
  <path d="M200 34 C238 52 200 70 238 88 C200 106 238 124 200 142" fill="none" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
  <path d="M238 34 C200 52 238 70 200 88 C238 106 200 124 238 142" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
</g>
<g data-part="basePair">
  <line x1="210" y1="46" x2="228" y2="46" stroke="#C99528" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="70" x2="226" y2="70" stroke="#C99528" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="94" x2="228" y2="94" stroke="#C99528" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="118" x2="226" y2="118" stroke="#C99528" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="130" x2="228" y2="130" stroke="#C99528" stroke-width="3" stroke-linecap="round"/>
  <rect x="264" y="52" width="46" height="76" rx="6" fill="none" stroke="#C99528" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="287" y="46" font-family="Arial,sans-serif" font-size="9" fill="#C99528" text-anchor="middle">1 gene</text>
  <line x1="274" y1="66" x2="300" y2="66" stroke="#C99528" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="274" y1="82" x2="300" y2="82" stroke="#C99528" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="274" y1="98" x2="300" y2="98" stroke="#C99528" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="274" y1="114" x2="300" y2="114" stroke="#C99528" stroke-width="2.5" stroke-linecap="round"/>
</g>

</g>
<g data-part="eggCell" class="dg-label"><circle cx="51.2" cy="57.2" r="3.4"/><text x="58.2" y="49.2" font-size="12" text-anchor="start">Egg (gamete)</text></g>
<g data-part="spermCell" class="dg-label"><circle cx="121.6" cy="59.4" r="3.4"/><text x="121.6" y="51.4" font-size="12" text-anchor="middle">Sperm (gamete)</text></g>
<g data-part="zygote" class="dg-label"><circle cx="86.4" cy="149.6" r="3.4"/><text x="86.4" y="141.6" font-size="12" text-anchor="middle">Fertilised cell</text></g>
<g data-part="asexualParent" class="dg-label"><circle cx="224.0" cy="35.2" r="3.4"/><text x="224.0" y="27.2" font-size="12" text-anchor="middle">Single parent (clone)</text></g>
<g data-part="chromosomes" class="dg-label"><circle cx="224.0" cy="92.4" r="3.4"/><text x="224.0" y="84.4" font-size="12" text-anchor="middle">Chromosomes (halved)</text></g>
<g data-part="dnaHelix" class="dg-label"><circle cx="284.8" cy="72.6" r="3.4"/><text x="277.8" y="64.6" font-size="12" text-anchor="end">DNA double helix</text></g>
<g data-part="basePair" class="dg-label"><circle cx="284.8" cy="114.4" r="3.4"/><text x="277.8" y="106.4" font-size="12" text-anchor="end">Gene / base pair</text></g>
</svg>
