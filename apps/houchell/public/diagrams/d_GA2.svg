<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Development of the model">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="4" y="4" width="322" height="242" rx="12" fill="#F4F6FC" stroke="#1E2761" stroke-width="2.5"/>
<g data-part="alphaSource">
  <path d="M20 108 h30 v34 h-30 a6 6 0 0 1 -6 -6 v-22 a6 6 0 0 1 6 -6 Z" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="50" y="118" width="16" height="14" fill="#B4341E"/>
  <circle cx="30" cy="118" r="3" fill="#B4341E"/>
  <circle cx="40" cy="126" r="3" fill="#B4341E"/>
  <circle cx="28" cy="134" r="3" fill="#B4341E"/>
</g>
<g data-part="goldFoil">
  <rect x="150" y="40" width="12" height="176" rx="4" fill="#C99528" stroke="#1E2761" stroke-width="2.4"/>
  <line x1="153" y1="52" x2="153" y2="204" stroke="#E4C874" stroke-width="1.4"/>
</g>
<g data-part="straightPath">
  <line class="sm-flow" x1="70" y1="125" x2="150" y2="125" stroke="#2C5F2D" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
  <line class="sm-flow" x1="162" y1="125" x2="300" y2="125" stroke="#2C5F2D" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="304,125 294,120 294,130" fill="#2C5F2D"/>
  <line class="sm-flow" x1="70" y1="150" x2="150" y2="150" stroke="#2C5F2D" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <line class="sm-flow" x1="162" y1="150" x2="300" y2="150" stroke="#2C5F2D" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="304,150 294,145 294,155" fill="#2C5F2D"/>
</g>
<g data-part="deflectedPath">
  <path class="sm-flow" d="M70 92 L142 106" fill="none" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
  <path class="sm-flow" d="M142 106 Q166 100 216 66" fill="none" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="216,66 213,77 223,72" fill="#B4341E"/>
  <path class="sm-flow" d="M70 205 L140 145" fill="none" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
  <path class="sm-flow" d="M140 145 Q124 100 86 82" fill="none" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="86,82 96,84 90,74" fill="#B4341E"/>
</g>
<g data-part="nucleus">
  <circle class="sm-glow" cx="156" cy="113" r="10" fill="#B4341E" stroke="#1E2761" stroke-width="1.8"/>
  <text x="156" y="117" font-family="Arial,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
</g>
<g data-part="electronShell">
  <circle cx="156" cy="113" r="24" fill="none" stroke="#1E2761" stroke-width="1.8"/>
  <circle cx="156" cy="89" r="4" fill="#2C5F2D"/>
  <circle cx="180" cy="113" r="4" fill="#2C5F2D"/>
  <circle cx="156" cy="137" r="4" fill="#2C5F2D"/>
  <circle cx="132" cy="113" r="4" fill="#2C5F2D"/>
</g>
<g data-part="neutron">
  <circle cx="270" cy="205" r="12" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
  <line x1="240" y1="205" x2="256" y2="205" stroke="#7a8199" stroke-width="1.6" stroke-dasharray="3 3"/>
  <path d="M258 197 l4 4 l-4 4" fill="none" stroke="#7a8199" stroke-width="1.4"/>
</g>
</g>
<g data-part="alphaSource" class="dg-label"><circle cx="39.6" cy="190.0" r="3.4"/><text x="46.6" y="182.0" font-size="12" text-anchor="start">Alpha source</text></g>
<g data-part="goldFoil" class="dg-label"><circle cx="85.8" cy="155.0" r="3.4"/><text x="85.8" y="147.0" font-size="12" text-anchor="middle">Gold foil</text></g>
<g data-part="straightPath" class="dg-label"><circle cx="257.4" cy="200.0" r="3.4"/><text x="257.4" y="192.0" font-size="12" text-anchor="middle">Passes straight through</text></g>
<g data-part="deflectedPath" class="dg-label"><circle cx="108.9" cy="30.0" r="3.4"/><text x="108.9" y="22.0" font-size="12" text-anchor="middle">Deflected / bounced back</text></g>
<g data-part="nucleus" class="dg-label"><circle cx="217.8" cy="105.0" r="3.4"/><text x="217.8" y="97.0" font-size="12" text-anchor="middle">Nucleus</text></g>
<g data-part="electronShell" class="dg-label"><circle cx="273.9" cy="80.0" r="3.4"/><text x="266.9" y="72.0" font-size="12" text-anchor="end">Electron shell</text></g>
<g data-part="neutron" class="dg-label"><circle cx="257.4" cy="140.0" r="3.4"/><text x="257.4" y="132.0" font-size="12" text-anchor="middle">Neutron</text></g>
</svg>
