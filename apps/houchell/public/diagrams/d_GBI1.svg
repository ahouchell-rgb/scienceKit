<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Pathogens &amp; disease">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" fill="#F4F6FC"/><g data-part="pathogenTypes"><rect x="16" y="30" width="34" height="14" rx="7" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" class="sm-drift"/><circle cx="26" cy="72" r="10" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><g stroke="#B4341E" stroke-width="2" stroke-linecap="round"><line x1="26" y1="60" x2="26" y2="54"/><line x1="26" y1="84" x2="26" y2="90"/><line x1="14" y1="72" x2="8" y2="72"/><line x1="38" y1="72" x2="44" y2="72"/></g><path d="M52 66 q10 -6 16 2 q8 -4 12 4" fill="none" stroke="#C99528" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="72" r="5" fill="#C99528"/><path d="M18 104 q-6 -12 10 -12 q18 -2 16 12 q2 14 -16 12 q-16 2 -10 -12 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5" class="sm-drift"/><circle cx="26" cy="104" r="3" fill="#1E2761"/></g><g data-part="hostCell"><circle cx="160" cy="130" r="42" fill="#DCEAF6" stroke="#1E2761" stroke-width="3"/><ellipse cx="160" cy="130" rx="16" ry="14" fill="#C7DAF0" stroke="#1E2761" stroke-width="2"/><circle cx="160" cy="130" r="5" fill="#1E2761"/></g><g data-part="virus"><circle cx="150" cy="118" r="9" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5" class="sm-throb"/><g stroke="#B4341E" stroke-width="1.8" stroke-linecap="round"><line x1="150" y1="107" x2="150" y2="102"/><line x1="150" y1="129" x2="150" y2="134"/><line x1="139" y1="118" x2="134" y2="118"/><line x1="161" y1="118" x2="166" y2="118"/></g><circle cx="176" cy="140" r="5" fill="#F1D2D8" stroke="#B4341E" stroke-width="1.8" class="sm-rise"/><circle cx="168" cy="150" r="4" fill="#F1D2D8" stroke="#B4341E" stroke-width="1.8" class="sm-rise"/></g><g data-part="droplet"><polyline class="sm-flow" points="120,30 150,55 168,78" fill="none" stroke="#1E76C8" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M118 26 c0 8 6 10 6 4 c0 -3 -3 -4 -3 -8 c-1 3 -3 5 -3 4 Z" fill="#1E76C8" class="sm-fall"/><path d="M138 40 c0 7 5 9 5 3 c0 -3 -2.5 -3.5 -2.5 -7 c-1 3 -2.5 4 -2.5 4 Z" fill="#1E76C8" class="sm-fall"/><circle cx="150" cy="48" r="3" fill="#1E76C8" class="sm-fall"/></g><g data-part="mosquito"><ellipse cx="70" cy="196" rx="16" ry="7" fill="#1E2761" stroke="#1E2761" stroke-width="2" transform="rotate(-15 70 196)"/><circle cx="86" cy="190" r="6" fill="#1E2761"/><line x1="92" y1="188" x2="104" y2="182" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><path d="M64 188 q-14 -14 -28 -8 M74 188 q-10 -16 -24 -14" fill="none" stroke="#7a8199" stroke-width="2" stroke-linecap="round" class="sm-osc"/><line x1="60" y1="200" x2="54" y2="212" stroke="#1E2761" stroke-width="1.6"/><line x1="70" y1="202" x2="70" y2="214" stroke="#1E2761" stroke-width="1.6"/></g><g data-part="vaccine"><circle cx="270" cy="120" r="30" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="3" class="sm-glow"/><path d="M270 96 l18 8 v14 c0 14 -10 22 -18 26 c-8 -4 -18 -12 -18 -26 v-14 Z" fill="#fff" stroke="#2C5F2D" stroke-width="2.5"/><path d="M262 120 l6 7 12 -14" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g data-part="pathogenTypes" class="dg-label"><circle cx="60.8" cy="36.0" r="3.4"/><text x="67.8" y="28.0" font-size="12" text-anchor="start">Pathogen types</text></g>
<g data-part="hostCell" class="dg-label"><circle cx="160.0" cy="148.8" r="3.4"/><text x="160.0" y="140.8" font-size="12" text-anchor="middle">Host cell</text></g>
<g data-part="virus" class="dg-label"><circle cx="118.4" cy="124.8" r="3.4"/><text x="118.4" y="116.8" font-size="12" text-anchor="middle">Virus</text></g>
<g data-part="droplet" class="dg-label"><circle cx="249.6" cy="55.2" r="3.4"/><text x="249.6" y="47.2" font-size="12" text-anchor="middle">Droplet (air)</text></g>
<g data-part="mosquito" class="dg-label"><circle cx="262.4" cy="160.8" r="3.4"/><text x="255.4" y="152.8" font-size="12" text-anchor="end">Vector</text></g>
<g data-part="vaccine" class="dg-label"><circle cx="272.0" cy="105.6" r="3.4"/><text x="265.0" y="97.6" font-size="12" text-anchor="end">Vaccination</text></g>
</svg>
