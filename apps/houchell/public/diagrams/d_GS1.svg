<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The solar system &amp; orbits">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#F4F6FC"/>
<ellipse cx="70" cy="130" rx="180" ry="95" fill="none" stroke="#7a8199" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
<g data-part="sun">
  <circle cx="70" cy="130" r="30" fill="#C99528"/>
  <circle cx="70" cy="130" r="30" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <g stroke="#C99528" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="88" x2="70" y2="96"/>
    <line x1="70" y1="164" x2="70" y2="172"/>
    <line x1="28" y1="130" x2="36" y2="130"/>
    <line x1="104" y1="130" x2="112" y2="130"/>
    <line x1="40" y1="100" x2="46" y2="106"/>
    <line x1="94" y1="154" x2="100" y2="160"/>
    <line x1="100" y1="100" x2="94" y2="106"/>
    <line x1="46" y1="154" x2="40" y2="160"/>
  </g>
</g>
<g data-part="planet">
  <circle cx="238" cy="112" r="20" fill="#DCEAF6"/>
  <circle cx="238" cy="112" r="20" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M225 108 q6 -6 13 -2 q7 4 12 0" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M228 120 q8 4 18 -1" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
</g>
<g data-part="orbitPath">
  <ellipse cx="70" cy="130" rx="180" ry="95" fill="none" stroke="#C99528" stroke-width="2.5" stroke-dasharray="6 6" class="sm-flow"/>
</g>
<g data-part="moon">
  <circle cx="238" cy="66" r="8" fill="#CDE5C6"/>
  <circle cx="238" cy="66" r="8" fill="none" stroke="#1E2761" stroke-width="2"/>
  <ellipse cx="238" cy="112" rx="30" ry="46" fill="none" stroke="#7a8199" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.7"/>
</g>
<g data-part="artificialSatellite">
  <ellipse cx="238" cy="112" rx="46" ry="30" fill="none" stroke="#7a8199" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.7"/>
  <g transform="translate(284,112)">
    <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#B4341E" stroke="#1E2761" stroke-width="1.5"/>
    <rect x="-14" y="-3" width="8" height="6" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.3"/>
    <rect x="6" y="-3" width="8" height="6" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.3"/>
  </g>
</g>
<g data-part="gravityForce">
  <line x1="278" y1="112" x2="256" y2="112" stroke="#B4341E" stroke-width="3" stroke-linecap="round" marker-end="url(#gs1arrow)"/>
</g>
<defs>
  <marker id="gs1arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#B4341E"/>
  </marker>
</defs>
</g>
<g data-part="sun" class="dg-label"><circle cx="108.8" cy="130.0" r="3.4"/><text x="108.8" y="122.0" font-size="12" text-anchor="middle">Sun (a star)</text></g>
<g data-part="planet" class="dg-label"><circle cx="163.2" cy="130.0" r="3.4"/><text x="163.2" y="122.0" font-size="12" text-anchor="middle">Planet</text></g>
<g data-part="moon" class="dg-label"><circle cx="131.2" cy="37.5" r="3.4"/><text x="131.2" y="29.5" font-size="12" text-anchor="middle">Moon (natural satellite)</text></g>
<g data-part="artificialSatellite" class="dg-label"><circle cx="262.4" cy="70.0" r="3.4"/><text x="255.4" y="62.0" font-size="12" text-anchor="end">Artificial satellite</text></g>
<g data-part="gravityForce" class="dg-label"><circle cx="137.6" cy="95.0" r="3.4"/><text x="137.6" y="87.0" font-size="12" text-anchor="middle">Gravity (pulls inward)</text></g>
<g data-part="orbitPath" class="dg-label"><circle cx="38.4" cy="212.5" r="3.4"/><text x="45.4" y="204.5" font-size="12" text-anchor="start">Orbit</text></g>
</svg>
