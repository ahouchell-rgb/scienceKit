<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Newton's laws of motion">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" fill="#F4F6FC"/>
<defs>
  <marker id="ar5f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2761"/></marker>
  <marker id="ar5w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B4341E"/></marker>
  <marker id="ar5n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2C5F2D"/></marker>
  <marker id="ar5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C99528"/></marker>
</defs>
<g data-part="track">
  <rect x="14" y="150" width="292" height="12" rx="3" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="20" y1="168" x2="300" y2="168" stroke="#7a8199" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
</g>
<g data-part="trolley">
  <rect x="96" y="106" width="88" height="34" rx="5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="3"/>
  <circle cx="116" cy="146" r="9" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
  <circle cx="164" cy="146" r="9" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
  <circle cx="116" cy="146" r="2.5" fill="#1E2761"/>
  <circle cx="164" cy="146" r="2.5" fill="#1E2761"/>
</g>
<g data-part="pullForce">
  <line x1="184" y1="120" x2="266" y2="120" stroke="#1E2761" stroke-width="4" stroke-linecap="round" marker-end="url(#ar5f)"/>
  <text x="248" y="112" font-family="sans-serif" font-size="12" font-weight="700" fill="#1E2761">F</text>
</g>
<g data-part="weight">
  <line x1="140" y1="123" x2="140" y2="200" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar5w)"/>
</g>
<g data-part="normalForce">
  <line x1="120" y1="106" x2="120" y2="54" stroke="#2C5F2D" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar5n)"/>
</g>
<g data-part="acceleration">
  <line x1="196" y1="188" x2="286" y2="188" stroke="#C99528" stroke-width="4" stroke-linecap="round" marker-end="url(#ar5a)" class="sm-flow" stroke-dasharray="10 8"/>
  <text x="234" y="210" font-family="sans-serif" font-size="12" font-weight="700" fill="#C99528">a</text>
</g>
</g>
<g data-part="trolley" class="dg-label"><circle cx="160.0" cy="120.0" r="3.4"/><text x="160.0" y="112.0" font-size="12" text-anchor="middle">Trolley (mass)</text></g>
<g data-part="track" class="dg-label"><circle cx="89.6" cy="156.0" r="3.4"/><text x="89.6" y="148.0" font-size="12" text-anchor="middle">Track</text></g>
<g data-part="pullForce" class="dg-label"><circle cx="240.0" cy="127.2" r="3.4"/><text x="240.0" y="119.2" font-size="12" text-anchor="middle">Resultant force</text></g>
<g data-part="weight" class="dg-label"><circle cx="156.8" cy="189.6" r="3.4"/><text x="156.8" y="181.6" font-size="12" text-anchor="middle">Weight</text></g>
<g data-part="normalForce" class="dg-label"><circle cx="156.8" cy="74.4" r="3.4"/><text x="156.8" y="66.4" font-size="12" text-anchor="middle">Normal (reaction) force</text></g>
<g data-part="acceleration" class="dg-label"><circle cx="83.2" cy="96.0" r="3.4"/><text x="83.2" y="88.0" font-size="12" text-anchor="middle">Acceleration</text></g>
</svg>
