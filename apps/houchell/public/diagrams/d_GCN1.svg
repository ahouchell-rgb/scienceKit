<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Purity, formulations &amp; chromatography">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="300" height="280" fill="#fff"/><path d="M56 196 v54 a10 10 0 0 0 10 10 h130 a10 10 0 0 0 10 -10 v-54 z" fill="none" stroke="#7a8199" stroke-width="2.5" stroke-linejoin="round"/><g data-part="solvent"><path d="M58 214 v36 a8 8 0 0 0 8 8 h126 a8 8 0 0 0 8 -8 v-36 z" fill="#DCEAF6" stroke="none"/><path class="sm-osc" d="M58 214 H200" fill="none" stroke="#1E2761" stroke-width="1.8"/><path class="sm-rise" d="M96 210 v-14" stroke="#1E2761" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.7"/><path class="sm-rise" d="M160 210 v-14" stroke="#1E2761" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.7"/></g><g data-part="paper"><rect x="86" y="44" width="88" height="192" rx="4" fill="#F4F6FC" stroke="#1E2761" stroke-width="3"/></g><g data-part="baseline"><path d="M88 224 H172" stroke="#7a8199" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="176" cy="224" r="2" fill="#7a8199"/></g><g data-part="solventFront"><path d="M88 66 H172" stroke="#B4341E" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="176" cy="66" r="2" fill="#B4341E"/></g><g data-part="spot"><circle cx="110" cy="200" r="6" fill="#2C5F2D" stroke="#1E2761" stroke-width="1.5" opacity="0.4"/><circle cx="110" cy="150" r="8" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5"/><circle cx="130" cy="200" r="6" fill="#B4341E" stroke="#1E2761" stroke-width="1.5" opacity="0.4"/><circle cx="130" cy="110" r="8" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5"/><circle cx="150" cy="200" r="6" fill="#1E2761" stroke="#1E2761" stroke-width="1.5" opacity="0.4"/><circle cx="150" cy="90" r="8" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.5"/></g><g data-part="distance"><line x1="60" y1="66" x2="60" y2="224" stroke="#C99528" stroke-width="2.5"/><line x1="54" y1="66" x2="66" y2="66" stroke="#C99528" stroke-width="2.5"/><line x1="54" y1="224" x2="66" y2="224" stroke="#C99528" stroke-width="2.5"/><polygon points="60,72 55,62 65,62" fill="#C99528"/><polygon points="60,218 55,228 65,228" fill="#C99528"/></g>
</g>
<g data-part="paper" class="dg-label"><circle cx="201.0" cy="61.6" r="3.4"/><text x="201.0" y="53.6" font-size="11" text-anchor="middle">Chromatography paper (stationary phase)</text></g>
<g data-part="solvent" class="dg-label"><circle cx="72.0" cy="232.4" r="3.4"/><text x="72.0" y="224.4" font-size="11" text-anchor="middle">Solvent (mobile phase)</text></g>
<g data-part="baseline" class="dg-label"><circle cx="240.0" cy="210.0" r="3.4"/><text x="233.0" y="202.0" font-size="11" text-anchor="end">Pencil baseline</text></g>
<g data-part="solventFront" class="dg-label"><circle cx="240.0" cy="81.2" r="3.4"/><text x="233.0" y="73.2" font-size="11" text-anchor="end">Solvent front</text></g>
<g data-part="spot" class="dg-label"><circle cx="150.0" cy="134.4" r="3.4"/><text x="150.0" y="126.4" font-size="11" text-anchor="middle">Separated spot</text></g>
<g data-part="distance" class="dg-label"><circle cx="39.0" cy="145.6" r="3.4"/><text x="46.0" y="137.6" font-size="11" text-anchor="start">Distance moved (Rf)</text></g>
</svg>
