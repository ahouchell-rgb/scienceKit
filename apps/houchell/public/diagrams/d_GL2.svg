<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Resistance &amp; Ohm's law">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">

<rect x="2" y="2" width="316" height="246" rx="12" fill="#F4F6FC" stroke="#1E2761" stroke-width="2"/>
<g fill="#C99528">
  <path d="M150 42 l10 5 -10 5 z" class="sm-drift"/>
  <path d="M60 200 l-10 -5 10 -5 z" class="sm-drift"/>
</g>

<!-- leads : the whole connecting wire loop -->
<g data-part="leads">
  <path d="M50 52 H270 V196 H50 Z" fill="none" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/>
</g>

<!-- cell : left -->
<g data-part="cell">
  <line x1="50" y1="112" x2="50" y2="136" stroke="#F4F6FC" stroke-width="6"/>
  <line x1="40" y1="114" x2="60" y2="114" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="42" y1="122" x2="58" y2="122" stroke="#1E2761" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="130" x2="60" y2="130" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="42" y1="138" x2="58" y2="138" stroke="#1E2761" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- ammeter : top-left, in series -->
<g data-part="ammeter">
  <line x1="95" y1="52" x2="125" y2="52" stroke="#F4F6FC" stroke-width="7"/>
  <circle cx="110" cy="52" r="15" fill="#fff" stroke="#1E2761" stroke-width="3"/>
  <text x="110" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1E2761">A</text>
</g>

<!-- testWire : bottom, the resistance-wire under test -->
<g data-part="testWire">
  <line x1="120" y1="196" x2="205" y2="196" stroke="#F4F6FC" stroke-width="8"/>
  <path d="M120 196 q5 -6 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round"/>
</g>

<!-- voltmeter : below the wire, connected in parallel across it -->
<g data-part="voltmeter">
  <line x1="140" y1="196" x2="140" y2="222" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="185" y1="196" x2="185" y2="222" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="140" y1="222" x2="150" y2="222" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="175" y1="222" x2="185" y2="222" stroke="#1E2761" stroke-width="2.5"/>
  <circle cx="162.5" cy="222" r="15" fill="#fff" stroke="#1E2761" stroke-width="3"/>
  <text x="162.5" y="227" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1E2761">V</text>
</g>

</g>
<g data-part="cell" class="dg-label"><circle cx="160.0" cy="190.0" r="3.4"/><text x="160.0" y="182.0" font-size="12" text-anchor="middle">Cell</text></g>
<g data-part="ammeter" class="dg-label"><circle cx="118.4" cy="110.0" r="3.4"/><text x="118.4" y="102.0" font-size="12" text-anchor="middle">Ammeter</text></g>
<g data-part="testWire" class="dg-label"><circle cx="214.4" cy="110.0" r="3.4"/><text x="214.4" y="102.0" font-size="12" text-anchor="middle">Test wire</text></g>
<g data-part="voltmeter" class="dg-label"><circle cx="246.4" cy="60.0" r="3.4"/><text x="246.4" y="52.0" font-size="12" text-anchor="middle">Voltmeter</text></g>
<g data-part="leads" class="dg-label"><circle cx="60.8" cy="150.0" r="3.4"/><text x="67.8" y="142.0" font-size="12" text-anchor="start">Connecting leads</text></g>
</svg>
