<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Space">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="260" fill="#F4F6FC"/>
<defs>
  <marker id="spcarr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0 0 L8 4 L0 8 Z" fill="#1E2761"/>
  </marker>
</defs>
<g fill="#1E2761" opacity="0.35">
  <circle cx="30" cy="30" r="1.4"/><circle cx="300" cy="120" r="1.4"/>
  <circle cx="270" cy="40" r="1.4"/><circle cx="150" cy="20" r="1.4"/>
  <circle cx="60" cy="230" r="1.4"/><circle cx="230" cy="235" r="1.4"/>
  <circle cx="15" cy="150" r="1.4"/>
</g>
<g data-part="sun">
  <circle cx="55" cy="130" r="28" fill="#C99528"/>
  <circle cx="55" cy="130" r="28" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <g stroke="#C99528" stroke-width="3" stroke-linecap="round">
    <line x1="55" y1="92" x2="55" y2="99"/>
    <line x1="55" y1="161" x2="55" y2="168"/>
    <line x1="17" y1="130" x2="24" y2="130"/>
    <line x1="86" y1="130" x2="93" y2="130"/>
    <line x1="28" y1="103" x2="33" y2="108"/>
    <line x1="77" y1="152" x2="82" y2="157"/>
    <line x1="82" y1="103" x2="77" y2="108"/>
    <line x1="33" y1="152" x2="28" y2="157"/>
  </g>
</g>
<g data-part="orbitPath">
  <ellipse cx="55" cy="130" rx="105" ry="72" fill="none" stroke="#C99528" stroke-width="2.5" stroke-dasharray="6 6" class="sm-flow"/>
  <ellipse cx="55" cy="130" rx="200" ry="120" fill="none" stroke="#7a8199" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.7"/>
</g>
<g data-part="rockyPlanet">
  <circle cx="150" cy="82" r="13" fill="#DCEAF6"/>
  <circle cx="150" cy="82" r="13" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M141 79 q5 -4 10 -1 q5 3 8 -1" fill="none" stroke="#2C5F2D" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M143 89 q7 3 15 -1" fill="none" stroke="#2C5F2D" stroke-width="2.4" stroke-linecap="round"/>
</g>
<g data-part="moon">
  <ellipse cx="150" cy="82" rx="26" ry="17" fill="none" stroke="#7a8199" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.7"/>
  <circle cx="176" cy="82" r="6" fill="#CDE5C6"/>
  <circle cx="176" cy="82" r="6" fill="none" stroke="#1E2761" stroke-width="2"/>
</g>
<g data-part="gasPlanet">
  <circle cx="220" cy="205" r="22" fill="#DCEAF6"/>
  <circle cx="220" cy="205" r="22" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <g stroke="#C99528" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M200 198 q20 -5 40 0"/>
    <path d="M199 205 q21 5 42 0"/>
    <path d="M201 213 q19 5 38 0"/>
  </g>
  <ellipse cx="220" cy="205" rx="32" ry="9" fill="none" stroke="#1E2761" stroke-width="2" transform="rotate(-18 220 205)"/>
</g>
<g data-part="tiltAxis">
  <circle cx="272" cy="80" r="20" fill="#DCEAF6"/>
  <circle cx="272" cy="80" r="20" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M262 74 q6 -4 12 -1 q5 3 9 0" fill="none" stroke="#2C5F2D" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M264 86 q8 3 17 -1" fill="none" stroke="#2C5F2D" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="284" y1="56" x2="260" y2="104" stroke="#B4341E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <path d="M272 100 a10 6 0 0 0 12 -3" fill="none" stroke="#1E2761" stroke-width="1.8" marker-end="url(#spcarr)" class="sm-spin"/>
</g>
<g data-part="galaxy">
  <g transform="translate(48,222)">
    <path d="M0 0 m-24 0 a24 12 0 1 0 48 0 a24 12 0 1 0 -48 0" fill="#DCEAF6" opacity="0.5"/>
    <path d="M-20 3 q10 -14 22 -3 q10 8 18 2" fill="none" stroke="#1E2761" stroke-width="2.2" transform="rotate(15)"/>
    <path d="M20 -3 q-10 14 -22 3 q-10 -8 -18 -2" fill="none" stroke="#1E2761" stroke-width="2.2" transform="rotate(15)"/>
    <circle r="4" fill="#C99528"/>
    <circle cx="-14" cy="-2" r="1.2" fill="#1E2761"/>
    <circle cx="12" cy="3" r="1.2" fill="#1E2761"/>
    <circle cx="6" cy="-5" r="1.2" fill="#1E2761"/>
  </g>
</g>
</g>
<g data-part="sun" class="dg-label"><circle cx="92.8" cy="153.4" r="3.4"/><text x="92.8" y="145.4" font-size="12" text-anchor="middle">Sun (a star)</text></g>
<g data-part="orbitPath" class="dg-label"><circle cx="12.8" cy="202.8" r="3.4"/><text x="19.8" y="194.8" font-size="12" text-anchor="start">Orbit</text></g>
<g data-part="rockyPlanet" class="dg-label"><circle cx="147.2" cy="166.4" r="3.4"/><text x="147.2" y="158.4" font-size="12" text-anchor="middle">Rocky planet</text></g>
<g data-part="moon" class="dg-label"><circle cx="182.4" cy="122.2" r="3.4"/><text x="182.4" y="114.2" font-size="12" text-anchor="middle">Moon</text></g>
<g data-part="gasPlanet" class="dg-label"><circle cx="198.4" cy="163.8" r="3.4"/><text x="198.4" y="155.8" font-size="12" text-anchor="middle">Gas planet</text></g>
<g data-part="galaxy" class="dg-label"><circle cx="284.8" cy="72.8" r="3.4"/><text x="277.8" y="64.8" font-size="12" text-anchor="end">Galaxy (Milky Way)</text></g>
<g data-part="tiltAxis" class="dg-label"><circle cx="134.4" cy="127.4" r="3.4"/><text x="134.4" y="119.4" font-size="12" text-anchor="middle">Tilted axis</text></g>
</svg>
