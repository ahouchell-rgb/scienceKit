<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Electrolysis">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="270" fill="#ffffff"/>
<defs>
  <marker id="c3arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1E2761"/></marker>
  <marker id="c3arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B4341E"/></marker>
  <marker id="c3arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2C5F2D"/></marker>
</defs>
<line x1="96" y1="52" x2="96" y2="120" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
<line x1="224" y1="52" x2="224" y2="120" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
<g data-part="powerSupply">
  <rect x="120" y="24" width="80" height="34" rx="6" fill="#F4F6FC" stroke="#1E2761" stroke-width="2"/>
  <line x1="96" y1="41" x2="120" y2="41" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="200" y1="41" x2="224" y2="41" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="150" y1="34" x2="150" y2="48" stroke="#1E2761" stroke-width="3"/>
  <line x1="160" y1="37" x2="160" y2="45" stroke="#1E2761" stroke-width="1.5"/>
  <line x1="170" y1="34" x2="170" y2="48" stroke="#1E2761" stroke-width="3"/>
  <line x1="180" y1="37" x2="180" y2="45" stroke="#1E2761" stroke-width="1.5"/>
  <text x="132" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B4341E">&#8722;</text>
  <text x="190" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E2761">+</text>
  <circle cx="96" cy="82" r="3" fill="#C99528" class="sm-fall"/>
</g>
<path d="M64,120 L64,240 Q64,252 76,252 L244,252 Q256,252 256,240 L256,120" fill="none" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round"/>
<g data-part="electrolyte">
  <path d="M66,140 L254,140 L254,240 Q254,250 244,250 L76,250 Q66,250 66,240 Z" fill="#DCEAF6"/>
  <line x1="66" y1="140" x2="254" y2="140" stroke="#1E2761" stroke-width="1.5" opacity="0.5"/>
</g>
<g data-part="cathode">
  <rect x="90" y="120" width="12" height="112" rx="2" fill="#7a8199" stroke="#1E2761" stroke-width="1.5"/>
  <text x="96" y="134" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B4341E" text-anchor="middle">&#8722;</text>
</g>
<g data-part="anode">
  <rect x="218" y="120" width="12" height="112" rx="2" fill="#7a8199" stroke="#1E2761" stroke-width="1.5"/>
  <text x="224" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">+</text>
</g>
<g data-part="cation">
  <circle cx="150" cy="180" r="11" fill="#F1D2D8" stroke="#B4341E" stroke-width="2" class="sm-drift"/>
  <text x="150" y="184" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B4341E" text-anchor="middle">+</text>
  <path d="M136,195 L110,205" stroke="#B4341E" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#c3arrR)"/>
</g>
<g data-part="anion">
  <circle cx="172" cy="212" r="11" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2" class="sm-drift"/>
  <text x="172" y="216" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2C5F2D" text-anchor="middle">&#8722;</text>
  <path d="M186,208 L210,200" stroke="#2C5F2D" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#c3arrG)"/>
</g>
</g>
<g data-part="powerSupply" class="dg-label"><circle cx="160.0" cy="37.8" r="3.4"/><text x="160.0" y="29.8" font-size="12" text-anchor="middle">Power supply (d.c.)</text></g>
<g data-part="cathode" class="dg-label"><circle cx="128.0" cy="129.6" r="3.4"/><text x="128.0" y="121.6" font-size="12" text-anchor="middle">Cathode (negative)</text></g>
<g data-part="anode" class="dg-label"><circle cx="192.0" cy="129.6" r="3.4"/><text x="192.0" y="121.6" font-size="12" text-anchor="middle">Anode (positive)</text></g>
<g data-part="electrolyte" class="dg-label"><circle cx="256.0" cy="232.2" r="3.4"/><text x="249.0" y="224.2" font-size="12" text-anchor="end">Electrolyte</text></g>
<g data-part="cation" class="dg-label"><circle cx="134.4" cy="183.6" r="3.4"/><text x="134.4" y="175.6" font-size="12" text-anchor="middle">Positive ion (cation)</text></g>
<g data-part="anion" class="dg-label"><circle cx="185.6" cy="216.0" r="3.4"/><text x="185.6" y="208.0" font-size="12" text-anchor="middle">Negative ion (anion)</text></g>
</svg>
