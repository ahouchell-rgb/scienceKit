<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stopping distance &amp; momentum">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="230" fill="#F4F6FC"/>
<rect x="14" y="120" width="292" height="60" fill="#E7EAF3"/>
<line x1="14" y1="150" x2="34" y2="150" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<line x1="286" y1="150" x2="306" y2="150" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<defs>
  <marker id="ar6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2761"/></marker>
  <marker id="ar6m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C99528"/></marker>
</defs>
<path d="M40 120 L52 100 L86 100 L102 120 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="34" y="118" width="74" height="20" rx="6" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.5"/>
<g data-part="momentumArrow">
  <line x1="108" y1="108" x2="168" y2="108" stroke="#C99528" stroke-width="4" stroke-linecap="round" marker-end="url(#ar6m)" class="sm-flow" stroke-dasharray="9 7"/>
  <text x="128" y="100" font-family="sans-serif" font-size="12" font-weight="700" fill="#C99528">p = mv</text>
</g>
<g data-part="wheel">
  <circle cx="92" cy="138" r="12" fill="#1E2761"/>
  <circle cx="92" cy="138" r="5" fill="#fff"/>
  <circle cx="60" cy="138" r="9" fill="#1E2761"/>
  <circle cx="60" cy="138" r="3.5" fill="#fff"/>
</g>
<g data-part="thinkingDistance">
  <rect x="40" y="156" width="112" height="20" fill="#F1D2D8" stroke="#B4341E" stroke-width="1.5"/>
</g>
<g data-part="brakingDistance">
  <rect x="152" y="156" width="126" height="20" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.5"/>
</g>
<g data-part="reactionPoint">
  <line x1="40" y1="150" x2="40" y2="182" stroke="#B4341E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="150" r="4" fill="#B4341E"/>
</g>
<g data-part="brakesApplied">
  <line x1="152" y1="150" x2="152" y2="182" stroke="#1E2761" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <circle cx="152" cy="150" r="4" fill="#1E2761"/>
</g>
<g data-part="stoppingDistance">
  <line x1="40" y1="200" x2="278" y2="200" stroke="#1E2761" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ar6)" marker-end="url(#ar6)"/>
  <line x1="40" y1="194" x2="40" y2="206" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="278" y1="194" x2="278" y2="206" stroke="#1E2761" stroke-width="2.5"/>
</g>
</g>
<g data-part="stoppingDistance" class="dg-label"><circle cx="160.0" cy="209.3" r="3.4"/><text x="160.0" y="201.3" font-size="12" text-anchor="middle">Stopping distance</text></g>
<g data-part="thinkingDistance" class="dg-label"><circle cx="99.2" cy="170.2" r="3.4"/><text x="99.2" y="162.2" font-size="12" text-anchor="middle">Thinking distance</text></g>
<g data-part="brakingDistance" class="dg-label"><circle cx="217.6" cy="170.2" r="3.4"/><text x="217.6" y="162.2" font-size="12" text-anchor="middle">Braking distance</text></g>
<g data-part="reactionPoint" class="dg-label"><circle cx="60.8" cy="57.5" r="3.4"/><text x="67.8" y="49.5" font-size="12" text-anchor="start">Driver reacts</text></g>
<g data-part="brakesApplied" class="dg-label"><circle cx="156.8" cy="151.8" r="3.4"/><text x="156.8" y="143.8" font-size="12" text-anchor="middle">Brakes applied</text></g>
<g data-part="wheel" class="dg-label"><circle cx="262.4" cy="147.2" r="3.4"/><text x="255.4" y="139.2" font-size="12" text-anchor="end">Braking wheel</text></g>
<g data-part="momentumArrow" class="dg-label"><circle cx="297.6" cy="126.5" r="3.4"/><text x="290.6" y="118.5" font-size="12" text-anchor="end">Momentum (p = mv)</text></g>
</svg>
