<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Electromagnetism">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#ffffff"/>

<!-- Field lines: bar-magnet field from coil ends + concentric field around a wire -->
<g data-part="fieldLine">
  <g fill="none" stroke="#7a8199" stroke-width="1.8" stroke-linecap="round" class="sm-flow" stroke-dasharray="5 5" opacity="0.85">
    <path d="M96 96 C120 40 200 40 224 96"/>
    <path d="M96 104 C130 30 190 30 224 104"/>
  </g>
  <polygon points="158,33 168,35 160,42" fill="#7a8199"/>
  <g fill="none" stroke="#7a8199" stroke-width="1.6">
    <ellipse cx="160" cy="196" rx="30" ry="9"/>
    <ellipse cx="160" cy="196" rx="46" ry="14"/>
  </g>
  <polygon points="130,190 122,196 130,201" fill="#7a8199"/>
  <polygon points="190,201 198,196 190,190" fill="#7a8199"/>
</g>

<!-- Iron core -->
<g data-part="ironCore">
  <rect x="96" y="112" width="128" height="26" rx="5" fill="#c9ccd6" stroke="#7a8199" stroke-width="2"/>
  <line x1="112" y1="118" x2="112" y2="132" stroke="#9aa0ae" stroke-width="1.4"/>
  <line x1="140" y1="118" x2="140" y2="132" stroke="#9aa0ae" stroke-width="1.4"/>
  <line x1="184" y1="118" x2="184" y2="132" stroke="#9aa0ae" stroke-width="1.4"/>
  <line x1="208" y1="118" x2="208" y2="132" stroke="#9aa0ae" stroke-width="1.4"/>
</g>

<!-- Coil turns -->
<g data-part="coilTurns">
  <g fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round">
    <path d="M104 112 C100 100 100 150 104 138"/>
    <path d="M124 112 C120 100 120 150 124 138"/>
    <path d="M144 112 C140 100 140 150 144 138"/>
    <path d="M164 112 C160 100 160 150 164 138"/>
    <path d="M184 112 C180 100 180 150 184 138"/>
    <path d="M204 112 C200 100 200 150 204 138"/>
  </g>
</g>

<!-- North pole at left end -->
<g data-part="northPole">
  <path d="M96 112 h-10 v26 h10 z" fill="#B4341E" stroke="#1E2761" stroke-width="2"/>
  <text x="79" y="129" font-size="12" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-weight="bold">N</text>
</g>

<!-- Battery -->
<g data-part="battery">
  <path d="M104 112 C86 90 70 90 70 118 L70 210" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M204 138 C246 120 250 150 250 176 L250 210" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M70 224 H250" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="150" y1="212" x2="150" y2="236" stroke="#1E2761" stroke-width="3"/>
  <line x1="164" y1="217" x2="164" y2="231" stroke="#1E2761" stroke-width="6"/>
  <text x="142" y="210" font-size="12" fill="#B4341E" text-anchor="middle" font-family="sans-serif" font-weight="bold">+</text>
  <text x="176" y="210" font-size="12" fill="#1E2761" text-anchor="middle" font-family="sans-serif" font-weight="bold">&#8722;</text>
  <polygon points="70,170 66,182 74,182" fill="#B4341E"/>
</g>
</g>
<g data-part="coilTurns" class="dg-label"><circle cx="96.0" cy="87.5" r="3.4"/><text x="96.0" y="79.5" font-size="12" text-anchor="middle">Coil turns</text></g>
<g data-part="ironCore" class="dg-label"><circle cx="166.4" cy="130.0" r="3.4"/><text x="166.4" y="122.0" font-size="12" text-anchor="middle">Iron core</text></g>
<g data-part="northPole" class="dg-label"><circle cx="249.6" cy="130.0" r="3.4"/><text x="249.6" y="122.0" font-size="12" text-anchor="middle">North pole</text></g>
<g data-part="battery" class="dg-label"><circle cx="160.0" cy="230.0" r="3.4"/><text x="160.0" y="222.0" font-size="12" text-anchor="middle">Battery (current)</text></g>
<g data-part="fieldLine" class="dg-label"><circle cx="38.4" cy="130.0" r="3.4"/><text x="45.4" y="122.0" font-size="12" text-anchor="start">Magnetic field</text></g>
</svg>
