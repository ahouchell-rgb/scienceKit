<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Power &amp; efficiency">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#F4F6FC"/>
<g data-part="wall">
  <rect x="96" y="52" width="128" height="118" rx="8" fill="#E4D9C0" stroke="#1E2761" stroke-width="3"/>
  <line x1="96" y1="80" x2="224" y2="80" stroke="#C7B896" stroke-width="1.5"/>
  <line x1="96" y1="108" x2="224" y2="108" stroke="#C7B896" stroke-width="1.5"/>
  <line x1="96" y1="136" x2="224" y2="136" stroke="#C7B896" stroke-width="1.5"/>
  <line x1="160" y1="52" x2="160" y2="80" stroke="#C7B896" stroke-width="1.5"/>
  <line x1="160" y1="108" x2="160" y2="136" stroke="#C7B896" stroke-width="1.5"/>
</g>
<g data-part="insulation">
  <rect x="108" y="64" width="104" height="94" rx="6" fill="none" stroke="#C99528" stroke-width="6" stroke-dasharray="3 6" stroke-linecap="round"/>
</g>
<g data-part="device">
  <rect x="122" y="78" width="76" height="66" rx="6" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <g class="sm-spin">
    <circle cx="160" cy="111" r="19" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
    <circle cx="160" cy="111" r="5" fill="#7a8199" stroke="#1E2761" stroke-width="2"/>
    <line x1="160" y1="94" x2="160" y2="128" stroke="#1E2761" stroke-width="2"/>
    <line x1="143" y1="111" x2="177" y2="111" stroke="#1E2761" stroke-width="2"/>
  </g>
</g>
<g data-part="inputEnergy">
  <polygon class="sm-pulse" points="14,96 78,96 78,84 100,111 78,138 78,126 14,126" fill="#AEB6D6" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g data-part="usefulOutput">
  <polygon class="sm-pulse" points="224,96 284,96 284,84 308,111 284,138 284,126 224,126" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g data-part="wastedEnergy">
  <polygon class="sm-fall" points="152,172 168,172 168,196 180,196 160,228 140,196 152,196" fill="#F1D2D8" stroke="#B4341E" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g data-part="lubrication">
  <ellipse cx="230" cy="180" rx="10" ry="6" fill="#C99528" stroke="#1E2761" stroke-width="2"/>
  <path class="sm-fall" d="M230 186 q-3 8 0 14 q3 -6 0 -14" fill="#C99528" stroke="#C99528" stroke-width="1"/>
  <line x1="218" y1="176" x2="242" y2="176" stroke="#7a8199" stroke-width="4" stroke-linecap="round"/>
</g>
</g>
<g data-part="inputEnergy" class="dg-label"><circle cx="57.6" cy="115.0" r="3.4"/><text x="64.6" y="107.0" font-size="12" text-anchor="start">Input energy</text></g>
<g data-part="device" class="dg-label"><circle cx="128.0" cy="85.0" r="3.4"/><text x="128.0" y="77.0" font-size="12" text-anchor="middle">Device</text></g>
<g data-part="usefulOutput" class="dg-label"><circle cx="272.0" cy="120.0" r="3.4"/><text x="265.0" y="112.0" font-size="12" text-anchor="end">Useful output</text></g>
<g data-part="wastedEnergy" class="dg-label"><circle cx="166.4" cy="225.0" r="3.4"/><text x="166.4" y="217.0" font-size="12" text-anchor="middle">Wasted (dissipated) energy</text></g>
<g data-part="insulation" class="dg-label"><circle cx="118.4" cy="170.0" r="3.4"/><text x="118.4" y="162.0" font-size="12" text-anchor="middle">Insulation</text></g>
<g data-part="lubrication" class="dg-label"><circle cx="166.4" cy="125.0" r="3.4"/><text x="166.4" y="117.0" font-size="12" text-anchor="middle">Lubricated part</text></g>
<g data-part="wall" class="dg-label"><circle cx="217.6" cy="75.0" r="3.4"/><text x="217.6" y="67.0" font-size="12" text-anchor="middle">Thick wall</text></g>
</svg>
