<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Energy changes">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="6" y="6" width="308" height="218" rx="14" fill="#F4F6FC" stroke="#7a8199" stroke-width="2"/><g data-part="surroundings"><rect x="18" y="18" width="284" height="194" rx="10" fill="none" stroke="#AEB6D6" stroke-width="2" stroke-dasharray="7 6"/><line x1="160" y1="24" x2="160" y2="206" stroke="#AEB6D6" stroke-width="1.5" stroke-dasharray="4 6"/></g><g data-part="exoBeaker"><path d="M50 96 L50 178 Q50 194 66 194 L112 194 Q128 194 128 178 L128 96 Z" fill="#F1D2D8" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/><ellipse cx="89" cy="96" rx="39" ry="8" fill="#F4B4B0" stroke="#1E2761" stroke-width="3"/><path class="sm-rise" d="M76 90 Q72 80 78 72" fill="none" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/><path class="sm-rise" d="M100 90 Q104 80 98 72" fill="none" stroke="#B4341E" stroke-width="2.5" stroke-linecap="round"/></g><g data-part="energyOut"><path class="sm-throb" d="M46 130 L24 122" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encRed)"/><path class="sm-throb" d="M46 160 L24 168" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encRed)"/><path class="sm-throb" d="M132 130 L154 122" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encRed)"/><path class="sm-throb" d="M132 160 L154 168" fill="none" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encRed)"/></g><g data-part="thermometer"><rect x="153" y="112" width="14" height="78" rx="7" fill="#ffffff" stroke="#1E2761" stroke-width="2.5"/><circle cx="160" cy="192" r="12" fill="#B4341E" stroke="#1E2761" stroke-width="2.5"/><rect class="sm-pulse" x="156" y="150" width="8" height="42" fill="#B4341E"/><line x1="169" y1="126" x2="176" y2="126" stroke="#7a8199" stroke-width="1.5"/><line x1="169" y1="150" x2="176" y2="150" stroke="#7a8199" stroke-width="1.5"/><line x1="169" y1="174" x2="176" y2="174" stroke="#7a8199" stroke-width="1.5"/></g><g data-part="endoBeaker"><path d="M192 96 L192 178 Q192 194 208 194 L254 194 Q270 194 270 178 L270 96 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="3" stroke-linejoin="round"/><ellipse cx="231" cy="96" rx="39" ry="8" fill="#B7DAF2" stroke="#1E2761" stroke-width="3"/><path class="sm-drift" d="M214 108 l8 8 M222 108 l-8 8" stroke="#1E2761" stroke-width="1.5" stroke-linecap="round"/></g><g data-part="energyIn"><path class="sm-throb" d="M188 130 L166 122" fill="none" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encBlue)"/><path class="sm-throb" d="M188 160 L166 168" fill="none" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encBlue)"/><path class="sm-throb" d="M274 130 L296 122" fill="none" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encBlue)"/><path class="sm-throb" d="M274 160 L296 168" fill="none" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round" marker-end="url(#encBlue)"/></g><defs><marker id="encRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B4341E"/></marker><marker id="encBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2761"/></marker></defs>
</g>
<g data-part="exoBeaker" class="dg-label"><circle cx="86.4" cy="170.2" r="3.4"/><text x="86.4" y="162.2" font-size="12" text-anchor="middle">Exothermic</text></g>
<g data-part="energyOut" class="dg-label"><circle cx="86.4" cy="50.6" r="3.4"/><text x="86.4" y="42.6" font-size="12" text-anchor="middle">Energy out</text></g>
<g data-part="endoBeaker" class="dg-label"><circle cx="230.4" cy="170.2" r="3.4"/><text x="230.4" y="162.2" font-size="12" text-anchor="middle">Endothermic</text></g>
<g data-part="energyIn" class="dg-label"><circle cx="230.4" cy="50.6" r="3.4"/><text x="230.4" y="42.6" font-size="12" text-anchor="middle">Energy in</text></g>
<g data-part="thermometer" class="dg-label"><circle cx="240.0" cy="133.4" r="3.4"/><text x="240.0" y="125.4" font-size="12" text-anchor="middle">Thermometer</text></g>
<g data-part="surroundings" class="dg-label"><circle cx="160.0" cy="211.6" r="3.4"/><text x="160.0" y="203.6" font-size="12" text-anchor="middle">Surroundings</text></g>
</svg>
