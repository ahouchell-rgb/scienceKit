<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Crude oil &amp; hydrocarbons">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="300" fill="#F4F6FC"/>
<!-- scaffolding: column body (tall tower, wider at base) -->
<g data-part="column">
  <path d="M112 46 L208 46 L226 272 L94 272 Z" fill="#ffffff" stroke="#1E2761" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- internal trays -->
  <line x1="104" y1="94" x2="216" y2="94" stroke="#7a8199" stroke-width="1.6"/>
  <line x1="100" y1="140" x2="220" y2="140" stroke="#7a8199" stroke-width="1.6"/>
  <line x1="97" y1="186" x2="223" y2="186" stroke="#7a8199" stroke-width="1.6"/>
  <line x1="95" y1="230" x2="225" y2="230" stroke="#7a8199" stroke-width="1.6"/>
</g>
<!-- COOL TOP: cold zone marker + thermometer high, blue tint -->
<g data-part="coolTop">
  <rect x="118" y="50" width="84" height="40" rx="5" fill="#DCEAF6" stroke="#1E2761" stroke-width="1.6"/>
  <text x="160" y="75" font-family="sans-serif" font-size="15" fill="#1E2761" text-anchor="middle" font-weight="700">20&#176;C</text>
</g>
<!-- HOT BOTTOM furnace: red flames under base -->
<g data-part="hotBottom">
  <rect x="96" y="234" width="128" height="36" rx="4" fill="#F1D2D8" stroke="#B4341E" stroke-width="1.6"/>
  <text x="160" y="258" font-family="sans-serif" font-size="15" fill="#B4341E" text-anchor="middle" font-weight="700">350&#176;C</text>
  <g class="sm-glow">
    <path d="M120 292 q6 -18 14 -8 q4 -14 12 -2 q6 -14 12 0 q8 -12 14 2 q8 -12 14 6 q6 -10 12 2" fill="none" stroke="#B4341E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 292 q4 -14 10 -4 q5 -12 10 2 q6 -10 10 2" fill="none" stroke="#C99528" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</g>
<!-- CRUDE OIL IN: pipe entering base, arrow -->
<g data-part="crudeOilInlet">
  <line x1="36" y1="252" x2="96" y2="252" stroke="#1E2761" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="34" cy="252" r="9" fill="#1E2761"/>
  <polyline points="84,244 96,252 84,260" fill="none" stroke="#1E2761" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- vapour rising arrow inside column (scaffolding, always shown) -->
<g class="sm-rise">
  <line x1="160" y1="228" x2="160" y2="110" stroke="#7a8199" stroke-width="2" stroke-dasharray="5 5"/>
  <polyline points="153,120 160,108 167,120" fill="none" stroke="#7a8199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- SHORT-CHAIN FRACTION: tapped off high, light/runny, outlet pipe top-right -->
<g data-part="topFraction">
  <line x1="216" y1="98" x2="272" y2="98" stroke="#2C5F2D" stroke-width="3.2" stroke-linecap="round"/>
  <polyline points="262,90 272,98 262,106" fill="none" stroke="#2C5F2D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="272" y="88" width="26" height="20" rx="4" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="2"/>
  <!-- short molecule -->
  <circle cx="279" cy="98" r="3.2" fill="#fff" stroke="#2C5F2D" stroke-width="1.6"/>
  <circle cx="290" cy="98" r="3.2" fill="#fff" stroke="#2C5F2D" stroke-width="1.6"/>
</g>
<!-- LONG-CHAIN FRACTION: tapped off low, thick/sticky, outlet bottom-right -->
<g data-part="bottomFraction">
  <line x1="220" y1="216" x2="278" y2="216" stroke="#B4341E" stroke-width="3.2" stroke-linecap="round"/>
  <polyline points="268,208 278,216 268,224" fill="none" stroke="#B4341E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="278" y="206" width="30" height="20" rx="4" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
  <!-- long molecule -->
  <circle cx="284" cy="216" r="3.2" fill="#fff" stroke="#1E2761" stroke-width="1.6"/>
  <circle cx="293" cy="216" r="3.2" fill="#fff" stroke="#1E2761" stroke-width="1.6"/>
  <circle cx="302" cy="216" r="3.2" fill="#fff" stroke="#1E2761" stroke-width="1.6"/>
</g>
</g>
<g data-part="crudeOilInlet" class="dg-label"><circle cx="70.4" cy="258.0" r="3.4"/><text x="70.4" y="250.0" font-size="12" text-anchor="middle">Crude oil in</text></g>
<g data-part="column" class="dg-label"><circle cx="121.6" cy="54.0" r="3.4"/><text x="121.6" y="46.0" font-size="12" text-anchor="middle">Fractionating column</text></g>
<g data-part="coolTop" class="dg-label"><circle cx="201.6" cy="87.0" r="3.4"/><text x="201.6" y="79.0" font-size="12" text-anchor="middle">Cool top</text></g>
<g data-part="topFraction" class="dg-label"><circle cx="160.0" cy="132.0" r="3.4"/><text x="160.0" y="124.0" font-size="12" text-anchor="middle">Short-chain fraction</text></g>
<g data-part="bottomFraction" class="dg-label"><circle cx="160.0" cy="204.0" r="3.4"/><text x="160.0" y="196.0" font-size="12" text-anchor="middle">Long-chain fraction</text></g>
<g data-part="hotBottom" class="dg-label"><circle cx="179.2" cy="285.0" r="3.4"/><text x="179.2" y="277.0" font-size="12" text-anchor="middle">Hot bottom (furnace)</text></g>
</svg>
