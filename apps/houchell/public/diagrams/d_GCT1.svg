<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Earth's atmosphere &amp; its evolution">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="240" rx="10" fill="#F4F6FC" stroke="#1E2761" stroke-width="3"/>
<rect x="6" y="6" width="308" height="228" rx="7" fill="#FFFFFF"/>
<rect x="6" y="6" width="308" height="70" rx="7" fill="#DCEAF6"/>
<path d="M6 150 L314 150 L314 227 Q314 234 307 234 L13 234 Q6 234 6 227 Z" fill="#EFE6D2"/>
<g data-part="atmosphere">
  <g class="sm-drift">
    <circle cx="30" cy="26" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="70" cy="46" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="120" cy="28" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="205" cy="24" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="255" cy="48" r="7" fill="#AEB6D6" stroke="#1E2761" stroke-width="2"/>
    <circle cx="160" cy="52" r="5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.8"/>
    <circle cx="290" cy="26" r="5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.8"/>
    <circle cx="98" cy="58" r="5" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.8"/>
  </g>
</g>
<g data-part="volcano">
  <path d="M20 150 L52 92 L84 150 Z" fill="#8A6A52" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M40 108 L52 92 L64 108 Q52 100 40 108 Z" fill="#B4341E" stroke="#B4341E" stroke-width="1"/>
  <g class="sm-rise">
    <path d="M52 92 Q40 74 50 60 Q60 50 48 40" fill="none" stroke="#7a8199" stroke-width="3" stroke-linecap="round"/>
    <circle cx="46" cy="42" r="6" fill="#AEB6D6" stroke="#7a8199" stroke-width="1.5"/>
    <circle cx="58" cy="56" r="5" fill="#AEB6D6" stroke="#7a8199" stroke-width="1.5"/>
  </g>
</g>
<g data-part="ocean">
  <path d="M100 158 Q140 148 180 158 T260 158 T300 156 L300 210 L100 210 Z" fill="#DCEAF6" stroke="#1E2761" stroke-width="2.5"/>
  <path d="M108 168 q14 -6 28 0 t28 0 t28 0 t28 0" fill="none" stroke="#1E2761" stroke-width="1.6" opacity="0.5"/>
</g>
<g data-part="algae">
  <ellipse cx="150" cy="192" rx="14" ry="9" fill="#2C5F2D"/>
  <ellipse cx="150" cy="192" rx="14" ry="9" fill="none" stroke="#1E2761" stroke-width="1.5"/>
  <g class="sm-rise" stroke="#2C5F2D" stroke-width="0" fill="#CDE5C6">
    <circle cx="146" cy="176" r="3.5" stroke="#2C5F2D" stroke-width="1.4"/>
    <circle cx="156" cy="170" r="3" stroke="#2C5F2D" stroke-width="1.4"/>
    <circle cx="150" cy="182" r="3" stroke="#2C5F2D" stroke-width="1.4"/>
  </g>
</g>
<g data-part="plants">
  <path d="M245 200 L245 168" fill="none" stroke="#2C5F2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M245 178 Q228 172 222 158 Q240 158 245 172 Z" fill="#2C5F2D" stroke="#1E2761" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M245 184 Q262 178 268 164 Q250 164 245 178 Z" fill="#2C5F2D" stroke="#1E2761" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M245 158 Q238 148 245 140 Q252 148 245 158 Z" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<g data-part="sedimentaryRock">
  <path d="M6 214 L314 214 L314 227 Q314 234 307 234 L13 234 Q6 234 6 227 Z" fill="#C9A76B" stroke="#1E2761" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 220 L120 217 M150 226 L250 223 M60 229 L200 229 M230 219 L300 221" stroke="#8A6A52" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="90" cy="224" r="2.4" fill="#3a3a3a"/>
  <circle cx="180" cy="221" r="2.4" fill="#3a3a3a"/>
  <circle cx="255" cy="227" r="2.4" fill="#3a3a3a"/>
</g>
</g>
<g data-part="atmosphere" class="dg-label"><circle cx="160.0" cy="40.8" r="3.4"/><text x="160.0" y="32.8" font-size="12" text-anchor="middle">Atmosphere (N₂ + O₂)</text></g>
<g data-part="volcano" class="dg-label"><circle cx="60.8" cy="124.8" r="3.4"/><text x="67.8" y="116.8" font-size="12" text-anchor="start">Volcano (CO₂ + steam)</text></g>
<g data-part="ocean" class="dg-label"><circle cx="128.0" cy="172.8" r="3.4"/><text x="128.0" y="164.8" font-size="12" text-anchor="middle">Ocean</text></g>
<g data-part="algae" class="dg-label"><circle cx="176.0" cy="158.4" r="3.4"/><text x="176.0" y="150.4" font-size="12" text-anchor="middle">Algae</text></g>
<g data-part="plants" class="dg-label"><circle cx="256.0" cy="187.2" r="3.4"/><text x="249.0" y="179.2" font-size="12" text-anchor="end">Plants</text></g>
<g data-part="sedimentaryRock" class="dg-label"><circle cx="105.6" cy="220.8" r="3.4"/><text x="105.6" y="212.8" font-size="12" text-anchor="middle">Sedimentary rock</text></g>
</svg>
