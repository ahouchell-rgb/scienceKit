<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Forces, weight &amp; resultants">
<style>[class*="sm-"]{transform-box:fill-box;transform-origin:center;}
[data-part]{transition:opacity .55s ease;}
.sm-spin{ animation:sm-spin 3s linear infinite; }
.sm-spin-slow{ animation:sm-spin 9s linear infinite; }
.sm-spin-rev{ animation:sm-spin 3s linear infinite reverse; }
.sm-flow{ animation:sm-flow 1s linear infinite; }
.sm-flow-slow{ animation:sm-flow 2.2s linear infinite; }
.sm-flow-rev{ animation:sm-flow-rev 1.4s linear infinite; }
.sm-pulse{ animation:sm-pulse 1.6s ease-in-out infinite; }
.sm-throb{ animation:sm-throb 1s ease-in-out infinite; }
.sm-drift{ animation:sm-drift 2.6s ease-in-out infinite; }
.sm-osc{ animation:sm-osc 1.8s ease-in-out infinite; }
.sm-osc-x{ animation:sm-osc-x 1.8s ease-in-out infinite; }
.sm-rise{ animation:sm-rise 2.6s ease-in infinite; }
.sm-fall{ animation:sm-fall 2.6s ease-in infinite; }
.sm-blink{ animation:sm-blink 1.4s ease-in-out infinite; }
.sm-glow{ animation:sm-glow 2s ease-in-out infinite; }
.sm-shake{ animation:sm-shake .3s ease-in-out infinite; }
.sm-sweep{ animation:sm-sweep 2.8s ease-in-out infinite; }
@keyframes sm-spin{ to{ transform:rotate(360deg); } }
@keyframes sm-flow{ to{ stroke-dashoffset:-24; } }
@keyframes sm-flow-rev{ to{ stroke-dashoffset:24; } }
@keyframes sm-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.13); } }
@keyframes sm-throb{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes sm-drift{ 0%{ transform:translate(0,0); } 25%{ transform:translate(2px,-2.5px); } 50%{ transform:translate(-2.5px,1.5px); } 75%{ transform:translate(1.5px,2px); } 100%{ transform:translate(0,0); } }
@keyframes sm-osc{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes sm-osc-x{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(5px); } }
@keyframes sm-rise{ 0%{ transform:translateY(2px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(-16px); opacity:0; } }
@keyframes sm-fall{ 0%{ transform:translateY(-14px); opacity:0; } 25%{ opacity:.85; } 100%{ transform:translateY(4px); opacity:0; } }
@keyframes sm-blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
@keyframes sm-glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes sm-shake{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(.9px,-.9px); } 75%{ transform:translate(-.9px,.9px); } }
@keyframes sm-sweep{ 0%{ transform:translateX(-6px); opacity:.35; } 50%{ opacity:1; } 100%{ transform:translateX(6px); opacity:.35; } }
@media (prefers-reduced-motion:reduce){[class*="sm-"]{animation:none !important;}}
.dg-label text{font-family:'Century Gothic','Avenir Next',system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;fill:#1E2761;}
.dg-label circle{fill:#1E2761;stroke:#ffffff;stroke-width:1.5;}</style>
<g class="diagram-art">
<rect x="0" y="0" width="320" height="250" fill="#F4F6FC"/>
<line x1="18" y1="168" x2="228" y2="168" stroke="#1E2761" stroke-width="3" stroke-linecap="round"/>
<line x1="34" y1="168" x2="24" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<line x1="62" y1="168" x2="52" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="168" x2="80" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<line x1="118" y1="168" x2="108" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<line x1="146" y1="168" x2="136" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<line x1="174" y1="168" x2="164" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<line x1="202" y1="168" x2="192" y2="182" stroke="#7a8199" stroke-width="2" stroke-linecap="round"/>
<defs>
  <marker id="ar1n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2761"/></marker>
  <marker id="ar1r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B4341E"/></marker>
  <marker id="ar1g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C99528"/></marker>
</defs>
<g data-part="object">
  <rect x="100" y="128" width="72" height="40" rx="6" fill="#CDE5C6" stroke="#2C5F2D" stroke-width="3"/>
</g>
<g data-part="centreOfMass">
  <circle cx="136" cy="148" r="6.5" fill="#fff" stroke="#1E2761" stroke-width="2"/>
  <path d="M136 141.5 A6.5 6.5 0 0 1 142.5 148 L136 148 Z" fill="#1E2761"/>
  <path d="M136 154.5 A6.5 6.5 0 0 1 129.5 148 L136 148 Z" fill="#1E2761"/>
</g>
<g data-part="normalForce">
  <line x1="136" y1="128" x2="136" y2="66" stroke="#1E2761" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar1n)"/>
</g>
<g data-part="weight">
  <line x1="136" y1="148" x2="136" y2="228" stroke="#B4341E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar1r)"/>
</g>
<g data-part="resultant">
  <circle cx="248" cy="90" r="24" fill="#fff" stroke="#1E2761" stroke-width="2.5"/>
  <line x1="248" y1="102" x2="248" y2="82" stroke="#1E2761" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1n)"/>
  <line x1="248" y1="78" x2="248" y2="98" stroke="#B4341E" stroke-width="3" stroke-linecap="round" marker-end="url(#ar1r)"/>
  <text x="248" y="132" font-family="sans-serif" font-size="15" font-weight="700" fill="#1E2761" text-anchor="middle">= 0 N</text>
</g>
<g data-part="component">
  <line x1="262" y1="216" x2="304" y2="174" stroke="#C99528" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar1g)"/>
  <line x1="262" y1="216" x2="298" y2="216" stroke="#7a8199" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="298" y1="216" x2="298" y2="180" stroke="#7a8199" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <path d="M270 216 A8 8 0 0 0 267 210" fill="none" stroke="#7a8199" stroke-width="1.5"/>
</g>
</g>
<g data-part="object" class="dg-label"><circle cx="121.6" cy="170.0" r="3.4"/><text x="121.6" y="162.0" font-size="12" text-anchor="middle">Object</text></g>
<g data-part="normalForce" class="dg-label"><circle cx="160.0" cy="72.5" r="3.4"/><text x="160.0" y="64.5" font-size="12" text-anchor="middle">Normal contact force</text></g>
<g data-part="weight" class="dg-label"><circle cx="160.0" cy="230.0" r="3.4"/><text x="160.0" y="222.0" font-size="12" text-anchor="middle">Weight (W = mg)</text></g>
<g data-part="centreOfMass" class="dg-label"><circle cx="160.0" cy="150.0" r="3.4"/><text x="160.0" y="142.0" font-size="12" text-anchor="middle">Centre of mass</text></g>
<g data-part="resultant" class="dg-label"><circle cx="256.0" cy="150.0" r="3.4"/><text x="249.0" y="142.0" font-size="12" text-anchor="end">Resultant force</text></g>
<g data-part="component" class="dg-label"><circle cx="294.4" cy="47.5" r="3.4"/><text x="287.4" y="39.5" font-size="12" text-anchor="end">Resolved component</text></g>
</svg>
